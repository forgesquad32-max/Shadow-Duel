            tri(x - r, y - r * 0.2f, x + r, y - r * 0.2f, x, y - r, C(150, 240, 255, 255));
            tri(x - r, y - r * 0.2f, x + r, y - r * 0.2f, x, y + r, C(60, 170, 235, 255));
            tri(x - r * 0.4f, y - r * 0.2f, x + r * 0.4f, y - r * 0.2f, x, y + r * 0.7f, C(200, 250, 255, 255));
          }


          /* ---------------------------------------------------------------- audio */
          static const int SC_HIRA[5] = {0, 2, 3, 7, 8};
          static const int SC_MINP[5] = {0, 3, 5, 7, 10};
          static const int SC_INSEN[5] = {0, 1, 5, 7, 10};
          static const int SC_PHRY[7] = {0, 1, 3, 5, 7, 8, 10};
          static const int *SC_TAB[4] = {SC_HIRA, SC_MINP, SC_INSEN, SC_PHRY};
          static const int SC_NUM[4] = {5, 5, 5, 7};
          static const float T_BPM[7] = {84, 108, 116, 124, 132, 142, 78};
          static const int T_ROOT[7] = {50, 45, 47, 43, 48, 41, 53};
          static const int T_SCALE[7] = {0, 1, 0, 2, 3, 3, 1};

          static int mTrack = -1, mInten = 0, mStep = 0, mNs = 5, mRoot = 45, mDrums = 0, mArp = 0, mProg[4];
          static const int *mScale = SC_HIRA;
          static float mSub = 0, mBpm = 100;
          static int bassP[64], leadP[64];
          static float bPh, lPh, aPh, kPh, bF = 110, lF = 440, aF = 440, bE, lE, aE, kE, kF, sE, hE, lp1, hpPrev;
          static unsigned nsd = 12345u, gsd = 1u;
          static ndspWaveBuf mwb[3], swb[4];
          static s16 *mbuf[3];
          static Snd snd[NSND];

          static float nrand(void) { nsd = nsd * 1664525u + 1013904223u; return ((nsd >> 8) & 0xffff) / 32768.0f - 1.0f; }
          static unsigned lcg(unsigned *s) { *s = *s * 1664525u + 1013904223u; return *s >> 16; }
          static float mfreq(int m) { return 440.0f * powf(2.0f, (m - 69) / 12.0f); }
          static int dmidi(int base, int deg) { return base + mScale[deg % mNs] + 12 * (deg / mNs); }
          static s16 f2s(float v) { if (v > 1.0f) v = 1.0f; if (v < -1.0f) v = -1.0f; return (s16)(v * 30000.0f); }

          static void gen_track(int t, int inten) {
            unsigned s = 1234u + (unsigned)t * 977u;
            int sc = T_SCALE[t], b, st, i, calm = (t == 0 || t == 6);
            int A[16], B[16], d;
            mScale = SC_TAB[sc]; mNs = SC_NUM[sc]; mRoot = T_ROOT[t]; mBpm = T_BPM[t] + (inten ? 10.0f : 0.0f);
            mProg[0] = 0; mProg[1] = 1 + (int)(lcg(&s) % (unsigned)(mNs - 1)); mProg[2] = (int)(lcg(&s) % (unsigned)mNs);
            mProg[3] = 1 + (int)(lcg(&s) % (unsigned)(mNs - 1));
            d = mNs + (int)(lcg(&s) % (unsigned)mNs);
            for (i = 0; i < 16; i++) {
              int delta[5] = {-2, -1, 0, 1, 2};
              if (i != 0 && (int)(lcg(&s) % 100u) < (calm ? 55 : 35)) { A[i] = -1; continue; }
              d = clampi(d + delta[lcg(&s) % 5u], mNs - 1, mNs * 2 + 1);
              A[i] = d;
            }
            for (i = 0; i < 16; i++) {
              int delta[5] = {-2, -1, 0, 1, 2};
              if (i != 0 && (int)(lcg(&s) % 100u) < (calm ? 55 : 35)) { B[i] = -1; continue; }
              d = clampi(d + delta[lcg(&s) % 5u], mNs - 1, mNs * 2 + 1);
              B[i] = d;
            }
            for (b = 0; b < 4; b++) {
              for (st = 0; st < 16; st++) {
                int hit = calm ? (st == 0 || st == 8) : (st == 0 || st == 3 || st == 6 || st == 8 || st == 11 || st == 14);
                bassP[b * 16 + st] = hit ? mProg[b] : -1;
                leadP[b * 16 + st] = (b == 2) ? B[st] : ((b == 3 && st >= 12) ? B[st] : A[st]);
              }
            }
            mDrums = !calm; mArp = (t >= 2 && t != 6) || inten;
          }

          static void music_play(int t, int inten) {
            if (t == mTrack && inten == mInten) return;
            mTrack = t; mInten = inten;
            mStep = 63; mSub = 0; bE = lE = aE = kE = sE = hE = 0; bPh = lPh = aPh = kPh = 0; lp1 = 0;
            if (t >= 0) gen_track(t, inten);
          }

          static void music_fill(s16 *out, int n) {
            int i;
            float stepLen;
            if (mTrack < 0 || !sv.music) { memset(out, 0, (size_t)n * 2); return; }
            stepLen = SR * 60.0f / mBpm / 4.0f;
            for (i = 0; i < n; i++) {
              float bs, ls, as = 0, ks = 0, rn, m;
              if (mSub <= 0.0f) {
                int st;
                mStep = (mStep + 1) & 63; mSub += stepLen; st = mStep & 15;
                if (bassP[mStep] >= 0) { bF = mfreq(dmidi(mRoot - 12, bassP[mStep])); bE = 1.0f; }
                if (leadP[mStep] >= 0) { lF = mfreq(dmidi(mRoot + 12, leadP[mStep])); lE = 1.0f; }
                if (mArp) {
                  static const int ao[4] = {0, 2, 4, 2};
                  aF = mfreq(dmidi(mRoot + 24, mProg[mStep >> 4] + ao[st & 3])); aE = 1.0f;
                }
                if (mDrums) {
                  if (st == 0 || st == 8 || (mBpm > 120.0f && (st == 6 || st == 14))) kE = 1.0f;
                  if (st == 4 || st == 12) sE = 1.0f;
                  if ((st & 1) == 0 || mInten) hE = 1.0f;
                }
              }
              mSub -= 1.0f;
              bs = (4.0f * fabsf(bPh - 0.5f) - 1.0f) * bE * 0.30f;
              ls = (lPh < 0.32f) ? 1.0f : -1.0f;
              lp1 += 0.28f * (ls - lp1);
              ls = lp1 * lE * 0.16f;
              if (mArp && aE > 0.003f) as = sinf(TAU_F * aPh) * aE * 0.07f;
              if (kE > 0.003f) { kF = 42.0f + 110.0f * kE * kE; ks = sinf(TAU_F * kPh) * kE * 0.55f; kPh += kF / SR; if (kPh >= 1.0f) kPh -= 1.0f; }
              rn = nrand();
              m = (bs + ls + as + ks + rn * sE * 0.20f + (rn - hpPrev) * hE * 0.10f) * 0.8f;
              hpPrev = rn;
              out[i] = f2s(m);
              bPh += bF / SR; if (bPh >= 1.0f) bPh -= 1.0f;
              lPh += lF / SR; if (lPh >= 1.0f) lPh -= 1.0f;
              aPh += aF / SR; if (aPh >= 1.0f) aPh -= 1.0f;
              bE *= 0.99975f; lE *= 0.99985f; aE *= 0.9996f; kE *= 0.9994f; sE *= 0.9993f; hE *= 0.9985f;
            }
          }

          static s16 *alloc_snd(int id, int n) {
            snd[id].d = (s16 *)linearAlloc((size_t)n * 2);
            snd[id].n = snd[id].d ? n : 0;
            return snd[id].d;
          }

          #define GEN(id, dur, expr) { int n_ = (int)(SR * (dur)); s16 *d_ = alloc_snd(id, n_); int i_; if (d_) for (i_ = 0; i_ < n_; i_++) { float t = (float)i_ / SR; d_[i_] = f2s(expr); } }

          static float jingle(float t, const float *nf, float len) {
            int k = (int)(t / len);
            float lt;
            if (k > 3) k = 3;
            lt = t - k * len;
            return 0.35f * sinf(TAU_F * nf[k] * t) * expf(-lt * 3.0f) * (t < 1.0f ? 1.0f : 0.0f);
          }

          static void gen_all(void) {
            static const float wn[4] = {392.0f, 494.0f, 587.0f, 784.0f};
            static const float ln[4] = {392.0f, 349.0f, 330.0f, 262.0f};
            static const float hn[4] = {523.0f, 659.0f, 784.0f, 1047.0f};
            GEN(SFX_PUNCH, 0.12, 0.6f * nrand() * expf(-t * 35.0f) + 0.6f * sinf(TAU_F * 130.0f * t) * expf(-t * 28.0f));
            GEN(SFX_KICK, 0.16, 0.5f * nrand() * expf(-t * 22.0f) + 0.8f * sinf(TAU_F * (60.0f + 40.0f * expf(-t * 20.0f)) * t) * expf(-t * 16.0f));
            GEN(SFX_HIT, 0.18, 0.8f * nrand() * expf(-t * 18.0f) + 0.7f * sinf(TAU_F * (80.0f + 120.0f * expf(-t * 25.0f)) * t) * expf(-t * 12.0f));
            GEN(SFX_BLOCK, 0.15, 0.45f * (sinf(TAU_F * 900.0f * t) + 0.6f * sinf(TAU_F * 1350.0f * t)) * expf(-t * 24.0f));
            GEN(SFX_BOLT, 0.35, 0.5f * sinf(TAU_F * (300.0f + 600.0f * t / 0.35f) * t) * (1.0f - t / 0.35f) * (0.7f + 0.3f * sinf(TAU_F * 30.0f * t)));
            GEN(SFX_KO, 0.7, 0.7f * sinf(TAU_F * (220.0f - 170.0f * t / 0.7f) * t) * (1.0f - t / 0.7f) + 0.5f * nrand() * expf(-t * 14.0f));
            GEN(SFX_COIN, 0.25, 0.3f * ((sinf(TAU_F * (t < 0.08f ? 988.0f : 1319.0f) * t) > 0.0f) ? 1.0f : -1.0f) * expf(-(t < 0.08f ? t : t - 0.08f) * 10.0f));
            GEN(SFX_SEL, 0.1, 0.4f * sinf(TAU_F * (660.0f + 220.0f * t / 0.1f) * t) * (1.0f - t / 0.1f));
            GEN(SFX_MOVE, 0.04, 0.3f * sinf(TAU_F * 440.0f * t) * (1.0f - t / 0.04f));
            GEN(SFX_ERR, 0.2, 0.3f * ((sinf(TAU_F * 110.0f * t) > 0.0f) ? 1.0f : -1.0f) * (1.0f - t / 0.2f));
            GEN(SFX_WIN, 1.0, jingle(t, wn, 0.2f));
            GEN(SFX_LOSE, 1.0, jingle(t, ln, 0.25f));
            GEN(SFX_JUMP, 0.12, 0.35f * sinf(TAU_F * (300.0f + 300.0f * t / 0.12f) * t) * (1.0f - t / 0.12f));
            GEN(SFX_HEAL, 0.5, jingle(t * 2.0f, hn, 0.18f) * 1.1f);
            GEN(SFX_QUAKE, 0.5, 0.9f * sinf(TAU_F * 50.0f * t) * expf(-t * 7.0f) + 0.6f * nrand() * expf(-t * 9.0f));
            GEN(SFX_THROW, 0.12, 0.4f * nrand() * sinf(PI_F * t / 0.12f));
            GEN(SFX_ZAP, 0.25, 0.6f * nrand() * expf(-t * 12.0f) + 0.4f * sinf(TAU_F * 1800.0f * t) * expf(-t * 20.0f));
            GEN(SFX_BOOM, 0.6, 0.9f * nrand() * expf(-t * 6.0f) + 0.8f * sinf(TAU_F * (70.0f - 30.0f * t) * t) * expf(-t * 5.0f));
            GEN(SFX_FIRE, 0.4, 0.35f * nrand() * sinf(PI_F * t / 0.4f));
            GEN(SFX_LEVEL, 0.6, jingle(t * 1.6f, hn, 0.15f) * 1.2f);
            GEN(SFX_ACH, 0.4, 0.3f * sinf(TAU_F * (t < 0.1f ? 1319.0f : 1760.0f) * t) * expf(-t * 6.0f));
          }

          static void sfx(int id) {
            int c;
            if (!audioOk || !sv.sfx || !snd[id].d) return;
            for (c = 0; c < 4; c++) {
              if (swb[c].status == NDSP_WBUF_DONE || swb[c].status == NDSP_WBUF_FREE) {
                swb[c].data_pcm16 = snd[id].d; swb[c].nsamples = (u32)snd[id].n; swb[c].looping = false;
                ndspChnWaveBufAdd(1 + c, &swb[c]);
                return;
              }
            }
          }

          static void audio_init(void) {
            int i;
            float mix[12];
            audioOk = 0;
            if (R_FAILED(ndspInit())) return;
            ndspSetOutputMode(NDSP_OUTPUT_STEREO);
            memset(mix, 0, sizeof mix); mix[0] = 0.8f; mix[1] = 0.8f;
            for (i = 0; i < 5; i++) {
              ndspChnReset(i);
              ndspChnSetInterp(i, NDSP_INTERP_LINEAR);
              ndspChnSetRate(i, (float)SR);
              ndspChnSetFormat(i, NDSP_FORMAT_MONO_PCM16);
              ndspChnSetMix(i, mix);
            }
            gen_all();
            memset(mwb, 0, sizeof mwb); memset(swb, 0, sizeof swb);
            for (i = 0; i < 3; i++) {
              mbuf[i] = (s16 *)linearAlloc(ABUF * 2);
              if (!mbuf[i]) return;
              music_fill(mbuf[i], ABUF);
              DSP_FlushDataCache(mbuf[i], ABUF * 2);
              mwb[i].data_pcm16 = mbuf[i]; mwb[i].nsamples = ABUF; mwb[i].looping = false;
              ndspChnWaveBufAdd(0, &mwb[i]);
            }
            for (i = 0; i < NSND; i++) if (snd[i].d) DSP_FlushDataCache(snd[i].d, (u32)snd[i].n * 2);
            audioOk = 1;
          }

          static void audio_update(void) {
            int i;
            if (!audioOk) return;
            for (i = 0; i < 3; i++) {
              if (mwb[i].status == NDSP_WBUF_DONE) {
                music_fill(mbuf[i], ABUF);
                DSP_FlushDataCache(mbuf[i], ABUF * 2);
                ndspChnWaveBufAdd(0, &mwb[i]);
              }
            }
          }



          /* ----------------------------------------------------------------- save */
          static int sv_chk(const Save *s) {
            const unsigned char *p = (const unsigned char *)s;
            unsigned h = 2166136261u;
            size_t i, n = sizeof(Save) - sizeof(int);
            for (i = 0; i < n; i++) h = (h ^ p[i]) * 16777619u;
            return (int)h;
          }

          static void sv_defaults(void) {
            Save old = sv;
            int keep = (old.magic == SAVE_MAGIC), i;
            memset(&sv, 0, sizeof sv);
            sv.magic = SAVE_MAGIC; sv.version = SAVE_VER;
            sv.level = 1; sv.actsUnlocked = 1;
            sv.wOwn = 1; sv.rOwn = 1; sv.aOwn = 1; sv.hOwn = 1; sv.mOwn = 1; sv.eEq = -1;
            sv.diff = 1; sv.rounds = 2; sv.timeIdx = 1; sv.shake = 1; sv.music = 1; sv.sfx = 1; sv.lang = 0;
            sv.keymap[AC_PUNCH] = 1; sv.keymap[AC_KICK] = 2; sv.keymap[AC_WEAPON] = 3; sv.keymap[AC_RANGED] = 4;
            sv.keymap[AC_BLOCK] = 5; sv.keymap[AC_MAGIC] = 6; sv.keymap[AC_JUMP] = 0; sv.keymap[AC_DASH] = 0;
            if (keep) {
              sv.diff = old.diff; sv.rounds = old.rounds; sv.timeIdx = old.timeIdx; sv.shake = old.shake; sv.box = old.box;
              sv.lang = old.lang; sv.music = old.music; sv.sfx = old.sfx;
              for (i = 0; i < NAC; i++) sv.keymap[i] = old.keymap[i];
            }
          }

          static int save_game(void) {
            FILE *f;
            size_t w;
            mkdir(SD_ROOT "/3ds", 0777);
            mkdir(SD_ROOT "/3ds/ShadowDuel", 0777);
            sv.magic = SAVE_MAGIC; sv.version = SAVE_VER; sv.chk = sv_chk(&sv);
            f = fopen(SD_ROOT "/3ds/ShadowDuel/save3.bin", "wb");
            if (!f) return 0;
            w = fwrite(&sv, sizeof sv, 1, f);
            fclose(f);
            return w == 1;
          }

          static int owned_ok(int own, int eq, int n) { return eq >= 0 && eq < n && ((own >> eq) & 1); }

          static int load_game(void) {
            FILE *f = fopen(SD_ROOT "/3ds/ShadowDuel/save3.bin", "rb");
            Save t;
            size_t r;
            int i;
            if (!f) return 0;
            r = fread(&t, sizeof t, 1, f);
            fclose(f);
            if (r != 1 || t.magic != SAVE_MAGIC || t.version != SAVE_VER || t.chk != sv_chk(&t)) return 0;
            sv = t;
            sv.coins = clampi(sv.coins, 0, 999999); sv.gems = clampi(sv.gems, 0, 99999);
            sv.level = clampi(sv.level, 1, MAXLVL); sv.xp = clampi(sv.xp, 0, 99999);
            sv.actsUnlocked = clampi(sv.actsUnlocked, 1, NACT); sv.curAct = clampi(sv.curAct, 0, NACT - 1);
            sv.curFight = clampi(sv.curFight, 0, 3);
            sv.wOwn |= 1; sv.rOwn |= 1; sv.aOwn |= 1; sv.hOwn |= 1; sv.mOwn |= 1;
            if (!owned_ok(sv.wOwn, sv.wEq, NW)) sv.wEq = 0;
            if (!owned_ok(sv.rOwn, sv.rEq, NR)) sv.rEq = 0;
            if (!owned_ok(sv.aOwn, sv.aEq, NA)) sv.aEq = 0;
            if (!owned_ok(sv.hOwn, sv.hEq, NH)) sv.hEq = 0;
            if (!owned_ok(sv.mOwn, sv.mEq, NM)) sv.mEq = 0;
            for (i = 0; i < NENCH; i++) sv.enchLv[i] = clampi(sv.enchLv[i], 0, 3);
            if (sv.eEq < -1 || sv.eEq >= NENCH || (sv.eEq >= 0 && sv.enchLv[sv.eEq] == 0)) sv.eEq = -1;
            for (i = 0; i < 7; i++) sv.skill[i] = clampi(sv.skill[i], 0, 5);
            sv.diff = clampi(sv.diff, 0, 2); sv.rounds = clampi(sv.rounds, 1, 3); sv.timeIdx = clampi(sv.timeIdx, 0, 2);
            sv.shake = !!sv.shake; sv.box = !!sv.box; sv.music = !!sv.music; sv.sfx = !!sv.sfx; sv.lang = clampi(sv.lang, 0, NLANG - 1);
            for (i = 0; i < NAC; i++) sv.keymap[i] = clampi(sv.keymap[i], 0, 6);
            return 1;
          }

          static void toast(const char *s) { snprintf(toastBuf, sizeof toastBuf, "%s", s); toastT = 150; }


          /* ---------------------------------------------------------- fight logic */
          static void shop_build(void);
          static int xp_need(int lvl) { return 50 + lvl * 40; }
          static int skill_free(void) {
            int s = 0, i;
            for (i = 0; i < 7; i++) s += sv.skill[i];
            return (sv.level - 1) - s;
          }
          static void set_st(Fighter *f, int s) { f->st = s; f->t = 0; f->hitDone = 0; f->dashT = 0; }

          static void init_fighter(Fighter *f, float x, int dir, int maxhp) {
            memset(f, 0, sizeof(Fighter));
            f->x = x; f->y = GROUND; f->dir = dir; f->maxhp = maxhp; f->hp = maxhp;
            f->onGround = 1; f->scale = 1.0f;
            f->dmgMul = 1.0f; f->defMul = 1.0f; f->spdMul = 1.0f; f->enMul = 1.0f; f->spPow = 1.0f; f->spCost = 50;
            f->wDmg = 7.0f; f->wReach = 44.0f; f->wSpd = 1.0f; f->ench = -1;
          }

          static void apply_loadout_ex(Fighter *f, int wi, int ri, int ai, int hi, int mi) {
            const WeapDef *w = &WEAPS[wi];
            const ArmDef *a = &ARMS[ai], *h = &HELMS[hi];
            const MagDef *m = &MAGS[mi];
            float defm;
            int e = sv.eEq;
            f->maxhp = 100 + a->hp + h->hp + sv.skill[5] * 8; f->hp = f->maxhp;
            f->dmgMul = 1.0f + sv.skill[0] * 0.04f;
            defm = (1.0f - a->def / 100.0f) * (1.0f - h->def / 100.0f) * (1.0f - sv.skill[1] * 0.03f);
            f->defMul = defm < 0.35f ? 0.35f : defm;
            f->spdMul = 1.0f + sv.skill[2] * 0.03f;
            f->spPow = 1.0f + sv.skill[3] * 0.08f;
            f->wDmg = w->dmg * (1.0f + sv.skill[4] * 0.05f);
            f->wReach = (float)w->reach + sv.skill[4];
            f->wSpd = w->spd / 100.0f * (1.0f + sv.skill[2] * 0.02f);
            f->enMul = 1.0f + sv.skill[6] * 0.06f;
            f->spKind = mi; f->spCost = m->cost - sv.skill[6] * 2;
            if (f->spCost < 25) f->spCost = 25;
            f->rKind = ri; f->hasR = 1; f->hasW = 1;
            f->wcls = w->cls; f->bladeLen = w->len; f->blr = w->r; f->blg = w->g; f->blb = w->b;
            f->armorOn = ai > 0; f->amr = a->r; f->amg = a->g; f->amb = a->b;
            f->helm = hi; f->helmR = h->r; f->helmG = h->g; f->helmB = h->b;
            f->ench = (e >= 0 && sv.enchLv[e] > 0) ? e : -1;
            f->enchLv = f->ench >= 0 ? sv.enchLv[f->ench] : 0;
            f->regen = (f->ench == E_REGEN) ? 0.0083f * f->enchLv : 0.0f;
          }
          static void apply_loadout(Fighter *f) { apply_loadout_ex(f, sv.wEq, sv.rEq, sv.aEq, sv.hEq, sv.mEq); }

          static void style_player(Fighter *f) { f->ar = 70; f->ag = 210; f->ab = 255; f->acc = 16; f->scale = 1.0f; apply_loadout(f); }
          static void style_opp(Fighter *f, int i) {
            const Opp *o = &OPP[i];
            f->ar = o->r; f->ag = o->g; f->ab = o->b; f->acc = o->acc; f->scale = o->scale;
            f->wcls = o->wcls; f->hasW = o->wcls != WC_NONE; f->hasR = o->ranged;
            f->bladeLen = o->wcls != WC_NONE ? 32 : 0; f->blr = 205; f->blg = 210; f->blb = 225;
            f->wDmg = 7.0f + i * 1.4f;
            f->wReach = 44.0f + ((o->wcls == WC_STAFF || o->wcls == WC_SCYTHE) ? 14.0f : 0.0f);
            f->spKind = o->sp; f->spCost = MAGS[o->sp].cost; f->rKind = 0;
          }

          static void spawn(float x, float y, int n, int r, int g, int b, float sp) {
            int k, i;
            for (k = 0; k < n; k++) {
              for (i = 0; i < 120; i++) {
                if (parts[i].life <= 0) {
                  float a = frand() * 2.0f * PI_F, s = sp * (0.35f + frand() * 0.65f);
                  parts[i].x = x; parts[i].y = y; parts[i].vx = cosf(a) * s; parts[i].vy = sinf(a) * s - 1.0f;
                  parts[i].life = 16 + rand() % 14; parts[i].r = 1.5f + frand() * 2.5f;
                  parts[i].cr = r; parts[i].cg = g; parts[i].cb = b;
                  break;
                }
              }
            }
          }
          static void update_parts(void) {
            int i;
            for (i = 0; i < 120; i++) {
              if (parts[i].life > 0) {
                parts[i].x += parts[i].vx; parts[i].y += parts[i].vy; parts[i].vy += 0.15f; parts[i].life--;
              }
            }
          }

          static float body_h(const Fighter *d) { return (d->st == ST_CROUCH ? 34.0f : 72.0f) * d->scale; }

          static void begin_attack(Fighter *f, int st) {
            set_st(f, st);
            if (st == ST_PUNCH) { f->aTot = PUNCH_TOTAL; f->aA0 = PUNCH_A0; f->aA1 = PUNCH_A1; }
            else if (st == ST_KICK) {
              if (f->low) { f->aTot = 22; f->aA0 = 6; f->aA1 = 11; }
              else { f->aTot = KICK_TOTAL; f->aA0 = KICK_A0; f->aA1 = KICK_A1; }
            } else {
              float sp = f->wSpd < 0.5f ? 0.5f : f->wSpd;
              f->aTot = (int)(24.0f / sp); f->aA0 = (int)(7.0f / sp); f->aA1 = f->aA0 + 5;
              if (f->aA0 < 3) f->aA0 = 3;
              if (f->aA1 < f->aA0 + 3) f->aA1 = f->aA0 + 3;
              if (f->aTot < f->aA1 + 3) f->aTot = f->aA1 + 3;
            }
          }

          static int atk_params(const Fighter *f, float *reach, float *y0, float *y1, int *dmg, float *kb, int *stun) {
            if (f->st == ST_PUNCH) { *reach = 36; *y0 = 38; *y1 = 66; *dmg = 4; *kb = 2.5f; *stun = 11; return AT_PUNCH; }
            if (f->st == ST_KICK) {
              if (f->low) { *reach = 50; *y0 = 0; *y1 = 18; *dmg = 7; *kb = 4.0f; *stun = 17; }
              else { *reach = 52; *y0 = 4; *y1 = 46; *dmg = 8; *kb = 5.0f; *stun = 19; }
              return AT_KICK;
            }
            if (f->st == ST_WEAPON) {
              int d = (int)(f->wDmg + 0.5f);
              *reach = f->wReach; *y0 = 22; *y1 = 64; *dmg = d; *kb = 3.0f + d * 0.12f; *stun = clampi(12 + d / 3, 12, 22);
              return AT_WEAPON;
            }
            return -1;
          }

          static int overlap(const Fighter *a, const Fighter *d, float reach, float y0, float y1) {
            float s = a->scale;
            float ax0 = a->x + a->dir * 6.0f, ax1 = a->x + a->dir * reach * s;
            float lo = fminf(ax0, ax1), hi = fmaxf(ax0, ax1);
            float dx0 = d->x - 11.0f * d->scale, dx1 = d->x + 11.0f * d->scale;
            float ay0 = a->y - y1 * s, ay1 = a->y - y0 * s;
            float dy0 = d->y - body_h(d), dy1 = d->y;
            if (hi < dx0 || lo > dx1) return 0;
            if (ay1 < dy0 || ay0 > dy1) return 0;
            return 1;
          }

          static void apply_ko(Fighter *d, int dir) {
            if (mode == M_TRAINING && d == &F[1]) {
              d->hp = d->maxhp;
              spawn(d->x, d->y - 40, 26, 255, 255, 255, 5.0f);
              return;
            }
            d->hp = 0;
            set_st(d, ST_KO);
            d->vy = -5.5f; d->onGround = 0; d->vx = dir * 5.0f;
            hitStop = 10; shakeT = 22; shakeA = 6.0f;
            sfx(SFX_KO);
          }

          static void dot_damage(Fighter *d, int n) {
            if (d->st == ST_KO || fs != FS_FIGHT || n <= 0) return;
            d->hp -= n;
            if (d == &F[0]) tookDmg = 1;
            if (d->hp <= 0) apply_ko(d, -d->dir);
          }

          static void do_hit(Fighter *a, Fighter *d, int dir, int dmg, float kb, int stun, int type) {
            int blocked = (d->st == ST_BLOCK && d->dir == -dir);
            int en = a->ench, el = a->enchLv;
            int ench_on = ((type == AT_WEAPON || type == AT_RANGED) && en >= 0);
            float sx = d->x - dir * 6.0f, sy = d->y - (type == AT_SPELL ? 44.0f : 48.0f) * d->scale * (d->st == ST_CROUCH ? 0.5f : 1.0f);
            float m = d->defMul;
            if (type == AT_SPELL) m *= a->spPow; else m *= a->dmgMul;
            if (ench_on && en == E_FURY && a->hp * 2 < a->maxhp) m *= 1.0f + 0.12f * el;
            dmg = (int)(dmg * m + 0.5f);
            if (dmg < 1) dmg = 1;
            if (blocked) {
              int bd = type == AT_SPELL ? dmg / 3 : dmg / 5;
              if (bd < 1) bd = 1;
              d->hp -= bd; d->vx = dir * kb * 0.6f;
              if (d == &F[0]) tookDmg = 1;
              d->energy += 2.0f; a->energy += 1.0f;
              spawn(sx, sy, 6, 140, 190, 255, 3.0f);
              hitStop = 2;
              sfx(SFX_BLOCK);
            } else {
              if (d->shield > 0.0f) {
                float ab = fminf(d->shield, (float)dmg);
                d->shield -= ab; dmg -= (int)ab;
                spawn(sx, sy, 6, 120, 200, 255, 3.0f);
              }
              d->hp -= dmg;
              if (d == &F[0] && dmg > 0) tookDmg = 1;
              set_st(d, ST_HURT);
              d->hurtT = stun; d->vx = dir * kb;
              if (!d->onGround) d->vy = -3.5f;
              a->energy += dmg * 1.4f * a->enMul; d->energy += dmg * 0.7f * d->enMul;
              a->comboN++; a->comboT = 100;
              if (a->comboN > maxCombo && a == &F[0]) maxCombo = a->comboN;
              spawn(sx, sy, type == AT_SPELL ? 22 : 12, 255, 230, 120, type == AT_SPELL ? 6.0f : 4.0f);
              hitStop = type == AT_SPELL ? 7 : 4;
              shakeT = type == AT_SPELL ? 14 : 8; shakeA = type == AT_SPELL ? 5.0f : 3.0f;
              sfx(SFX_HIT);
              if (ench_on) {
                if (en == E_POISON) { d->poisonT = 300; d->poisonDps = 0.8f + 0.7f * el; spawn(sx, sy, 8, 120, 255, 100, 2.5f); }
                else if (en == E_BLEED) { d->bleedT = 180; d->bleedDps = 2.0f * el; spawn(sx, sy, 8, 255, 60, 60, 2.5f); }
                else if (en == E_FREEZE && frand() < 0.15f * el) { d->freezeT = 120; spawn(sx, sy, 14, 150, 230, 255, 3.0f); }
                else if (en == E_STUN && frand() < 0.12f * el) { d->hurtT += 36; spawn(sx, sy - 14, 10, 255, 255, 120, 3.0f); }
                else if (en == E_BOOM) { d->hp -= 2 * el + 1; spawn(sx, sy, 20, 255, 160, 60, 6.0f); shakeT = 10; shakeA = 4.0f; }
                else if (en == E_VAMP) {
                  a->hp += (int)(dmg * 0.08f * el + 0.5f);
                  if (a->hp > a->maxhp) a->hp = a->maxhp;
                  spawn(a->x, a->y - 40, 6, 255, 90, 120, 2.0f);
                }
              }
            }
            if (a->energy > 100.0f) a->energy = 100.0f;
            if (d->energy > 100.0f) d->energy = 100.0f;
            if (d->hp <= 0) apply_ko(d, dir);
          }

          static int try_hit(Fighter *a, Fighter *d) {
            float reach, y0, y1, kb;
            int dmg, stun, type;
            if (fs != FS_FIGHT || a->hitDone || d->st == ST_KO) return 0;
            type = atk_params(a, &reach, &y0, &y1, &dmg, &kb, &stun);
            if (type < 0) return 0;
            if (a->t < a->aA0 || a->t > a->aA1) return 0;
            if (!overlap(a, d, reach, y0, y1)) return 0;
            a->hitDone = 1;
            do_hit(a, d, a->dir, dmg, kb, stun, type);
            return 1;
          }

          static void add_proj(Fighter *f, int kind, int dmg, float speed, float rad, int pierce) {
            int i, owner = (f == &F[0]) ? 0 : 1;
            for (i = 0; i < 6; i++) {
              if (!projs[i].active) {
                Proj *p = &projs[i];
                p->active = 1; p->owner = owner; p->kind = kind; p->hit = 0; p->pierce = pierce; p->dmg = dmg; p->rad = rad;
                p->x = f->x + f->dir * 26.0f * f->scale;
                p->y = f->y - 46.0f * f->scale * (f->st == ST_CROUCH ? 0.5f : 1.0f);
                p->vx = f->dir * speed;
                spawn(p->x, p->y, 6, f->ar, f->ag, f->ab, 3.0f);
                return;
              }
            }
          }

          static void add_strike(Fighter *f, int kind, float x, int delay, int dmg) {
            int i;
            for (i = 0; i < 3; i++) {
              if (!strikes[i].active) {
                strikes[i].active = 1; strikes[i].owner = (f == &F[0]) ? 0 : 1; strikes[i].kind = kind;
                strikes[i].x = clampf(x, 14.0f, 386.0f); strikes[i].t = 0; strikes[i].delay = delay; strikes[i].dmg = dmg;
                return;
              }
            }
          }

          static void do_throw(Fighter *f) {
            const RngDef *r = &RNGS[f->rKind];
            add_proj(f, PK_SHURIKEN + f->rKind, r->dmg, r->spd10 / 10.0f, (float)r->rad, r->pierce);
            f->throwCd = r->cd;
            if (f == &F[0]) sv.throws++;
            sfx(SFX_THROW);
          }

          static void do_special(Fighter *f, Fighter *o) {
            int k = f->spKind;
            if (fs != FS_FIGHT) return;
            if (f == &F[0]) sv.casts++;
            if (k == 0) { add_proj(f, PK_BALL, 16, 5.8f, 8.0f, 0); sfx(SFX_BOLT); }
            else if (k == 1) {
              sfx(SFX_QUAKE); shakeT = 16; shakeA = 4.0f;
              spawn(f->x, f->y - 4.0f, 20, 255, 210, 100, 5.0f);
              if (o->st != ST_KO && o->onGround && fabsf(o->x - f->x) < 115.0f)
                do_hit(f, o, (o->x >= f->x) ? 1 : -1, 18, 8.0f, 24, AT_SPELL);
            } else if (k == 2) { f->rushT = 10; sfx(SFX_BOLT); }
            else if (k == 3) {
              f->hp += (int)(22.0f * f->spPow);
              if (f->hp > f->maxhp) f->hp = f->maxhp;
              spawn(f->x, f->y - 40.0f, 20, 90, 255, 140, 3.0f);
              sfx(SFX_HEAL);
            } else if (k == 4) { add_strike(f, 0, o->x, 16, 20); sfx(SFX_BOLT); }
            else if (k == 5) { add_proj(f, PK_FIRE, 9, 3.6f, 12.0f, 1); sfx(SFX_FIRE); }
            else if (k == 6) { add_strike(f, 1, f->x + f->dir * 110.0f, 20, 22); sfx(SFX_BOLT); }
            else { add_proj(f, PK_DARK, 26, 3.0f, 18.0f, 0); sfx(SFX_BOLT); }
            f->energy -= (float)f->spCost;
            if (f->energy < 0) f->energy = 0;
          }

          static void update_projs(void) {
            int i;
            for (i = 0; i < 6; i++) {
              Proj *p = &projs[i];
              Fighter *t, *a;
              if (!p->active) continue;
              p->x += p->vx;
              if (p->x < -30 || p->x > 430) { p->active = 0; continue; }
              a = &F[p->owner];
              if (p->kind == PK_BALL || p->kind == PK_FIRE || p->kind == PK_DARK) spawn(p->x, p->y, 1, a->ar, a->ag, a->ab, 1.0f);
              if (p->hit) continue;
              t = &F[1 - p->owner];
              if (t->st != ST_KO && fabsf(p->x - t->x) < (p->rad + 8.0f) * t->scale && p->y > t->y - body_h(t) && p->y < t->y) {
                int spell = (p->kind == PK_BALL || p->kind == PK_FIRE || p->kind == PK_DARK);
                p->hit = 1;
                if (!p->pierce) p->active = 0;
                do_hit(a, t, p->vx > 0 ? 1 : -1, p->dmg, spell ? 7.0f : 3.0f, p->kind == PK_DARK ? 44 : (spell ? 24 : 12), spell ? AT_SPELL : AT_RANGED);
                if (p->kind == PK_FIRE) { t->burnT = 240; t->burnDps = 2.0f + 1.5f * a->spPow; }
              }
            }
          }

          static void update_strikes(void) {
            int i;
            for (i = 0; i < 3; i++) {
              Strike *s = &strikes[i];
              Fighter *o, *a;
              if (!s->active) continue;
              s->t++;
              a = &F[s->owner]; o = &F[1 - s->owner];
              if (s->t == s->delay) {
                int dir = o->x >= a->x ? 1 : -1;
                if (s->kind == 0) {
                  sfx(SFX_ZAP); shakeT = 10; shakeA = 3.0f;
                  spawn(s->x, GROUND - 30.0f, 16, 255, 255, 140, 5.0f);
                  if (o->st != ST_KO && fabsf(o->x - s->x) < 26.0f) do_hit(a, o, dir, s->dmg, 3.0f, 40, AT_SPELL);
                } else {
                  sfx(SFX_BOOM); shakeT = 18; shakeA = 5.0f;
                  spawn(s->x, GROUND - 20.0f, 28, 255, 150, 50, 7.0f);
                  if (o->st != ST_KO && fabsf(o->x - s->x) < 58.0f && o->y > GROUND - 45.0f) do_hit(a, o, dir, s->dmg, 8.0f, 26, AT_SPELL);
                }
              }
              if (s->t > s->delay + 8) s->active = 0;
            }
          }

          static void update_fighter(Fighter *f, Fighter *o, Inp in, int canAct) {
            int mv;
            float sp;
            f->t++;
            if (f->freezeT > 0 && (f->freezeT & 1)) f->t--;
            if (f->dashCd > 0) f->dashCd--;
            if (f->throwCd > 0) f->throwCd--;
            if (f->comboT > 0) { f->comboT--; if (f->comboT == 0) f->comboN = 0; }
            if (fs == FS_FIGHT && f->st != ST_KO) {
              if (f->poisonT > 0) { f->poisonT--; f->dotAcc += f->poisonDps / 60.0f; }
              if (f->bleedT > 0) { f->bleedT--; f->dotAcc += f->bleedDps / 60.0f; }
              if (f->burnT > 0) { f->burnT--; f->dotAcc += f->burnDps / 60.0f; }
              if (f->dotAcc >= 1.0f) { int n = (int)f->dotAcc; f->dotAcc -= n; dot_damage(f, n); }
              if (f->freezeT > 0) f->freezeT--;
              if (f->regen > 0.0f && f->hp > 0) {
                f->hpAcc += f->regen;
                if (f->hpAcc >= 1.0f) { f->hpAcc -= 1.0f; if (f->hp < f->maxhp) f->hp++; }
              }
            }
            sp = f->spdMul * (f->freezeT > 0 ? 0.4f : 1.0f);
            if (f->onGround && (f->st == ST_IDLE || f->st == ST_WALK || f->st == ST_BLOCK || f->st == ST_WIN || f->st == ST_CROUCH))
              f->dir = (o->x >= f->x) ? 1 : -1;
            if (canAct && (f->st == ST_IDLE || f->st == ST_WALK || f->st == ST_JUMP || f->st == ST_BLOCK || f->st == ST_CROUCH)) {
              if (f->onGround && in.block) {
                if (f->st != ST_BLOCK) set_st(f, ST_BLOCK);
                f->vx = 0;
              } else {
                if (f->st == ST_BLOCK) set_st(f, ST_IDLE);
                if (in.special && f->energy >= (float)f->spCost) { set_st(f, ST_SPECIAL); f->vx = 0; }
                else if (in.weapon) { begin_attack(f, ST_WEAPON); sfx(SFX_PUNCH); }
                else if (in.kick) { f->low = (f->st == ST_CROUCH || in.down); begin_attack(f, ST_KICK); sfx(SFX_KICK); }
                else if (in.punch) { begin_attack(f, ST_PUNCH); sfx(SFX_PUNCH); }
                else if (in.ranged && f->hasR && f->throwCd == 0) { set_st(f, ST_THROW); f->vx = 0; }
                else if (f->onGround) {
                  mv = in.right - in.left;
                  if (in.jump) {
                    f->vy = -9.8f; f->onGround = 0; set_st(f, ST_JUMP); f->vx = mv * 2.6f * sp; sfx(SFX_JUMP);
                  } else if (in.down) {
                    if (f->st != ST_CROUCH) set_st(f, ST_CROUCH);
                    f->vx = 0;
                  } else {
                    if (f->st == ST_CROUCH) set_st(f, ST_IDLE);
                    if (in.dash && f->dashCd == 0) { f->dashT = 8; f->dashCd = 45; f->dashDir = mv != 0 ? mv : f->dir; }
                    if (f->dashT > 0) { f->dashT--; f->vx = f->dashDir * 7.0f * sp; }
                    else if (mv != 0) { f->vx = mv * 2.3f * sp; if (f->st != ST_WALK) set_st(f, ST_WALK); }
                    else if (f->st == ST_WALK) set_st(f, ST_IDLE);
                  }
                }
              }
            }
            if (f->st == ST_PUNCH || f->st == ST_KICK || f->st == ST_WEAPON) {
              try_hit(f, o);
              if (f->t >= f->aTot) set_st(f, f->onGround ? ST_IDLE : ST_JUMP);
            } else if (f->st == ST_THROW) {
              if (f->t == 5 && fs == FS_FIGHT) do_throw(f);
              if (f->t >= 14) set_st(f, f->onGround ? ST_IDLE : ST_JUMP);
            } else if (f->st == ST_SPECIAL) {
              if (f->t == SPEC_FIRE) do_special(f, o);
              if (f->t >= SPEC_TOTAL) set_st(f, ST_IDLE);
            } else if (f->st == ST_HURT) {
              if (f->t >= f->hurtT) set_st(f, f->onGround ? ST_IDLE : ST_JUMP);
            }
            if (f->rushT > 0) {
              f->rushT--; f->vx = f->dir * 11.0f;
              if (!f->hitDone && fs == FS_FIGHT && o->st != ST_KO && fabsf(o->x - f->x) < 28.0f * o->scale + 6.0f && fabsf(o->y - f->y) < 50.0f) {
                f->hitDone = 1;
                do_hit(f, o, f->dir, 13, 7.0f, 22, AT_SPELL);
              }
            }
            f->x += f->vx;
            if (!f->onGround) {
              f->vy += 0.55f; f->y += f->vy;
              if (f->y >= GROUND) {
                f->y = GROUND; f->vy = 0; f->onGround = 1;
                if (f->st == ST_JUMP) set_st(f, ST_IDLE);
              }
            }
            if (f->onGround && f->st != ST_WALK && f->dashT == 0 && f->rushT == 0) f->vx *= 0.82f;
            if (f->st == ST_KO) f->rot = fminf(PI_F * 0.5f, f->t * 0.10f); else f->rot = 0;
            f->x = clampf(f->x, ARENA_L, ARENA_R);
          }

          static void separate(void) {
            float dx = F[1].x - F[0].x, m = 20.0f, p, sg;
            if (fabsf(dx) < m && F[0].onGround && F[1].onGround && F[0].st != ST_KO && F[1].st != ST_KO) {
              p = (m - fabsf(dx)) * 0.5f; sg = dx >= 0 ? 1.0f : -1.0f;
              F[0].x = clampf(F[0].x - sg * p, ARENA_L, ARENA_R);
              F[1].x = clampf(F[1].x + sg * p, ARENA_L, ARENA_R);
            }
          }

          static Inp ai_think(Fighter *f, Fighter *o) {
            Inp in;
            const Opp *op = &OPP[curOpp];
            float dm = sv.diff == 0 ? 0.55f : (sv.diff == 2 ? 1.35f : 1.0f);
            float aggr = op->aggr + curStep.aggr / 100.0f;
            float d = fabsf(o->x - f->x), r;
            int toward = (o->x > f->x) ? 1 : -1, bolt = 0, threat, i;
            memset(&in, 0, sizeof in);
            if (f->st == ST_KO || f->st == ST_HURT || f->st == ST_WIN) return in;
            if (mode == M_TRAINING) {
              if (trainDummy == 0) return in;
              if (trainDummy == 1) { in.block = 1; return in; }
            }
            if (f->aiCool > 0) f->aiCool--;
            if (f->aiBlockT > 0) { f->aiBlockT--; in.block = 1; return in; }
            for (i = 0; i < 6; i++)
              if (projs[i].active && projs[i].owner == 0 && fabsf(projs[i].x - f->x) < 80.0f) bolt = 1;
            threat = (o->st == ST_PUNCH || o->st == ST_KICK || o->st == ST_WEAPON) && d < (70.0f + (o->st == ST_WEAPON ? o->wReach - 40.0f : 0.0f)) * f->scale;
            if ((threat || bolt) && f->onGround && frand() < op->block * dm * 0.9f) {
              f->aiBlockT = 12 + rand() % 14; in.block = 1; return in;
            }
            if (f->t < 4 && f->st == ST_IDLE && d < 46.0f * f->scale && f->aiCool == 0 && frand() < aggr * dm) {
              f->aiAct = frand() < 0.4f ? 4 : 3; f->aiActT = 2; f->aiCool = 20 + rand() % 20;
            } else if (f->aiActT > 0) f->aiActT--;
            else {
              r = frand();
              f->aiAct = 0; f->aiActT = 8 + rand() % 14;
              if (f->energy >= (float)f->spCost && d > 70.0f && frand() < 0.30f * dm) { f->aiAct = 5; f->aiActT = 2; }
              else if (f->hasR && f->throwCd == 0 && d > 90.0f && frand() < 0.18f * dm) { f->aiAct = 8; f->aiActT = 2; }
              else if (d > 64.0f) {
                f->aiAct = (r < 0.35f + aggr) ? 1 : 0;
                if (frand() < 0.06f * dm) f->aiAct = 6;
              } else if (d > 34.0f) {
                if (f->aiCool == 0 && r < aggr * dm) {
                  f->aiAct = (f->hasW && frand() < 0.45f) ? 7 : ((frand() < 0.55f) ? 4 : 3); f->aiActT = 2;
                  f->aiCool = (int)((55.0f - 30.0f * aggr) / dm) + rand() % 20;
                } else f->aiAct = (r < 0.5f) ? 1 : ((r < 0.75f) ? 2 : 0);
              } else {
                if (f->aiCool == 0 && r < aggr * dm * 1.2f) {
                  f->aiAct = (f->hasW && frand() < 0.3f) ? 7 : 3; f->aiActT = 2;
                  f->aiCool = (int)((45.0f - 25.0f * aggr) / dm) + rand() % 15;
                } else f->aiAct = (r < 0.6f) ? 2 : 0;
              }
            }
            switch (f->aiAct) {
              case 1: if (toward > 0) in.right = 1; else in.left = 1; break;
              case 2: if (toward > 0) in.left = 1; else in.right = 1; break;
              case 3: in.punch = 1; break;
              case 4: in.kick = 1; break;
              case 5: in.special = 1; break;
              case 6: in.jump = 1; if (toward > 0) in.right = 1; else in.left = 1; break;
              case 7: in.weapon = 1; break;
              case 8: in.ranged = 1; break;
              default: break;
            }
            return in;
          }


          /* ----------------------------------------------------------- progression */
          static void add_xp(int n) {
            rewXp += n;
            if (sv.level >= MAXLVL) return;
            sv.xp += n;
            while (sv.level < MAXLVL && sv.xp >= xp_need(sv.level)) {
              sv.xp -= xp_need(sv.level); sv.level++; lvlUps++; sfx(SFX_LEVEL);
            }
            if (sv.level >= MAXLVL) sv.xp = 0;
          }

          static void give(int coins, int gems) {
            sv.coins = clampi(sv.coins + coins, 0, 999999);
            sv.gems = clampi(sv.gems + gems, 0, 99999);
            sv.totalCoins = clampi(sv.totalCoins + coins, 0, 99999999);
            rewCoins += coins; rewGems += gems;
          }

          static int owned_count(void) {
            int i, n = __builtin_popcount((unsigned)sv.wOwn) + __builtin_popcount((unsigned)sv.rOwn) + __builtin_popcount((unsigned)sv.aOwn) +
                       __builtin_popcount((unsigned)sv.hOwn) + __builtin_popcount((unsigned)sv.mOwn);
            for (i = 0; i < NENCH; i++) if (sv.enchLv[i] > 0) n++;
            return n;
          }

          static int ach_cond(int id) {
            switch (id) {
              case 0: return sv.wins >= 1;
              case 1: return sv.wins >= 10;
              case 2: return sv.wins >= 50;
              case 3: return (sv.clearedMask & 7) == 7;
              case 4: return ((sv.clearedMask >> 6) & 7) == 7;
              case 5: return (sv.clearedMask & 0x7fff) == 0x7fff;
              case 6: return sv.bestCombo >= 5;
              case 7: return sv.bestCombo >= 10;
              case 8: return sv.perfects >= 1;
              case 9: return sv.level >= 5;
              case 10: return sv.level >= 10;
              case 11: return sv.level >= 20;
              case 12: return sv.buys >= 5;
              case 13: return owned_count() >= 15;
              case 14: return __builtin_popcount((unsigned)sv.wOwn) >= 8;
              case 15: return sv.casts >= 25;
              case 16: return sv.throws >= 50;
              case 17: return sv.tournMask != 0;
              case 18: return (sv.tournMask & 4) != 0;
              case 19: return sv.bossRush != 0;
              case 20: return sv.bestSurv >= 10;
              case 21: return sv.bestEndless >= 15;
              case 22: return (sv.challMask & 63) == 63;
              case 23: return sv.bestAsc >= 10;
              case 24: return sv.eclipseDone != 0;
              case 25: return sv.totalCoins >= 10000;
              default: return 0;
            }
          }

          static void check_ach(void) {
            int id, again = 1, guard = 0;
            char b[72];
            while (again && guard++ < 4) {
              again = 0;
              for (id = 0; id < NACH; id++) {
                if (!((sv.achMask >> id) & 1) && ach_cond(id)) {
                  sv.achMask |= 1u << id;
                  give(ACHS[id].coins, ACHS[id].gems); add_xp(ACHS[id].xp);
                  snprintf(b, sizeof b, "%s: %s", tr("Achievement", "Conquista"), tr(ACHS[id].en, ACHS[id].pt));
                  toast(b); sfx(SFX_ACH);
                  again = 1;
                }
              }
            }
          }

          /* ------------------------------------------------------------------ runs */
          static int infinite_kind(void) { return runKind == RK_SURV || runKind == RK_ASC || runKind == RK_ENDLESS; }
          static int carry_kind(void) { return runKind == RK_BOSSRUSH || runKind == RK_BODY || infinite_kind(); }
          static int carry_heal(void) {
            switch (runKind) {
              case RK_BOSSRUSH: return 25;
              case RK_BODY: return 15;
              case RK_ASC: return 20;
              case RK_SURV: return 35;
              default: return 0;
            }
          }
          static int run_len(int kind) {
            switch (kind) {
              case RK_STORY: return 3;
              case RK_TOURN: return 6;
              case RK_BOSSRUSH: return 7;
              case RK_BODY: return 4;
              case RK_SURV: case RK_ASC: case RK_ENDLESS: return 9999;
              default: return 1;
            }
          }

          static void get_step(int idx, Step *s) {
            memset(s, 0, sizeof *s);
            s->hp = 100; s->dmg = 100;
            switch (runKind) {
              case RK_STORY: {
                const Fight *g = &FIGHTS[storyAct][idx];
                s->opp = g->opp; s->hp = g->hp; s->aggr = g->aggr; s->dmg = 100 + storyAct * 6;
                s->coins = g->coins; s->gems = g->gems; s->xp = g->coins / 2 + 10;
                if (eclipse) {
                  s->hp = s->hp * 16 / 10; s->dmg = s->dmg * 135 / 100; s->aggr += 10;
                  s->coins *= 2; s->xp *= 2; if (g->gems) s->gems = g->gems + 1;
                }
                break;
              }
              case RK_TOURN:
                s->opp = TOURN_OPP[runArg][idx]; s->hp = TOURN_HP[runArg]; s->aggr = runArg * 4 + idx; s->dmg = 100 + runArg * 8;
                s->coins = (40 + idx * 15) * (runArg + 1); s->xp = 20 * (runArg + 1) + idx * 6;
                break;
              case RK_BOSSRUSH:
                s->opp = idx; s->hp = 105 + idx * 5; s->aggr = idx * 2; s->dmg = 100 + idx * 3; s->coins = 60 + idx * 25; s->xp = 40 + idx * 6;
                break;
              case RK_BODY:
                s->opp = BODY_OPP[runArg][idx]; s->hp = idx < 3 ? 75 : 125; s->aggr = idx < 3 ? 0 : 8; s->dmg = idx < 3 ? 100 : 110;
                s->coins = idx < 3 ? 60 : 150; s->xp = idx < 3 ? 30 : 90; s->gems = idx == 3 ? 1 : 0;
                break;
              case RK_CHALL: {
                const ChallDef *c = &CHALLS[runArg];
                s->opp = c->opp; s->hp = c->hp; s->rule = c->rule; s->coins = c->coins; s->gems = c->gems; s->xp = c->coins / 2;
                break;
              }
              case RK_ASC:
                s->opp = idx % NOPP; s->hp = 90 + idx * 8; s->aggr = idx * 2; s->dmg = 100 + idx * 3; s->rule = ASC_RULE[idx % 6];
                s->coins = 50 + idx * 12; s->gems = ((idx + 1) % 5 == 0) ? 1 : 0; s->xp = 25 + idx * 5;
                break;
              case RK_SURV:
                s->opp = idx % NOPP; s->hp = 100 + (idx / NOPP) * 25; s->dmg = 100 + idx * 3;
                s->coins = 25 + idx * 3; s->gems = ((idx + 1) % 5 == 0) ? 1 : 0; s->xp = 20 + idx * 3;
                break;
              case RK_ENDLESS:
                s->opp = (idx * 3) % NOPP; s->hp = 80 + idx * 6; s->aggr = idx; s->dmg = 100 + idx * 2;
                s->coins = 20 + idx * 4; s->gems = ((idx + 1) % 10 == 0) ? 1 : 0; s->xp = 15 + idx * 3;
                break;
              case RK_DUEL:
                s->opp = runArg; s->coins = 20 + runArg * 5; s->xp = 15 + runArg * 4;
                break;
              default:
                s->opp = runArg % NOPP;
                break;
            }
          }

          static int fight_track(void) {
            switch (runKind) {
              case RK_STORY: return 1 + storyAct;
              case RK_TOURN: return 1 + (runArg + runIdx) % 5;
              case RK_BOSSRUSH: return 5;
              case RK_BODY: return 3;
              case RK_CHALL: return 2;
              case RK_ENDLESS: return 4;
              case RK_DUEL: return 1 + curOpp % 5;
              case RK_TRAIN: return 1;
              default: return 1 + runIdx % 5;
            }
          }
          static int fight_inten(void) {
            switch (runKind) {
              case RK_STORY: return runIdx == 2;
              case RK_TOURN: return runIdx == 5;
              case RK_BOSSRUSH: return runIdx >= 4;
              case RK_BODY: return runIdx == 3;
              case RK_DUEL: return curOpp == NOPP - 1;
              case RK_ASC: case RK_SURV: return runIdx >= 7;
              case RK_ENDLESS: return runIdx >= 10;
              default: return 0;
            }
          }

          static void start_round(void) {
            const Opp *op = &OPP[curOpp];
            float mul = sv.diff == 0 ? 0.85f : (sv.diff == 2 ? 1.2f : 1.0f);
            int ehp = (int)(op->hp * mul * curStep.hp / 100.0f);
            if (ehp < 20) ehp = 20;
            init_fighter(&F[0], 130.0f, 1, 100);
            init_fighter(&F[1], 270.0f, -1, ehp);
            style_player(&F[0]);
            style_opp(&F[1], curOpp);
            F[1].dmgMul = curStep.dmg / 100.0f;
            if (ruleFlags & R_GLASS) { F[0].maxhp = 40; F[0].hp = 40; F[0].dmgMul *= 2.0f; }
            if (ruleFlags & R_FAST) { F[1].dmgMul *= 1.25f; F[1].spdMul *= 1.25f; }
            if (carry_kind() && carryHp > 0) F[0].hp = clampi(carryHp, 1, F[0].maxhp);
            if (F[0].ench == E_SHIELD) F[0].shield = 10.0f * F[0].enchLv;
            timerF = (mode == M_TRAINING) ? 0 : ((ruleFlags & R_TIME30) ? 30 * 60 : timeVals[sv.timeIdx] * 60);
            fs = FS_INTRO; fst = 0; hitStop = 0; shakeT = 0; tookDmg = 0;
            memset(projs, 0, sizeof projs);
            memset(strikes, 0, sizeof strikes);
            memset(parts, 0, sizeof parts);
            music_play(fight_track(), fight_inten());
          }

          static void start_step(void) {
            get_step(runIdx, &curStep);
            curOpp = curStep.opp; ruleFlags = curStep.rule;
            wins[0] = wins[1] = 0; roundNo = 1; maxCombo = 0;
            needWins = (infinite_kind() || runKind == RK_CHALL) ? 1 : (mode == M_TRAINING ? 99 : sv.rounds);
            scene = SC_FIGHT; paused = 0; pauseSel = 0;
            bufP = bufK = bufW = bufR = bufS = bufJ = bufD = 0;
            start_round();
          }

          static void start_run_at(int kind, int arg, int idx) {
            runKind = kind; runArg = arg; runIdx = idx; runN = run_len(kind);
            mode = (kind == RK_TRAIN) ? M_TRAINING : (kind == RK_DUEL ? M_FREE : M_RUN);
            if (kind == RK_STORY) storyAct = arg;
            carryHp = 0; runCoins = runGems = runXp = 0; runWins = 0;
            start_step();
          }
          static void start_run(int kind, int arg) { start_run_at(kind, arg, 0); }

          static void demo_init(void) {
            init_fighter(&F[0], 150.0f, 1, 100);
            init_fighter(&F[1], 250.0f, -1, 100);
            style_player(&F[0]);
            style_opp(&F[1], rand() % NOPP);
            memset(projs, 0, sizeof projs);
            memset(strikes, 0, sizeof strikes);
            memset(parts, 0, sizeof parts);
            shakeT = 0;
          }
          static void menu_enter(void) {
            if (scene == SC_SET || scene == SC_SHOP || scene == SC_RESULT || scene == SC_FIGHT || scene == SC_CTRL || scene == SC_ACH) save_game();
            scene = SC_MENU; eraseArm = 0; newArm = 0;
            demo_init();
            music_play(0, 0);
          }
          static void open_storytxt(int a) {
            txtAct = a; txtKind = 0; scene = SC_STORYTXT;
            demo_init();
            music_play(0, 0);
          }
          static void shop_enter(int armory) {
            demo_init();
            scene = SC_SHOP; shopMode = armory; shopTab = 0; shopSel = 0; shopTop = 0;
            F[1].x = 380.0f;
            shop_build();
            music_play(6, 0);
          }

          static void res_add(int a, const char *l) { resAct[resN] = a; resLabels[resN] = l; resN++; }

          static void show_result(void) {
            scene = SC_RESULT; resSel = 0; resN = 0;
            music_play(-1, 0);
            if (matchWon && !runDone && !infinite_kind()) res_add(RA_NEXT, tr("Next fight", "Próxima luta"));
            else if (matchWon && runKind == RK_STORY && storyAct < NACT - 1) res_add(RA_NEXTACT, tr("Next act", "Próximo ato"));
            else if (matchWon && runKind == RK_STORY && !eclipse) res_add(RA_ENDING, tr("Ending", "Final"));
            else if (runKind == RK_STORY || runKind == RK_CHALL || runKind == RK_DUEL) res_add(RA_RETRY, matchWon ? tr("Rematch", "Revanche") : tr("Retry", "Tentar de novo"));
            else res_add(RA_AGAIN, matchWon ? tr("Play again", "Jogar de novo") : tr("Try again", "Tentar de novo"));
            if (runKind != RK_DUEL) res_add(RA_SHOP, tr("Shop", "Loja"));
            res_add(RA_MENU, tr("Main menu", "Menu principal"));
            sfx(matchWon ? SFX_WIN : SFX_LOSE);
            if (rewCoins > 0 || rewGems > 0) sfx(SFX_COIN);
            save_game();
          }

          static void finish_match(void) {
            int inf = infinite_kind();
            matchWon = wins[0] > wins[1];
            rewCoins = rewGems = rewXp = 0; firstClear = 0; actDone = 0; runDone = 0; lvlUps = 0;
            if (matchWon) {
              int coins = curStep.coins, gems = curStep.gems, xp = curStep.xp, first = 1, key = 0;
              sv.wins++; runWins++;
              if (maxCombo > sv.bestCombo) sv.bestCombo = maxCombo;
              if (!tookDmg) sv.perfects++;
              if (runKind == RK_STORY) {
                key = storyAct * 3 + runIdx;
                first = eclipse ? !((sv.eclipseMask >> key) & 1) : !((sv.clearedMask >> key) & 1);
              } else if (runKind == RK_CHALL) first = !((sv.challMask >> runArg) & 1);
              if (!first) { coins /= 2; gems = 0; xp /= 2; }
              firstClear = first;
              give(coins, gems); add_xp(xp);
              if (runKind == RK_STORY) {
                if (eclipse) {
                  sv.eclipseMask |= 1 << key;
                  if ((sv.eclipseMask & 0x7fff) == 0x7fff) sv.eclipseDone = 1;
                } else {
                  sv.clearedMask |= 1 << key;
                  if (storyAct == sv.curAct && runIdx == sv.curFight) {
                    if (runIdx < 2) sv.curFight = runIdx + 1;
                    else if (storyAct < NACT - 1) {
                      sv.curAct = storyAct + 1; sv.curFight = 0;
                      if (sv.actsUnlocked < storyAct + 2) sv.actsUnlocked = storyAct + 2;
                    } else sv.curFight = 3;
                  }
                }
              }
              if (runKind == RK_CHALL) sv.challMask |= 1 << runArg;
              if (runKind == RK_SURV && runWins > sv.bestSurv) sv.bestSurv = runWins;
              if (runKind == RK_ENDLESS && runWins > sv.bestEndless) sv.bestEndless = runWins;
              if (runKind == RK_ASC && runWins > sv.bestAsc) sv.bestAsc = runWins;
              runCoins += rewCoins; runGems += rewGems; runXp += rewXp;
              if (inf) {
                char b[72];
                carryHp = F[0].hp + carry_heal();
                if (carryHp > F[0].maxhp) carryHp = F[0].maxhp;
                runIdx++;
                check_ach();
                snprintf(b, sizeof b, "+%d %s  +%d XP", rewCoins, tr("coins", "moedas"), rewXp);
                start_step();
                toast(b);
                return;
              }
              if (runIdx + 1 >= runN) {
                int g = 0;
                switch (runKind) {
                  case RK_TOURN: g = ((sv.tournMask >> runArg) & 1) ? 0 : (runArg == 2 ? 5 : (runArg == 1 ? 2 : 0));
                    give(200 * (runArg + 1), g); add_xp(60 * (runArg + 1)); sv.tournMask |= 1 << runArg; break;
                  case RK_BOSSRUSH: give(800, sv.bossRush ? 0 : 6); add_xp(300); sv.bossRush = 1; break;
                  case RK_BODY: give(400, ((sv.bodyMask >> runArg) & 1) ? 0 : 3); add_xp(150); sv.bodyMask |= 1 << runArg; break;
                  default: break;
                }
                runDone = 1; actDone = (runKind == RK_STORY);
                runCoins = rewCoins; runGems = rewGems;
              } else if (carry_kind()) {
                carryHp = F[0].hp + carry_heal();
                if (carryHp > F[0].maxhp) carryHp = F[0].maxhp;
              }
            } else {
              sv.losses++; add_xp(5);
            }
            check_ach();
            show_result();
          }

          static void end_round(int winner) {
            if (winner >= 0) wins[winner]++;
            koWinner = winner;
            fs = FS_KO; fst = 0;
            memset(projs, 0, sizeof projs);
            memset(strikes, 0, sizeof strikes);
          }

          static u32 keyof(int ac) { return KEYOPT[sv.keymap[ac]]; }

          static void update_fight(u32 kD, u32 kH, circlePosition cp) {
            Inp pi, ai, none;
            int cpUp;
            memset(&none, 0, sizeof none);
            fst++;
            if (shakeT > 0) shakeT--;
            update_parts();
            if (fs == FS_INTRO) {
              update_fighter(&F[0], &F[1], none, 0);
              update_fighter(&F[1], &F[0], none, 0);
              if (fst >= 130) { fs = FS_FIGHT; fst = 0; }
              return;
            }
            if (fs == FS_KO) {
              update_fighter(&F[0], &F[1], none, 0);
              update_fighter(&F[1], &F[0], none, 0);
              if (fst == 40) {
                if (F[0].hp > 0 && F[0].onGround && F[0].st != ST_KO) set_st(&F[0], ST_WIN);
                if (F[1].hp > 0 && F[1].onGround && F[1].st != ST_KO) set_st(&F[1], ST_WIN);
              }
              if (fst >= 170) {
                if (wins[0] >= needWins || wins[1] >= needWins) finish_match();
                else { roundNo++; start_round(); }
              }
              return;
            }
            if (hitStop > 0) { hitStop--; return; }
            cpUp = cp.dy > 60;
            if (kD & keyof(AC_PUNCH)) bufP = 7;
            if (kD & keyof(AC_KICK)) bufK = 7;
            if (kD & keyof(AC_WEAPON)) bufW = 7;
            if (kD & keyof(AC_RANGED)) bufR = 7;
            if (kD & keyof(AC_MAGIC)) bufS = 7;
            if ((kD & (KEY_DUP | keyof(AC_JUMP))) || (cpUp && !prevCpUp)) bufJ = 7;
            prevCpUp = cpUp;
            if (kD & keyof(AC_DASH)) bufD = 4;
            if (kD & (KEY_DLEFT | KEY_DRIGHT)) {
              int dir = (kD & KEY_DRIGHT) ? 1 : -1;
              if (dir == lastTapDir && gframe - lastTapFrame < 14) { bufD = 4; lastTapDir = 0; }
              else { lastTapDir = dir; lastTapFrame = gframe; }
            }
            memset(&pi, 0, sizeof pi);
            if ((kH & KEY_DLEFT) || cp.dx < -45) pi.left = 1;
            if ((kH & KEY_DRIGHT) || cp.dx > 45) pi.right = 1;
            pi.down = ((kH & KEY_DDOWN) || cp.dy < -60);
            pi.block = ((kH & keyof(AC_BLOCK)) != 0) && !(ruleFlags & R_NOBLOCK);
            pi.punch = bufP > 0; pi.kick = bufK > 0; pi.weapon = bufW > 0; pi.jump = bufJ > 0; pi.dash = bufD > 0;
            pi.ranged = bufR > 0 && !(ruleFlags & R_MELEE);
            pi.special = bufS > 0 && !(ruleFlags & R_MELEE);
            ai = ai_think(&F[1], &F[0]);
            if (mode == M_TRAINING && trainInf) F[0].energy = 100.0f;
            update_fighter(&F[0], &F[1], pi, 1);
            update_fighter(&F[1], &F[0], ai, 1);
            if (F[0].st == ST_PUNCH) bufP = 0;
            if (F[0].st == ST_KICK) bufK = 0;
            if (F[0].st == ST_WEAPON) bufW = 0;
            if (F[0].st == ST_THROW) bufR = 0;
            if (F[0].st == ST_SPECIAL) bufS = 0;
            if (F[0].st == ST_JUMP) bufJ = 0;
            if (bufP > 0) bufP--;
            if (bufK > 0) bufK--;
            if (bufW > 0) bufW--;
            if (bufR > 0) bufR--;
            if (bufS > 0) bufS--;
            if (bufJ > 0) bufJ--;
            if (bufD > 0) bufD--;
            separate();
            update_projs();
            update_strikes();
            if ((ruleFlags & R_POISON) && fst > 0 && fst % 60 == 0) { dot_damage(&F[0], 2); dot_damage(&F[1], 2); }
            if (timerF > 0) {
              timerF--;
              if (timerF == 0) {
                float p = (float)F[0].hp / F[0].maxhp, e = (float)F[1].hp / F[1].maxhp;
                end_round(p > e ? 0 : (e > p ? 1 : -1));
                return;
              }
            }
            if (F[0].hp <= 0 || F[1].hp <= 0) {
              if (F[0].hp <= 0 && F[1].hp <= 0) end_round(-1);
              else end_round(F[0].hp <= 0 ? 1 : 0);
            }
          }

          static float prof(float p) {
            if (p < 0.3f) return p / 0.3f;
            if (p < 0.55f) return 1.0f;
            p = 1.0f - (p - 0.55f) / 0.45f;
            return p < 0 ? 0 : p;
          }

          static void T(const Fighter *f, float lx, float ly, float *sx, float *sy) {
            float c = cosf(f->rot), s = sinf(f->rot);
            float x = lx * c - ly * s, y = lx * s + ly * c;
            *sx = f->x + f->dir * x * f->scale;
            *sy = f->y - y * f->scale - (f->rot > 0.1f ? 4.0f : 0.0f);
          }

          static void lbend(float *L, int a, int b, int m, float bend) {
            float ax = L[a * 2], ay = L[a * 2 + 1], bx = L[b * 2], by = L[b * 2 + 1];
            float dx = bx - ax, dy = by - ay, len = sqrtf(dx * dx + dy * dy) + 0.001f;
            L[m * 2] = (ax + bx) * 0.5f - dy / len * bend;
            L[m * 2 + 1] = (ay + by) * 0.5f + dx / len * bend;
          }


          static void draw_bg(void) {
            int i;
            for (i = 0; i < 16; i++) {
              float k = powf(i / 15.0f, 1.3f);
              rect(0, i * 12.0f, 400, 12.6f, C(28 + (int)(212 * k), 8 + (int)(112 * k), 44 + (int)(26 * k), 255));
            }
            circ(285, 150, 56, C(255, 210, 140, 60));
            circ(285, 150, 42, C(255, 224, 170, 255));
            tri(-30, 190, 70, 96, 170, 190, C(86, 30, 56, 255));
            tri(120, 190, 215, 118, 320, 190, C(76, 26, 52, 255));
            tri(270, 190, 360, 104, 440, 190, C(86, 30, 56, 255));
            tri(-40, 190, 40, 134, 130, 190, C(40, 14, 34, 255));
            tri(200, 190, 300, 140, 400, 190, C(36, 12, 32, 255));
            rect(0, GROUND, 400, 52, C(12, 8, 16, 255));
            rect(0, GROUND, 400, 2, C(130, 44, 64, 255));
            for (i = 0; i < 4; i++) {
              float bxp = (i < 2) ? 8.0f + i * 22.0f : 372.0f + (i - 2) * 22.0f - 20.0f;
              line(bxp, 0, bxp + 3, GROUND + 40, 6.0f, C(10, 22, 18, 255));
              rect(bxp - 3, 40.0f + i * 31.0f, 9, 3, C(24, 46, 36, 255));
              rect(bxp - 3, 110.0f + i * 17.0f, 9, 3, C(24, 46, 36, 255));
            }
          }


          static void draw_bar(float x, float y, float w, float h, float frac, u32 fg, int rtl) {
            rect(x - 2, y - 2, w + 4, h + 4, C(0, 0, 0, 220));
            rect(x, y, w, h, C(50, 16, 24, 255));
            frac = clampf(frac, 0, 1);
            if (rtl) rect(x + w * (1.0f - frac), y, w * frac, h, fg);
            else rect(x, y, w * frac, h, fg);
          }



          /* ---------------------------------------------------------- pose / draw */
          static void pose_local(const Fighter *f, float *L) {
            float bob = sinf(f->t * 0.12f), ph = f->t * 0.30f, e, c, s1;
            float hx = 0, hy = 71, nx = 0, ny = 60, px = 0, py = 34;
            float h1x = 16, h1y = 52, h2x = 7, h2y = 48;
            float f1x = 10, f1y = 0, f2x = -10, f2y = 0;
            switch (f->st) {
              case ST_IDLE: ny += bob * 0.8f; hy += bob * 0.8f; h1y += bob; h2y += bob; break;
              case ST_WALK:
                s1 = sinf(ph);
                f1x = s1 * 14; f2x = -s1 * 14; f1y = fmaxf(0, cosf(ph)) * 7; f2y = fmaxf(0, -cosf(ph)) * 7;
                h1x = 14 - s1 * 6; h2x = 6 + s1 * 6; break;
              case ST_JUMP: f1x = 12; f1y = 16; f2x = -6; f2y = 10; h1x = 14; h1y = 58; h2x = 4; h2y = 56; break;
              case ST_PUNCH:
                e = prof((float)f->t / PUNCH_TOTAL);
                h1x = 16 + e * 32; h1y = 54; h2x = 6; h2y = 48; nx = e * 5; hx = e * 6; f1x = 14; f2x = -12; break;
              case ST_WEAPON:
                e = prof((float)f->t / (float)(f->aTot > 0 ? f->aTot : 24));
                h1x = 14 + e * fminf(34.0f, f->wReach * 0.5f); h1y = 56 - e * 4; h2x = 6; h2y = 48; nx = e * 5; hx = e * 6; f1x = 14; f2x = -12; break;
              case ST_THROW:
                c = clampf((f->t - 2) / 6.0f, 0.0f, 1.0f);
                h1x = 10 + c * 24; h1y = 62; h2x = 6; h2y = 50; nx = c * 3; f1x = 12; f2x = -10; break;
              case ST_KICK:
                e = prof((float)f->t / (float)(f->aTot > 0 ? f->aTot : KICK_TOTAL));
                if (f->low) { f1x = 10 + e * 40; f1y = 2 + e * 4; py = 26; ny = 54; hy = 65; }
                else { f1x = 10 + e * 44; f1y = 8 + e * 24; }
                f2x = -8; nx = -e * 7; hx = -e * 9; h1x = 6; h1y = 56; h2x = -6; h2y = 60; break;
              case ST_CROUCH:
                py = 22; ny = 42; hy = 53; nx = 3; hx = 4; h1x = 17; h1y = 44; h2x = 10; h2y = 40; f1x = 14; f2x = -12; break;
              case ST_SPECIAL:
                if (f->t < SPEC_FIRE) {
                  c = (float)f->t / SPEC_FIRE; h1x = 10 - c * 10; h1y = 50; h2x = 6 - c * 10; h2y = 46; nx = -c * 3;
                } else {
                  c = fminf(1.0f, (f->t - SPEC_FIRE) / 6.0f); h1x = 14 + c * 18; h1y = 52; h2x = 10 + c * 20; h2y = 48; nx = c * 4;
                }
                f1x = 14; f2x = -12; break;
              case ST_BLOCK:
                py = 28; ny = 54; hy = 65; nx = 2; hx = 3; h1x = 17; h1y = 60; h2x = 14; h2y = 48; f1x = 14; f2x = -12; break;
              case ST_HURT:
                nx = -8; hx = -11; ny = 59; hy = 69; h1x = -10; h1y = 54; h2x = -16; h2y = 44; f1x = 6; f2x = -14; break;
              case ST_KO: h1x = 14; h1y = 48; h2x = -12; h2y = 40; f1x = 16; f2x = -14; break;
              case ST_WIN:
                ny += bob; hy += bob; h1x = 8; h1y = 88 + bob * 2; h2x = -6; h2y = 86 - bob * 2; break;
              default: break;
            }
            L[0] = hx; L[1] = hy; L[2] = nx; L[3] = ny; L[4] = px; L[5] = py;
            L[8] = h1x; L[9] = h1y; L[12] = h2x; L[13] = h2y;
            L[16] = f1x; L[17] = f1y; L[20] = f2x; L[21] = f2y;
            lbend(L, 1, 4, 3, -6.0f); lbend(L, 1, 6, 5, -6.0f);
            lbend(L, 2, 8, 7, 5.0f); lbend(L, 2, 10, 9, 5.0f);
          }

          static void wl(const Fighter *f, float x0, float y0, float x1, float y1, float th, int r, int g, int b) {
            float ax, ay, bx, by;
            T(f, x0, y0, &ax, &ay); T(f, x1, y1, &bx, &by);
            line(ax, ay, bx, by, th * f->scale + 2.0f, C(r, g, b, 90));
            line(ax, ay, bx, by, th * f->scale, C(r, g, b, 255));
          }
          static void wt(const Fighter *f, float x0, float y0, float x1, float y1, float x2, float y2, int r, int g, int b) {
            float ax, ay, bx, by, cx, cy;
            T(f, x0, y0, &ax, &ay); T(f, x1, y1, &bx, &by); T(f, x2, y2, &cx, &cy);
            tri(ax, ay, bx, by, cx, cy, C(r, g, b, 255));
          }

          static void draw_weapon(const Fighter *f, const float *L) {
            float hx = L[8], hy = L[9], len = (float)f->bladeLen, dx, dy, px, py, back, bx, by, tx, ty, ex, ey, ang;
            int atk = (f->st == ST_PUNCH || f->st == ST_WEAPON), cls = f->wcls, r = f->blr, g = f->blg, b = f->blb, k;
            if (cls == WC_NONE) return;
            if (atk) { dx = 1.0f; dy = 0.06f; } else { dx = 0.28f; dy = 0.96f; }
            px = -dy; py = dx;
            back = (cls == WC_SPEAR || cls == WC_NAGINATA || cls == WC_STAFF || cls == WC_SCYTHE || cls == WC_AXE || cls == WC_HAMMER) ? len * 0.3f : 0.0f;
            bx = hx - dx * back; by = hy - dy * back;
            tx = hx + dx * (len - back); ty = hy + dy * (len - back);
            switch (cls) {
              case WC_SWORD: case WC_KATANA: case WC_DAGGER: case WC_KNIFE: case WC_SPECIAL:
                wl(f, bx, by, tx, ty, 3.0f, r, g, b);
                wl(f, hx + px * 4, hy + py * 4, hx - px * 4, hy - py * 4, 2.5f, 120, 90, 60);
                break;
              case WC_SAI:
                wl(f, bx, by, tx, ty, 2.5f, r, g, b);
                wl(f, hx + dx * 6 + px * 6, hy + dy * 6 + py * 6, hx + dx * 11 + px * 2, hy + dy * 11 + py * 2, 2.0f, r, g, b);
                wl(f, hx + dx * 6 - px * 6, hy + dy * 6 - py * 6, hx + dx * 11 - px * 2, hy + dy * 11 - py * 2, 2.0f, r, g, b);
                break;
              case WC_AXE:
                wl(f, bx, by, tx, ty, 3.0f, 130, 90, 55);
                wt(f, tx, ty, tx - dx * 12 + px * 12, ty - dy * 12 + py * 12, tx - dx * 12 - px * 3, ty - dy * 12 - py * 3, r, g, b);
                break;
              case WC_HAMMER:
                wl(f, bx, by, tx, ty, 3.0f, 130, 90, 55);
                wl(f, tx + px * 8, ty + py * 8, tx - px * 8, ty - py * 8, 8.0f, r, g, b);
                break;
              case WC_SPEAR: case WC_NAGINATA:
                wl(f, bx, by, tx - dx * 8, ty - dy * 8, 2.5f, 130, 90, 55);
                wt(f, tx, ty, tx - dx * (cls == WC_NAGINATA ? 16 : 10) + px * 4, ty - dy * (cls == WC_NAGINATA ? 16 : 10) + py * 4,
                   tx - dx * (cls == WC_NAGINATA ? 16 : 10) - px * 4, ty - dy * (cls == WC_NAGINATA ? 16 : 10) - py * 4, r, g, b);
                break;
              case WC_STAFF:
                wl(f, bx, by, tx, ty, 3.5f, r, g, b);
                break;
              case WC_SCYTHE:
                wl(f, bx, by, tx, ty, 3.0f, 90, 70, 110);
                wt(f, tx, ty, tx - px * 20 - dx * 6, ty - py * 20 - dy * 6, tx - px * 6 - dx * 12, ty - py * 6 - dy * 12, r, g, b);
                break;
              case WC_KUSARI:
                ex = hx + dx * 14; ey = hy + dy * 14;
                wl(f, hx, hy, ex, ey, 3.0f, 130, 90, 55);
                for (k = 1; k <= 4; k++) {
                  float cx0 = ex + dx * k * 7 + px * sinf(f->t * 0.3f + k) * 3.0f, cy0 = ey + dy * k * 7 + py * sinf(f->t * 0.3f + k) * 3.0f, sx, sy;
                  T(f, cx0, cy0, &sx, &sy);
                  circ(sx, sy, 1.8f * f->scale + 0.6f, C(r, g, b, 255));
                }
                wt(f, ex + dx * 28, ey + dy * 28, ex + dx * 38 + px * 8, ey + dy * 38 + py * 8, ex + dx * 38 - px * 2, ey + dy * 38 - py * 2, r, g, b);
                break;
              case WC_NUNCHAKU:
                ex = hx + dx * len * 0.5f; ey = hy + dy * len * 0.5f;
                ang = atk ? 0.25f : sinf(f->t * 0.25f) * 0.9f;
                wl(f, hx, hy, ex, ey, 3.0f, r, g, b);
                wl(f, ex, ey, ex + (dx * cosf(ang) - dy * sinf(ang)) * len * 0.5f, ey + (dx * sinf(ang) + dy * cosf(ang)) * len * 0.5f, 3.0f, r, g, b);
                break;
              case WC_CLAWS:
                for (k = -1; k <= 1; k++) wl(f, hx, hy, hx + dx * len * 0.9f + px * k * 5, hy + dy * len * 0.9f + py * k * 5, 1.8f, r, g, b);
                break;
              case WC_TONFA:
                wl(f, hx + px * 4 - dx * 6, hy + py * 4 - dy * 6, hx + px * 4 + dx * len * 0.7f, hy + py * 4 + dy * len * 0.7f, 3.5f, r, g, b);
                break;
              case WC_GAUNTLET:
                T(f, hx, hy, &ex, &ey);
                circ(ex, ey, 6.0f * f->scale, C(r, g, b, 255));
                break;
              case WC_DUAL:
                wl(f, bx, by, tx, ty, 2.8f, r, g, b);
                wl(f, L[12], L[13], L[12] + dx * len, L[13] + dy * len, 2.8f, r, g, b);
                break;
              default: break;
            }
          }

          static void draw_helmet(const Fighter *f, const float *L) {
            float ax, ay, bx, by, cx, cy, s = f->scale;
            u32 hc;
            if (f->helm <= 0) return;
            hc = C(f->helmR, f->helmG, f->helmB, 255);
            switch (f->helm) {
              case 1:
                T(f, L[0] - 9, L[1] + 3, &ax, &ay); T(f, L[0] + 9, L[1] + 3, &bx, &by); T(f, L[0], L[1] + 14, &cx, &cy);
                tri(ax, ay, bx, by, cx, cy, hc);
                break;
              case 2: case 5: case 6:
                T(f, L[0], L[1] + 3, &ax, &ay);
                circ(ax, ay, 9.5f * s, hc);
                T(f, L[0] - 4, L[1] + 9, &ax, &ay); T(f, L[0] + 4, L[1] + 9, &bx, &by); T(f, L[0], L[1] + (f->helm == 6 ? 26 : 20), &cx, &cy);
                tri(ax, ay, bx, by, cx, cy, hc);
                if (f->helm == 5) {
                  T(f, L[0] - 6, L[1] + 8, &ax, &ay); T(f, L[0] - 14, L[1] + 22, &bx, &by); T(f, L[0] - 1, L[1] + 11, &cx, &cy);
                  tri(ax, ay, bx, by, cx, cy, hc);
                  T(f, L[0] + 6, L[1] + 8, &ax, &ay); T(f, L[0] + 14, L[1] + 22, &bx, &by); T(f, L[0] + 1, L[1] + 11, &cx, &cy);
                  tri(ax, ay, bx, by, cx, cy, hc);
                }
                break;
              case 3:
                T(f, L[0] + 3, L[1] - 1, &ax, &ay);
                circ(ax, ay, 6.5f * s, hc);
                break;
              case 4:
                T(f, L[0], L[1], &ax, &ay);
                circ(ax, ay, 10.5f * s, hc);
                T(f, L[0] + 3, L[1] - 1, &ax, &ay);
                rect(ax - 1.0f, ay - 1.0f, 7.0f * s, 2.5f * s, C(20, 20, 30, 255));
                break;
              default: break;
            }
          }

          static void draw_fighter(const Fighter *f) {
            float L[22], S[22], s = f->scale, w, ex, ey, ax, ay, bx, by, cx, cy;
            int i, pass;
            u32 body = C(14, 12, 22, 255), glow = C(f->ar, f->ag, f->ab, 110), eye = C(f->ar, f->ag, f->ab, 255);
            if (f->freezeT > 0) glow = C(140, 220, 255, 170);
            else if (f->burnT > 0) glow = C(255, 140, 40, 170);
            else if (f->poisonT > 0) glow = C(100, 255, 100, 150);
            else if (f->bleedT > 0) glow = C(255, 70, 70, 150);
            pose_local(f, L);
            for (i = 0; i < 11; i++) T(f, L[i * 2], L[i * 2 + 1], &S[i * 2], &S[i * 2 + 1]);
            w = 46.0f * s * (1.0f - (GROUND - f->y) / 260.0f);
            C2D_DrawEllipseSolid(f->x - w * 0.5f + OX, GROUND - 4.0f + OY, nz(), w, 8.0f, C(0, 0, 0, 110));
            for (pass = 0; pass < 2; pass++) {
              u32 c = pass ? body : glow;
              float a = pass ? 0.0f : 4.0f, tk = 5.0f * s + a, tt = 7.0f * s + a;
              line(S[2], S[3], S[4], S[5], tt, c);
              line(S[2], S[3], S[6], S[7], tk, c); line(S[6], S[7], S[8], S[9], tk, c);
              line(S[2], S[3], S[10], S[11], tk, c); line(S[10], S[11], S[12], S[13], tk, c);
              line(S[4], S[5], S[14], S[15], tk, c); line(S[14], S[15], S[16], S[17], tk, c);
              line(S[4], S[5], S[18], S[19], tk, c); line(S[18], S[19], S[20], S[21], tk, c);
              for (i = 1; i < 11; i++) circ(S[i * 2], S[i * 2 + 1], tk * 0.5f, c);
              circ(S[0], S[1], 9.0f * s + (pass ? 0.0f : 2.0f), c);
            }
            if (f->armorOn) {
              u32 ac = C(f->amr, f->amg, f->amb, 255);
              line(S[2], S[3] + 2.0f * s, S[4], S[5] - 2.0f * s, 5.0f * s, ac);
              circ(S[2], S[3] + 1.0f * s, 5.5f * s, ac);
              line(S[4] - 5.0f * s, S[5], S[4] + 5.0f * s, S[5], 3.0f * s, ac);
            }
            draw_helmet(f, L);
            if (f->st != ST_KO) {
              T(f, L[0] + 4.5f, L[1] + 1.5f, &ex, &ey);
              circ(ex, ey, 2.3f * s, eye);
            }
            if (f->acc & 1) {
              T(f, L[0] - 13, L[1] + 5, &ax, &ay); T(f, L[0] + 13, L[1] + 5, &bx, &by); T(f, L[0], L[1] + 23, &cx, &cy);
              tri(ax, ay, bx, by, cx, cy, body);
              line(ax - 2, ay, bx + 2, by, 3.0f * s, body);
            }
            if (f->acc & 2) {
              T(f, L[0] - 7, L[1] + 6, &ax, &ay); T(f, L[0] - 12, L[1] + 21, &bx, &by); T(f, L[0] - 2, L[1] + 8, &cx, &cy);
              tri(ax, ay, bx, by, cx, cy, eye);
              T(f, L[0] + 7, L[1] + 6, &ax, &ay); T(f, L[0] + 12, L[1] + 21, &bx, &by); T(f, L[0] + 2, L[1] + 8, &cx, &cy);
              tri(ax, ay, bx, by, cx, cy, eye);
            }
            if (f->acc & 8) {
              for (i = -1; i <= 1; i++) {
                T(f, L[0] + i * 6 - 3, L[1] + 8, &ax, &ay); T(f, L[0] + i * 6 + 3, L[1] + 8, &bx, &by); T(f, L[0] + i * 6, L[1] + 18, &cx, &cy);
                tri(ax, ay, bx, by, cx, cy, C(255, 200, 60, 255));
              }
            }
            if (f->acc & 16) {
              float wv = f->t * 0.3f;
              T(f, L[0] - 7, L[1] - 2, &ax, &ay);
              T(f, L[0] - 16, L[1] - 4 + sinf(wv) * 3, &bx, &by);
              T(f, L[0] - 25, L[1] - 8 + sinf(wv + 1.0f) * 4, &cx, &cy);
              line(ax, ay, bx, by, 3.0f * s, eye); line(bx, by, cx, cy, 3.0f * s, eye);
            }
            draw_weapon(f, L);
            if (f->shield > 0.0f) {
              T(f, 0, 36, &ax, &ay);
              circ(ax, ay, 40.0f * s, C(120, 200, 255, 38));
            }
            if (f->st == ST_SPECIAL && f->t < SPEC_FIRE) {
              static const int aur[8][3] = {{-1, 0, 0}, {255, 210, 100}, {-1, 0, 0}, {90, 255, 140}, {255, 255, 140}, {255, 140, 40}, {255, 150, 50}, {170, 80, 255}};
              int ar = aur[f->spKind][0] < 0 ? f->ar : aur[f->spKind][0];
              int ag = aur[f->spKind][0] < 0 ? f->ag : aur[f->spKind][1];
              int ab = aur[f->spKind][0] < 0 ? f->ab : aur[f->spKind][2];
              T(f, L[8], L[9], &ax, &ay);
              circ(ax, ay, 5.0f + f->t * 0.9f, C(ar, ag, ab, 90));
              circ(ax, ay, 3.0f + f->t * 0.3f, C(255, 255, 255, 220));
            }
          }

          static void draw_proj(const Proj *p) {
            const Fighter *o = &F[p->owner];
            float a = gframe * 0.5f, ca = cosf(a), sa = sinf(a), r = p->rad;
            int rr = 255, gg = 255, bb = 255;
            if (p->kind >= PK_SHURIKEN && p->kind <= PK_ORB) { rr = RNGS[p->kind - PK_SHURIKEN].r; gg = RNGS[p->kind - PK_SHURIKEN].g; bb = RNGS[p->kind - PK_SHURIKEN].b; }
            switch (p->kind) {
              case PK_BALL:
                circ(p->x, p->y, 13.0f, C(o->ar, o->ag, o->ab, 90));
                circ(p->x, p->y, 8.0f, C(o->ar, o->ag, o->ab, 255));
                circ(p->x, p->y, 4.0f, C(255, 255, 255, 255));
                break;
              case PK_SHURIKEN:
                line(p->x - r * ca, p->y - r * sa, p->x + r * ca, p->y + r * sa, 3.0f, C(rr, gg, bb, 255));
                line(p->x + r * sa, p->y - r * ca, p->x - r * sa, p->y + r * ca, 3.0f, C(rr, gg, bb, 255));
                circ(p->x, p->y, 2.0f, C(40, 40, 50, 255));
                break;
              case PK_KNIFE: case PK_KUNAI: case PK_DART: {
                float d = p->vx > 0 ? 1.0f : -1.0f, l = p->kind == PK_DART ? 9.0f : (p->kind == PK_KNIFE ? 12.0f : 14.0f);
                line(p->x - d * l, p->y, p->x + d * l, p->y, p->kind == PK_DART ? 2.0f : 3.0f, C(rr, gg, bb, 255));
                tri(p->x + d * l, p->y, p->x + d * (l - 6), p->y - 3, p->x + d * (l - 6), p->y + 3, C(230, 230, 240, 255));
                if (p->kind == PK_KUNAI) circ(p->x - d * l, p->y, 3.0f, C(200, 200, 215, 255));
                break;
              }
              case PK_ORB:
                circ(p->x, p->y, r + 5.0f, C(rr, gg, bb, 70));
                circ(p->x, p->y, r, C(rr, gg, bb, 255));
                circ(p->x, p->y, r * 0.4f, C(255, 255, 255, 255));
                break;
              case PK_FIRE:
                circ(p->x, p->y, r + 5.0f + sinf(a) * 2.0f, C(255, 90, 20, 80));
                circ(p->x, p->y, r, C(255, 150, 30, 255));
                circ(p->x - p->vx * 1.2f, p->y - 2.0f, r * 0.6f, C(255, 220, 90, 255));
                break;
              default:
                circ(p->x, p->y, r + 7.0f, C(170, 80, 255, 70));
                circ(p->x, p->y, r, C(50, 14, 80, 255));
                circ(p->x, p->y, r * 0.5f, C(200, 140, 255, 255));
                break;
            }
          }

          static void draw_strike(const Strike *s) {
            if (s->kind == 0) {
              if (s->t < s->delay) circ(s->x, GROUND, 8.0f + (s->t % 8), C(255, 255, 140, 90));
              else if (s->t <= s->delay + 6) {
                line(s->x, 0, s->x, GROUND, 7.0f, C(255, 255, 200, 160));
                line(s->x, 0, s->x, GROUND, 3.0f, C(255, 255, 255, 255));
              }
            } else {
              if (s->t < s->delay) circ(s->x, GROUND, 10.0f + s->t * 2.0f, C(255, 80, 40, 60));
              else if (s->t <= s->delay + 8) {
                circ(s->x, GROUND - 14.0f, 58.0f - (s->t - s->delay), C(255, 140, 40, 160));
                circ(s->x, GROUND - 14.0f, 36.0f, C(255, 230, 140, 220));
              }
            }
          }

          static void draw_world(void) {
            int i;
            if (shakeT > 0 && sv.shake) { OX = (frand() - 0.5f) * 2.0f * shakeA; OY = (frand() - 0.5f) * 2.0f * shakeA; }
            else { OX = 0; OY = 0; }
            draw_bg();
            draw_fighter(&F[0]);
            if (scene != SC_SHOP) draw_fighter(&F[1]);
            if (scene == SC_FIGHT && F[0].st != ST_KO) {
              float ax = F[0].x, ay = GROUND + 9.0f + sinf(gframe * 0.15f) * 2.0f;
              tri(ax, ay - 2, ax - 10, ay + 14, ax + 10, ay + 14, C(0, 0, 0, 230));
              tri(ax, ay, ax - 8, ay + 12, ax + 8, ay + 12, C(F[0].ar, F[0].ag, F[0].ab, 255));
            }
            for (i = 0; i < 6; i++) if (projs[i].active) draw_proj(&projs[i]);
            for (i = 0; i < 3; i++) if (strikes[i].active) draw_strike(&strikes[i]);
            for (i = 0; i < 120; i++) {
              if (parts[i].life > 0) {
                int al = parts[i].life * 14;
                if (al > 255) al = 255;
                circ(parts[i].x, parts[i].y, parts[i].r, C(parts[i].cr, parts[i].cg, parts[i].cb, al));
              }
            }
            if (sv.box && scene == SC_FIGHT) {
              for (i = 0; i < 2; i++) {
                float reach, y0, y1, kb;
                int dmg, stun, type;
                rect(F[i].x - 11.0f * F[i].scale, F[i].y - body_h(&F[i]), 22.0f * F[i].scale, body_h(&F[i]), C(0, 255, 0, 70));
                type = atk_params(&F[i], &reach, &y0, &y1, &dmg, &kb, &stun);
                if (type >= 0 && F[i].t >= F[i].aA0 && F[i].t <= F[i].aA1) {
                  float x0 = F[i].x + F[i].dir * 6.0f, x1 = F[i].x + F[i].dir * reach * F[i].scale;
                  rect(fminf(x0, x1), F[i].y - y1 * F[i].scale, fabsf(x1 - x0), (y1 - y0) * F[i].scale, C(255, 0, 0, 110));
                }
              }
            }
            OX = 0; OY = 0;
          }

