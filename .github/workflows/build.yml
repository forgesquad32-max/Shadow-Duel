          static void rect(float x, float y, float w, float h, u32 c) { C2D_DrawRectSolid(x + OX, y + OY, nz(), w, h, c); }
          static void circ(float x, float y, float r, u32 c) { C2D_DrawCircleSolid(x + OX, y + OY, nz(), r, c); }
          static void line(float x0, float y0, float x1, float y1, float th, u32 c) {
            C2D_DrawLine(x0 + OX, y0 + OY, c, x1 + OX, y1 + OY, c, th, nz());
          }
          static void tri(float x0, float y0, float x1, float y1, float x2, float y2, u32 c) {
            C2D_DrawTriangle(x0 + OX, y0 + OY, c, x1 + OX, y1 + OY, c, x2 + OX, y2 + OY, c, nz());
          }
          static void text(float x, float y, float sc, u32 col, const char *s) {
            C2D_Text t;
            parse_text(&t, s);
            C2D_TextOptimize(&t);
            C2D_DrawText(&t, C2D_WithColor, x + OX, y + OY, nz(), sc, sc, col);
          }
          static float textw(const char *s, float sc) {
            C2D_Text t;
            float w = 0, h = 0;
            parse_text(&t, s);
            C2D_TextGetDimensions(&t, sc, sc, &w, &h);
            return w;
          }
          static void textc(float cx, float y, float sc, u32 col, const char *s) {
            text(cx - textw(s, sc) * 0.5f, y, sc, col, s);
          }
          static void texts(float cx, float y, float sc, u32 col, const char *s) {
            textc(cx + 1.5f, y + 1.5f, sc, C(0, 0, 0, 200), s);
            textc(cx, y, sc, col, s);
          }
