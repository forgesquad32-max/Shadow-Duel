          static int nav(int sel, int n, u32 kD) {
            int old = sel;
            if (kD & KEY_DDOWN) sel = (sel + 1) % n;
            if (kD & KEY_DUP) sel = (sel + n - 1) % n;
            if (sel != old) sfx(SFX_MOVE);
            return sel;
          }

          static int gnav(int sel, int n, int cols, u32 kD) {
            int old = sel;
            if ((kD & KEY_DRIGHT) && sel % cols < cols - 1 && sel + 1 < n) sel++;
            if ((kD & KEY_DLEFT) && sel % cols > 0) sel--;
            if (kD & KEY_DDOWN) { if (sel + cols < n) sel += cols; else sel = sel % cols; }
            if (kD & KEY_DUP) {
              if (sel - cols >= 0) sel -= cols;
              else { int last = ((n - 1) / cols) * cols + sel % cols; if (last >= n) last -= cols; sel = last; }
            }
            if (sel != old) sfx(SFX_MOVE);
            return sel;
          }

          static int list_hit(touchPosition tp, float x0, float y0, float w, float h, float gap, int n) {
            int i;
            for (i = 0; i < n; i++) {
              float y = y0 + i * (h + gap);
              if (tp.px >= x0 && tp.px <= x0 + w && tp.py >= y && tp.py <= y + h) return i;
            }
            return -1;
          }

          static int grid_hit(touchPosition tp, float x0, float y0, float w, float h, float gx, float gy, int cols, int n) {
            int i;
            for (i = 0; i < n; i++) {
              float x = x0 + (i % cols) * (w + gx), y = y0 + (i / cols) * (h + gy);
              if (tp.px >= x && tp.px <= x + w && tp.py >= y && tp.py <= y + h) return i;
            }
            return -1;
          }

          static void scroll_fix(int sel, int *top, int vis) {
            if (sel < *top) *top = sel;
            if (sel >= *top + vis) *top = sel - vis + 1;
            if (*top < 0) *top = 0;
          }

          static int slist_hit(touchPosition tp, float x0, float y0, float w, float h, float gap, int top, int vis, int n) {
            int i;
            for (i = 0; i < vis && top + i < n; i++) {
              float y = y0 + i * (h + gap);
              if (tp.px >= x0 && tp.px <= x0 + w && tp.py >= y && tp.py <= y + h) return top + i;
            }
            return -1;
          }

          static void draw_slist(const char **lab, int n, int sel, int top, float x0, float y0, float w, float h, float gap, int vis) {
            int i;
            for (i = 0; i < vis && top + i < n; i++) button(x0, y0 + i * (h + gap), w, h, lab[top + i], top + i == sel);
            if (top > 0) tri(305, y0 + 8, 299, y0 + 16, 311, y0 + 16, C(255, 90, 100, 255));
            if (top + vis < n) { float yb = y0 + vis * (h + gap) - gap - 8; tri(305, yb + 8, 299, yb, 311, yb, C(255, 90, 100, 255)); }
          }

          /* ----------------------------------------------------------------- shop */
          static int shop_count(int tab) { return tab == 0 ? NSW : (tab == 1 ? NAR : (tab == 2 ? NGE : NSP + NPASS)); }

          static const char *shop_name(int tab, int i) {
            if (tab == 0) return tr(SWORDS[i].en, SWORDS[i].pt);
            if (tab == 1) return tr(ARMORS[i].en, ARMORS[i].pt);
            if (tab == 2) return tr(GEARS[i].en, GEARS[i].pt);
            if (i < NSP) return tr(SPECS[i].en, SPECS[i].pt);
            return tr(PASS[i - NSP].en, PASS[i - NSP].pt);
          }

          static int shop_owned(int tab, int i) {
            if (tab == 0) return (sv.swordOwn >> i) & 1;
            if (tab == 1) return (sv.armorOwn >> i) & 1;
            if (tab == 2) return (sv.gearOwn >> i) & 1;
            if (i < NSP) return (sv.specOwn >> i) & 1;
            return sv.passLv[i - NSP] > 0;
          }

          static int shop_equipped(int tab, int i) {
            if (tab == 0) return sv.swordEq == i;
            if (tab == 1) return sv.armorEq == i;
            if (tab == 2) return sv.gearEq == i;
            if (i < NSP) return sv.specEq == i;
            return 0;
          }

          static void shop_price(int tab, int i, int *coins, int *gems) {
            *coins = 0; *gems = 0;
            if (tab == 0) { *coins = SWORDS[i].coins; *gems = SWORDS[i].gems; }
            else if (tab == 1) { *coins = ARMORS[i].coins; *gems = ARMORS[i].gems; }
            else if (tab == 2) { *coins = GEARS[i].coins; *gems = GEARS[i].gems; }
            else if (i < NSP) { *coins = SPECS[i].coins; *gems = SPECS[i].gems; }
            else { int lv = sv.passLv[i - NSP]; *coins = lv >= 5 ? -1 : PASS[i - NSP].base * (lv + 1); }
          }

          static void shop_action(void) {
            int tab = shopTab, i = shopSel, coins, gems;
            char b[64];
            shop_price(tab, i, &coins, &gems);
            if (tab == 3 && i >= NSP) {
              int j = i - NSP;
              if (coins < 0) { toast(tr("Already at max level", "Já está no nível máximo")); sfx(SFX_ERR); return; }
              if (sv.coins < coins) { toast(tr("Not enough coins!", "Moedas insuficientes!")); sfx(SFX_ERR); return; }
              sv.coins -= coins; sv.passLv[j]++;
              snprintf(b, sizeof b, "%s %d", tr("Upgraded to level", "Evoluiu para o nível"), sv.passLv[j]);
              toast(b); sfx(SFX_COIN); save_game();
              return;
            }
            if (!shop_owned(tab, i)) {
              if (sv.coins < coins) { toast(tr("Not enough coins!", "Moedas insuficientes!")); sfx(SFX_ERR); return; }
              if (sv.gems < gems) { toast(tr("Not enough gems!", "Gemas insuficientes!")); sfx(SFX_ERR); return; }
              sv.coins -= coins; sv.gems -= gems;
              if (tab == 0) sv.swordOwn |= 1 << i;
              else if (tab == 1) sv.armorOwn |= 1 << i;
              else if (tab == 2) sv.gearOwn |= 1 << i;
              else sv.specOwn |= 1 << i;
              sfx(SFX_COIN);
              toast(tr("Purchased and equipped!", "Comprado e equipado!"));
            } else {
              sfx(SFX_SEL);
              toast(tr("Equipped!", "Equipado!"));
            }
            if (tab == 0) sv.swordEq = i;
            else if (tab == 1) sv.armorEq = i;
            else if (tab == 2) sv.gearEq = i;
            else sv.specEq = i;
            save_game();
          }

          static void shop_detail(char d[5][64]) {
            int tab = shopTab, i = shopSel, coins, gems;
            int j;
            const GearDef *g;
            memset(d, 0, 5 * 64);
            snprintf(d[0], 64, "%s", shop_name(tab, i));
            if (tab == 0) {
              snprintf(d[1], 64, "%s +%d%%", tr("Damage", "Dano"), SWORDS[i].dmg);
              snprintf(d[2], 64, "%s +%d", tr("Reach", "Alcance"), SWORDS[i].reach);
            } else if (tab == 1) {
              snprintf(d[1], 64, "%s +%d", tr("Health", "Vida"), ARMORS[i].hp);
              snprintf(d[2], 64, "%s +%d%%", tr("Defense", "Defesa"), ARMORS[i].def);
            } else if (tab == 2) {
              g = &GEARS[i];
              if (g->kind == 0) snprintf(d[1], 64, "%s", tr("No bonus", "Sem bônus"));
              else if (g->kind == 1) snprintf(d[1], 64, "%s +%d%%", tr("Move speed", "Velocidade"), g->val);
              else if (g->kind == 2) snprintf(d[1], 64, "%s +%d%%", tr("Energy gain", "Ganho de energia"), g->val);
              else if (g->kind == 3) snprintf(d[1], 64, "%s +%d%%", tr("Coins earned", "Moedas ganhas"), g->val);
              else if (g->kind == 4) snprintf(d[1], 64, "%s %d%%", tr("Crit chance", "Chance de crítico"), g->val);
              else snprintf(d[1], 64, "%s", tr("Slowly regains health", "Recupera vida aos poucos"));
            } else if (i < NSP) {
              snprintf(d[1], 64, "%s", tr(SPECS[i].den, SPECS[i].dpt));
              snprintf(d[2], 64, "%s %d", tr("Energy cost", "Custo de energia"), SPECS[i].cost);
            } else {
              j = i - NSP;
              snprintf(d[1], 64, "%s", tr(PASS[j].den, PASS[j].dpt));
              snprintf(d[2], 64, "%s %d/5", tr("Level", "Nível"), sv.passLv[j]);
            }
            shop_price(tab, i, &coins, &gems);
            if (tab == 3 && i >= NSP) {
              if (coins < 0) snprintf(d[3], 64, "%s", tr("MAX LEVEL", "NÍVEL MÁXIMO"));
              else snprintf(d[3], 64, "%s: %d", tr("Next level costs", "Próximo nível custa"), coins);
            } else if (shop_equipped(tab, i)) snprintf(d[3], 64, "%s", tr("Equipped", "Equipado"));
            else if (shop_owned(tab, i)) snprintf(d[3], 64, "%s", tr("Owned", "Comprado"));
            else if (gems > 0) snprintf(d[3], 64, "%s: %d %s", tr("Price", "Preço"), gems, tr("gems", "gemas"));
            else snprintf(d[3], 64, "%s: %d %s", tr("Price", "Preço"), coins, tr("coins", "moedas"));
          }

          static void shop_row(float y, int tab, int i, int sel) {
            char b[40];
            int coins, gems;
            float x = 8, w = 284, h = 22;
            rect(x, y, w, h, sel ? C(255, 60, 80, 255) : C(100, 24, 40, 255));
            rect(x + 2, y + 2, w - 4, h - 4, sel ? C(70, 14, 30, 255) : C(26, 8, 18, 255));
