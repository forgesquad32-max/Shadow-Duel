          typedef struct { const char *en, *tr; } Tr;
          static const Tr *dict_table(int lang, int *n);

          static char *extBuf = NULL;
          static struct { const char *k, *v; } ext[1024];
          static int extN = 0;
          static const char *seenTab[2048];
          static int seenN = 0;

          static unsigned hashs(const char *s) {
            unsigned h = 2166136261u;
            while (*s) h = (h ^ (unsigned char)*s++) * 16777619u;
            return h;
          }
          static const char *ext_find(const char *en) {
            unsigned i;
            int n = 0;
            if (!extN) return NULL;
            i = hashs(en) & 1023;
            while (ext[i].k && n < 1024) {
              if (!strcmp(ext[i].k, en)) return ext[i].v;
              i = (i + 1) & 1023; n++;
            }
            return NULL;
          }
          static void load_ext_lang(int lang) {
            FILE *f;
            char path[96], *p, *eq, *end;
            long sz;
            if (extBuf) { free(extBuf); extBuf = NULL; }
            memset(ext, 0, sizeof ext); extN = 0;
            if (lang < 2 || lang >= NLANG) return;
            snprintf(path, sizeof path, SD_ROOT "/3ds/ShadowDuel/lang/%s.txt", LANG_CODE[lang]);
            f = fopen(path, "rb");
            if (!f) return;
            fseek(f, 0, SEEK_END); sz = ftell(f); fseek(f, 0, SEEK_SET);
            if (sz <= 0 || sz > 60000) { fclose(f); return; }
            extBuf = (char *)malloc((size_t)sz + 1);
            if (!extBuf) { fclose(f); return; }
            if (fread(extBuf, 1, (size_t)sz, f) != (size_t)sz) { fclose(f); free(extBuf); extBuf = NULL; return; }
            fclose(f);
            extBuf[sz] = 0;
            for (p = extBuf; *p && extN < 700; p = end ? end + 1 : p + strlen(p)) {
              end = strchr(p, '\n');
              if (end) *end = 0;
              { char *r = p + strlen(p); while (r > p && (r[-1] == '\r' || r[-1] == ' ')) *--r = 0; }
              if (!*p || *p == '#') { if (!end) break; continue; }
              eq = strchr(p, '=');
              if (eq && eq > p && eq[1]) {
                unsigned i;
                *eq = 0;
                i = hashs(p) & 1023;
                while (ext[i].k) i = (i + 1) & 1023;
                ext[i].k = p; ext[i].v = eq + 1; extN++;
              }
              if (!end) break;
            }
          }
          static void note_seen(const char *en) {
            unsigned i = (unsigned)(((size_t)en >> 3) * 2654435761u) & 2047;
            int n = 0;
            while (seenTab[i] && n < 2048) { if (seenTab[i] == en) return; i = (i + 1) & 2047; n++; }
            if (seenN < 1500 && !seenTab[i]) { seenTab[i] = en; seenN++; }
          }
          static const char *dict_find(int lang, const char *en) {
            int n = 0, i;
            const Tr *t = dict_table(lang, &n);
            for (i = 0; i < n; i++) if (!strcmp(t[i].en, en)) return t[i].tr;
            return NULL;
          }
          static const char *tr(const char *en, const char *pt) {
            const char *t;
            note_seen(en);
            if (sv.lang == 0) return pt;
            if (sv.lang == 1) return en;
            t = ext_find(en);
            if (t) return t;
            t = dict_find(sv.lang, en);
            return t ? t : en;
          }
          static int export_template(void) {
            FILE *f;
            int i, n = 0;
            mkdir(SD_ROOT "/3ds", 0777);
            mkdir(SD_ROOT "/3ds/ShadowDuel", 0777);
            mkdir(SD_ROOT "/3ds/ShadowDuel/lang", 0777);
            f = fopen(SD_ROOT "/3ds/ShadowDuel/lang/template.txt", "wb");
            if (!f) return -1;
            fprintf(f, "# Shadow Duel language template. Format: English text=Your translation\n");
            fprintf(f, "# Save as <code>.txt (es-ES, fr-FR, de-DE, it-IT, ja-JP, ru-RU, zh-CN) in this folder.\n");
            for (i = 0; i < 2048; i++) if (seenTab[i] && strchr(seenTab[i], '=') == NULL) { fprintf(f, "%s=%s\n", seenTab[i], seenTab[i]); n++; }
            fclose(f);
            return n;
          }
          static void apply_language(void) {
            gFont = NULL;
            load_ext_lang(sv.lang);
            if (sv.lang == 6) { if (!fontJP) fontJP = C2D_FontLoadSystem(CFG_REGION_JPN); gFont = fontJP; }
            else if (sv.lang == 8) { if (!fontCN) fontCN = C2D_FontLoadSystem(CFG_REGION_CHN); gFont = fontCN; }
          }
          static void parse_text(C2D_Text *t, const char *s) {
            if (gFont) C2D_TextFontParse(t, gFont, gBuf, s);
            else C2D_TextParse(t, gBuf, s);
          }

