            } else if (scene == SC_ACH) {
              bottom_bg(tr("ACHIEVEMENTS", "CONQUISTAS"));
              build_ach();
              draw_slist(achLab, NACH, achSel, achTop, 20, 28, 270, 24, 3, 7);
              snprintf(b, sizeof b, "%d/%d", __builtin_popcount(sv.achMask), NACH);
              textc(160, 222, 0.45f, C(255, 225, 140, 255), b);
            } else if (scene == SC_HOW) {
              static const char *HE[4][6] = {
                {"D-Pad / Circle Pad: move, Down: crouch", "A punch   B kick   X weapon strike", "Y throw   R magic   L block (hold)", "Up: jump   Double-tap: dash", "Down + B: low kick", "START: pause   Remap in Settings"},
                {"Hits and blocks fill your energy bar.", "Block only works facing the enemy.", "Crouch to dodge high punches.", "Jump to dodge low kicks and bolts.", "Weapons differ in damage, reach, speed.", "Enchants: poison, fire, freeze and more."},
                {"Story: 5 acts. Eclipse is the hard mode.", "Tournament: 3 cups of 6 fights.", "Survival and Endless: how far can you go?", "Boss rush, Bodyguards, Challenges.", "Ascension: a tower with special rules.", "Dojo: train against a dummy."},
                {"Win fights to earn XP, coins and gems.", "Level up and spend skill points", "in the Armory (Skills tab).", "Buy gear in the Shop, equip in the Armory.", "Progress saves automatically.", "Music needs dspfirm.cdc on the SD card."}
              };
              static const char *HP[4][6] = {
                {"D-Pad / Analógico: mover, Baixo: agachar", "A soco   B chute   X golpe de arma", "Y arremessar   R magia   L defesa", "Cima: pular   Toque duplo: avanço", "Baixo + B: chute baixo", "START: pausar   Mude em Opções"},
                {"Golpes e defesas enchem a energia.", "Bloquear só funciona de frente.", "Agache para desviar de socos altos.", "Pule para desviar de chutes e raios.", "Armas variam em dano, alcance e ritmo.", "Encantos: veneno, fogo, gelo e mais."},
                {"História: 5 atos. Eclipse é o modo difícil.", "Torneio: 3 copas de 6 lutas.", "Sobrevivência e Sem fim: até onde vai?", "Corrida de chefes, Guarda-costas, Desafios.", "Ascensão: torre com regras especiais.", "Dojo: treine contra um boneco."},
                {"Vença lutas para ganhar XP, moedas e gemas.", "Suba de nível e gaste pontos", "no Arsenal (aba Habilidades).", "Compre na Loja, equipe no Arsenal.", "O progresso salva sozinho.", "A música precisa do dspfirm.cdc no SD."}
              };
              bottom_bg(tr("HOW TO PLAY", "COMO JOGAR"));
              for (i = 0; i < 6; i++) text(14, 30 + i * 22.0f, 0.43f, C(240, 220, 220, 255), tr(HE[howPage][i], HP[howPage][i]));
              snprintf(b, sizeof b, "%d/4  %s", howPage + 1, tr("Tap or D-Pad: next page", "Toque ou D-Pad: próxima página"));
              textc(160, 172, 0.42f, C(170, 120, 130, 255), b);
              button(80, 202, 160, 28, tr("Back", "Voltar"), 1);
            } else if (scene == SC_SHOP) {
              static const char *TE[7] = {"Weap", "Rngd", "Armr", "Helm", "Magic", "Ench", "Skill"};
              static const char *TP[7] = {"Arma", "Dist.", "Arm.", "Cap.", "Magia", "Enc.", "Hab."};
              int tt = tab_total();
              float tw = 304.0f / tt;
              bottom_bg(shopMode ? tr("ARMORY", "ARSENAL") : tr("SHOP", "LOJA"));
              for (i = 0; i < tt; i++) {
                float x = 8 + i * tw;
                rect(x, 26, tw - 2, 20, i == shopTab ? C(255, 60, 80, 255) : C(100, 24, 40, 255));
                rect(x + 2, 28, tw - 6, 16, i == shopTab ? C(70, 14, 30, 255) : C(26, 8, 18, 255));
                textc(x + (tw - 2) * 0.5f, 29, 0.36f, i == shopTab ? C(255, 220, 220, 255) : C(200, 160, 165, 255), tr(TE[i], TP[i]));
              }
              for (i = 0; i < 6 && shopTop + i < shopN; i++) shop_row(52 + i * 25.0f, shopTab, shopTop + i, shopTop + i == shopSel);
              if (shopN == 0) textc(160, 100, 0.5f, C(200, 160, 165, 255), tr("Nothing here yet", "Nada aqui ainda"));
              if (shopTop > 0) tri(304, 56, 298, 64, 310, 64, C(255, 90, 100, 255));
              if (shopTop + 6 < shopN) tri(304, 200, 298, 192, 310, 192, C(255, 90, 100, 255));
              draw_money(10, 214);
              button(200, 208, 112, 26, action_label(), 1);
            } else if (scene == SC_FIGHT) {
              bottom_bg(tr("FIGHT", "LUTA"));
              if (paused) {
                static const char *DN_EN[3] = {"Idle", "Blocking", "Fighting"};
                static const char *DN_PT[3] = {"Parado", "Bloqueando", "Lutando"};
                const char *pl[5];
                int pn = (mode == M_TRAINING) ? 5 : 3;
                char d1[48], d2[48];
                pl[0] = tr("Resume", "Continuar"); pl[1] = tr("Restart fight", "Reiniciar luta"); pl[2] = tr("Quit to menu", "Sair para o menu");
                snprintf(d1, sizeof d1, "%s: %s", tr("Dummy", "Boneco"), tr(DN_EN[trainDummy], DN_PT[trainDummy]));
                snprintf(d2, sizeof d2, "%s: %s", tr("Infinite energy", "Energia infinita"), onoff(trainInf));
                pl[3] = d1; pl[4] = d2;
                for (i = 0; i < pn; i++) button(30, 52 + i * 34.0f, 260, 28, pl[i], i == pauseSel);
              } else {
                snprintf(b, sizeof b, "vs %s", OPP[curOpp].name);
                textc(160, 28, 0.7f, C(255, 255, 255, 255), b);
                textc(160, 54, 0.42f, C(255, 190, 160, 255), opp_title(curOpp));
                run_info(b, sizeof b);
                textc(160, 74, 0.42f, C(255, 220, 90, 255), b);
                text(14, 104, 0.4f, C(200, 170, 175, 255), tr("A punch  B kick  X weapon  Y throw", "A soco  B chute  X arma  Y arremesso"));
                text(14, 122, 0.4f, C(200, 170, 175, 255), tr("L block (hold)  Up jump  Down crouch", "L defesa  Cima pula  Baixo agacha"));
                snprintf(b, sizeof b, "R: %s (%d)", tr(MAGS[F[0].spKind].en, MAGS[F[0].spKind].pt), F[0].spCost);
                text(14, 140, 0.42f, C(150, 220, 255, 255), b);
                snprintf(b, sizeof b, "Y: %s", tr(RNGS[F[0].rKind].en, RNGS[F[0].rKind].pt));
                text(14, 158, 0.42f, C(150, 220, 255, 255), b);
                if (F[0].ench >= 0) {
                  snprintf(b, sizeof b, "%s %d", tr(ENCH[F[0].ench].en, ENCH[F[0].ench].pt), F[0].enchLv);
                  text(14, 176, 0.42f, C(160, 245, 190, 255), b);
                }
                draw_money(16, 204);
                button(236, 196, 76, 32, tr("Pause", "Pausa"), 0);
              }
            } else if (scene == SC_RESULT) {
              bottom_bg(tr("RESULT", "RESULTADO"));
              for (i = 0; i < resN; i++) button(30, 124 + i * 36.0f, 260, 30, resLabels[i], i == resSel);
              draw_money(16, 66);
              draw_xpbar(180, 78, 120);
            }
          }

          int main(int argc, char **argv) {
            C3D_RenderTarget *top, *bot;
            (void)argc; (void)argv;
            gfxInitDefault();
            C3D_Init(C3D_DEFAULT_CMDBUF_SIZE);
            C2D_Init(C2D_DEFAULT_MAX_OBJECTS);
            C2D_Prepare();
            top = C2D_CreateScreenTarget(GFX_TOP, GFX_LEFT);
            bot = C2D_CreateScreenTarget(GFX_BOTTOM, GFX_LEFT);
            gBuf = C2D_TextBufNew(8192);
            srand((unsigned)time(NULL));
            memset(&sv, 0, sizeof sv);
            sv_defaults();
            load_game();
            apply_language();
            audio_init();
            menu_enter();
            if (!audioOk) toast("Audio off: dspfirm.cdc missing");
            while (aptMainLoop() && running) {
              circlePosition cp;
              touchPosition tp;
              u32 kD, kH;
              hidScanInput();
              kD = hidKeysDown(); kH = hidKeysHeld();
              hidCircleRead(&cp); hidTouchRead(&tp);
              gframe++;
              update(kD, kH, cp, tp);
              audio_update();
              C3D_FrameBegin(C3D_FRAME_SYNCDRAW);
              C2D_TextBufClear(gBuf);
              C2D_TargetClear(top, C(0, 0, 0, 255));
              C2D_SceneBegin(top);
              zc = 0;
              draw_top();
              C2D_TargetClear(bot, C(0, 0, 0, 255));
              C2D_SceneBegin(bot);
              zc = 0;
              draw_bottom();
              C3D_FrameEnd(0);
            }
            save_game();
            if (audioOk) ndspExit();
            C2D_TextBufDelete(gBuf);
            C2D_Fini();
            C3D_Fini();
            gfxExit();
            return 0;
          }
