          static void change_setting(int row, int d) {
            switch (row) {
              case 0: sv.lang = (sv.lang + NLANG + d) % NLANG; apply_language(); break;
              case 2: sv.diff = (sv.diff + 3 + d) % 3; break;
              case 3: sv.rounds = ((sv.rounds - 1 + 3 + d) % 3) + 1; break;
              case 4: sv.timeIdx = (sv.timeIdx + 3 + d) % 3; break;
              case 5: sv.shake = !sv.shake; break;
              case 6: sv.box = !sv.box; break;
              case 7: sv.music = !sv.music; break;
              case 8: sv.sfx = !sv.sfx; break;
              default: break;
            }
          }

