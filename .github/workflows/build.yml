          static void draw_world(void) {
            int i;
            if (shakeT > 0 && setShake) { OX = (frand() - 0.5f) * 2.0f * shakeA; OY = (frand() - 0.5f) * 2.0f * shakeA; }
            else { OX = 0; OY = 0; }
            draw_bg();
            draw_fighter(&F[0]);
            if (scene != SC_SHOP) draw_fighter(&F[1]);
            if (scene == SC_FIGHT && F[0].st != ST_KO) {
              float ax = F[0].x, ay = GROUND + 9.0f + sinf(gframe * 0.15f) * 2.0f;
              tri(ax, ay - 2, ax - 10, ay + 14, ax + 10, ay + 14, C(0, 0, 0, 230));
              tri(ax, ay, ax - 8, ay + 12, ax + 8, ay + 12, C(F[0].ar, F[0].ag, F[0].ab, 255));
            }
            for (i = 0; i < 4; i++) {
              if (projs[i].active) {
                circ(projs[i].x, projs[i].y, 13.0f, C(F[projs[i].owner].ar, F[projs[i].owner].ag, F[projs[i].owner].ab, 90));
                circ(projs[i].x, projs[i].y, 8.0f, C(F[projs[i].owner].ar, F[projs[i].owner].ag, F[projs[i].owner].ab, 255));
                circ(projs[i].x, projs[i].y, 4.0f, C(255, 255, 255, 255));
              }
            }
            for (i = 0; i < 120; i++) {
              if (parts[i].life > 0) {
                int al = parts[i].life * 14;
                if (al > 255) al = 255;
                circ(parts[i].x, parts[i].y, parts[i].r, C(parts[i].cr, parts[i].cg, parts[i].cb, al));
              }
            }
            if (setBox && scene == SC_FIGHT) {
              for (i = 0; i < 2; i++) {
                float reach, y0, y1, kb;
                int a0, a1, dmg, stun;
                rect(F[i].x - 11.0f * F[i].scale, F[i].y - 72.0f * F[i].scale, 22.0f * F[i].scale, 72.0f * F[i].scale, C(0, 255, 0, 70));
                if (atk_params(&F[i], &reach, &y0, &y1, &a0, &a1, &dmg, &kb, &stun) && F[i].t >= a0 && F[i].t <= a1) {
                  float x0 = F[i].x + F[i].dir * 6.0f, x1 = F[i].x + F[i].dir * reach * F[i].scale;
                  rect(fminf(x0, x1), F[i].y - y1 * F[i].scale, fabsf(x1 - x0), (y1 - y0) * F[i].scale, C(255, 0, 0, 110));
                }
              }
            }
            OX = 0; OY = 0;
          }

