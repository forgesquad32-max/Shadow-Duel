          static void build_settings(void) {
            int i;
            snprintf(setBuf[0], 44, "%s: %s", tr("Language", "Idioma"), sv.lang ? "Português" : "English");
            snprintf(setBuf[1], 44, "%s: %s", tr("Difficulty", "Dificuldade"), setDiff == 0 ? tr("Easy", "Fácil") : (setDiff == 1 ? tr("Normal", "Normal") : tr("Hard", "Difícil")));
            snprintf(setBuf[2], 44, "%s: %d", tr("Rounds to win", "Rounds para vencer"), setRounds);
            snprintf(setBuf[3], 44, "%s: %d s", tr("Round time", "Tempo do round"), timeVals[setTimeIdx]);
            snprintf(setBuf[4], 44, "%s: %s", tr("Screen shake", "Tremor de tela"), setShake ? tr("On", "Ligado") : tr("Off", "Desligado"));
            snprintf(setBuf[5], 44, "%s: %s", tr("Show hitboxes", "Mostrar hitboxes"), setBox ? tr("On", "Ligado") : tr("Off", "Desligado"));
            snprintf(setBuf[6], 44, "%s: %s", tr("Music", "Música"), sv.music ? tr("On", "Ligado") : tr("Off", "Desligado"));
            snprintf(setBuf[7], 44, "%s: %s", tr("Sound effects", "Efeitos sonoros"), sv.sfx ? tr("On", "Ligado") : tr("Off", "Desligado"));
            snprintf(setBuf[8], 44, "%s", eraseArm ? tr("Press A again to ERASE!", "Aperte A de novo para APAGAR!") : tr("Erase save data", "Apagar progresso"));
            snprintf(setBuf[9], 44, "%s", tr("Back", "Voltar"));
            for (i = 0; i < 10; i++) setLab[i] = setBuf[i];
          }

          static void change_setting(int row, int d) {
            switch (row) {
              case 0: sv.lang = !sv.lang; break;
              case 1: setDiff = (setDiff + 3 + d) % 3; break;
              case 2: setRounds = ((setRounds - 1 + 3 + d) % 3) + 1; break;
              case 3: setTimeIdx = (setTimeIdx + 3 + d) % 3; break;
              case 4: setShake = !setShake; break;
              case 5: setBox = !setBox; break;
              case 6: sv.music = !sv.music; break;
              case 7: sv.sfx = !sv.sfx; break;
              default: break;
            }
          }

          static void build_acts(void) {
            int a;
            for (a = 0; a < NACT; a++) {
              if (a < sv.actsUnlocked) snprintf(actBuf[a], sizeof actBuf[a], "%s %d: %s", tr("Act", "Ato"), a + 1, act_name(a));
              else snprintf(actBuf[a], sizeof actBuf[a], "%s %d: ???  (%s)", tr("Act", "Ato"), a + 1, tr("locked", "bloqueado"));
              actLab[a] = actBuf[a];
            }
          }

          static void menu_action(int i) {
            sfx(SFX_SEL);
            switch (i) {
              case 0:
                if (sv.curFight > 2) { scene = SC_ACTS; actsSel = NACT - 1; }
                else if (sv.curFight == 0) open_storytxt(sv.curAct);
                else start_story_fight(sv.curAct, sv.curFight);
                break;
              case 1: scene = SC_ACTS; actsSel = clampi(sv.curAct, 0, NACT - 1); break;
              case 2: start_match(M_SURVIVAL, 0); break;
              case 3: scene = SC_PICK; pickSel = 0; style_opp(&F[1], 0); break;
              case 4: start_match(M_TRAINING, 0); break;
              case 5: shop_enter(); break;
              case 6: scene = SC_SET; setSel = 0; setTop = 0; eraseArm = 0; break;
              case 7: scene = SC_HOW; howPage = 0; break;
              case 8: toast(save_game() ? tr("Game saved!", "Jogo salvo!") : tr("Could not save (no SD card?)", "Não foi possível salvar")); break;
              default: save_game(); running = 0; break;
            }
          }

          static void update_demo(void) {
            Inp none;
            memset(&none, 0, sizeof none);
            update_fighter(&F[0], &F[1], none, 0);
            update_fighter(&F[1], &F[0], none, 0);
            update_parts();
          }

          static void update(u32 kD, u32 kH, circlePosition cp, touchPosition tp) {
            int hit = -1, touch = (kD & KEY_TOUCH) != 0, i;
            if (toastT > 0) toastT--;
            if (scene == SC_MENU) {
              update_demo();
              menuSel = gnav(menuSel, 10, 2, kD);
              if (touch) { hit = grid_hit(tp, 14, 30, 142, 30, 8, 6, 2, 10); if (hit >= 0) menuSel = hit; }
              if ((kD & KEY_A) || hit >= 0) menu_action(menuSel);
            } else if (scene == SC_ACTS) {
              update_demo();
              actsSel = nav(actsSel, NACT, kD);
              if (touch) { hit = list_hit(tp, 20, 34, 280, 30, 5, NACT); if (hit >= 0) actsSel = hit; }
              if (kD & KEY_B) menu_enter();
              else if ((kD & KEY_A) || hit >= 0) {
                if (actsSel < sv.actsUnlocked) { sfx(SFX_SEL); open_storytxt(actsSel); }
                else { sfx(SFX_ERR); toast(tr("Finish the previous act first", "Termine o ato anterior primeiro")); }
              }
            } else if (scene == SC_STORYTXT) {
              update_demo();
              if (kD & KEY_B) menu_enter();
              else if ((kD & KEY_A) || touch) {
                sfx(SFX_SEL);
                if (txtKind == 0) start_story_fight(txtAct, 0); else menu_enter();
              }
            } else if (scene == SC_PICK) {
              update_demo();
              pickSel = nav(pickSel, 8, kD);
              if (touch) { hit = list_hit(tp, 30, 26, 260, 24, 3, 8); if (hit >= 0) pickSel = hit; }
              if (pickSel < NOPP) style_opp(&F[1], pickSel);
              if (kD & KEY_B) menu_enter();
              else if ((kD & KEY_A) || hit >= 0) {
                sfx(SFX_SEL);
                if (pickSel >= NOPP) menu_enter(); else start_match(M_FREE, pickSel);
              }
            } else if (scene == SC_SET) {
              update_demo();
              setSel = nav(setSel, 10, kD);
              if (setSel != 8) eraseArm = 0;
              scroll_fix(setSel, &setTop, 7);
              if (kD & KEY_DLEFT) { change_setting(setSel, -1); sfx(SFX_MOVE); }
              if (kD & KEY_DRIGHT) { change_setting(setSel, 1); sfx(SFX_MOVE); }
              if (touch) { hit = slist_hit(tp, 20, 28, 270, 24, 3, setTop, 7, 10); if (hit >= 0) setSel = hit; }
              if ((kD & KEY_A) || hit >= 0) {
                sfx(SFX_SEL);
                if (setSel == 9) menu_enter();
                else if (setSel == 8) {
                  if (!eraseArm) eraseArm = 1;
                  else { sv_defaults(); save_game(); eraseArm = 0; toast(tr("Save data erased", "Progresso apagado")); }
                } else change_setting(setSel, 1);
              }
              if (kD & KEY_B) menu_enter();
            } else if (scene == SC_HOW) {
              update_demo();
              if (kD & (KEY_DRIGHT | KEY_DLEFT | KEY_DDOWN | KEY_DUP)) { howPage = (howPage + 1) % 3; sfx(SFX_MOVE); }
              if (touch && tp.py < 196) { howPage = (howPage + 1) % 3; sfx(SFX_MOVE); }
              if ((kD & (KEY_A | KEY_B)) || (touch && tp.py >= 196)) menu_enter();
            } else if (scene == SC_SHOP) {
              int n = shop_count(shopTab), pv[4];
              update_demo();
              if (kD & (KEY_DRIGHT | KEY_R)) { shopTab = (shopTab + 1) % 4; shopSel = 0; shopTop = 0; sfx(SFX_MOVE); }
              if (kD & (KEY_DLEFT | KEY_L)) { shopTab = (shopTab + 3) % 4; shopSel = 0; shopTop = 0; sfx(SFX_MOVE); }
              n = shop_count(shopTab);
              shopSel = nav(shopSel, n, kD);
              scroll_fix(shopSel, &shopTop, 6);
              if (touch) {
                for (i = 0; i < 4; i++)
                  if (tp.px >= 8 + i * 78 && tp.px <= 82 + i * 78 && tp.py >= 26 && tp.py <= 46) { shopTab = i; shopSel = 0; shopTop = 0; sfx(SFX_MOVE); }
                hit = slist_hit(tp, 8, 52, 284, 22, 3, shopTop, 6, shop_count(shopTab));
                if (hit >= 0) { if (hit != shopSel) sfx(SFX_MOVE); shopSel = hit; }
                if (tp.px >= 200 && tp.px <= 312 && tp.py >= 208 && tp.py <= 234) shop_action();
              }
              if (kD & KEY_A) shop_action();
              if (kD & KEY_B) menu_enter();
              pv[0] = sv.swordEq; pv[1] = sv.armorEq; pv[2] = sv.gearEq; pv[3] = sv.specEq;
              if (shopSel < shop_count(shopTab) && (shopTab < 3)) pv[shopTab] = shopSel;
              apply_loadout_ex(&F[0], pv[0], pv[1], pv[2], pv[3]);
            } else if (scene == SC_FIGHT) {
              if (paused) {
                pauseSel = nav(pauseSel, 3, kD);
                if (touch) { hit = list_hit(tp, 30, 60, 260, 32, 8, 3); if (hit >= 0) pauseSel = hit; }
                if ((kD & (KEY_B | KEY_START))) paused = 0;
                else if ((kD & KEY_A) || hit >= 0) {
                  if (pauseSel == 0) paused = 0;
                  else if (pauseSel == 1) {
                    if (mode == M_STORY) start_story_fight(storyAct, storyFight);
                    else start_match(mode, mode == M_SURVIVAL ? 0 : curOpp);
                  } else menu_enter();
                }
                return;
              }
              if ((kD & KEY_START) || (touch && tp.px >= 236 && tp.py >= 196)) { paused = 1; pauseSel = 0; return; }
              update_fight(kD, kH, cp);
            } else if (scene == SC_RESULT) {
              update_demo();
              resSel = nav(resSel, resN, kD);
              if (touch) { hit = list_hit(tp, 30, 124, 260, 30, 6, resN); if (hit >= 0) resSel = hit; }
              if ((kD & KEY_A) || hit >= 0) {
                sfx(SFX_SEL);
                switch (resAct[resSel]) {
                  case RA_NEXT: start_story_fight(storyAct, storyFight + 1); break;
                  case RA_NEXTACT: open_storytxt(storyAct + 1); break;
                  case RA_ENDING: txtKind = 1; scene = SC_STORYTXT; demo_init(); music_play(0, 0); break;
                  case RA_RETRY: start_story_fight(storyAct, storyFight); break;
                  case RA_AGAIN: if (mode == M_SURVIVAL) start_match(M_SURVIVAL, 0); else start_match(mode, curOpp); break;
                  case RA_SHOP: shop_enter(); break;
                  default: menu_enter(); break;
                }
              }
            }
          }

