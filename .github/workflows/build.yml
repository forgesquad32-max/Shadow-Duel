            float pf = (float)F[0].hp / F[0].maxhp, ef = (float)F[1].hp / F[1].maxhp;
            draw_bar(16, 12, 160, 12, pf, pf > 0.3f ? C(80, 220, 120, 255) : C(255, 80, 70, 255), 0);
            draw_bar(224, 12, 160, 12, ef, ef > 0.3f ? C(240, 190, 60, 255) : C(255, 80, 70, 255), 1);
            if (F[0].shield > 0.0f) rect(16, 24, 160.0f * clampf(F[0].shield / (10.0f * (F[0].enchLv > 0 ? F[0].enchLv : 1)), 0, 1), 2, C(120, 200, 255, 255));
            draw_bar(16, 28, 100, 5, F[0].energy / 100.0f, C(90, 200, 255, 255), 0);
            draw_bar(284, 28, 100, 5, F[1].energy / 100.0f, C(190, 120, 255, 255), 1);
            snprintf(b, sizeof b, "%s  Lv%d", tr("YOU", "VOCÊ"), sv.level);
            text(16, 36, 0.45f, C(255, 255, 255, 255), b);
            text(384 - textw(OPP[curOpp].name, 0.45f), 36, 0.45f, C(255, 255, 255, 255), OPP[curOpp].name);
            if (timerF > 0) snprintf(b, sizeof b, "%d", (timerF + 59) / 60); else snprintf(b, sizeof b, "--");
            texts(200, 8, 0.8f, C(255, 240, 200, 255), b);
            if (mode != M_TRAINING) {
              for (i = 0; i < needWins; i++) {
                circ(20 + i * 12, 54, 4, wins[0] > i ? C(255, 220, 90, 255) : C(70, 30, 40, 255));
                circ(380 - i * 12, 54, 4, wins[1] > i ? C(255, 220, 90, 255) : C(70, 30, 40, 255));
              }
            }
            if (F[0].comboN >= 2) { snprintf(b, sizeof b, "%d %s", F[0].comboN, tr("HITS", "GOLPES")); texts(70, 70, 0.7f, C(255, 220, 90, 255), b); }
            if (fs == FS_INTRO) {
              if (fst < 70) {
                if (mode == M_TRAINING) snprintf(b, sizeof b, "%s", tr("DOJO", "DOJO"));
                else if (needWins > 1 && wins[0] == needWins - 1 && wins[1] == needWins - 1) snprintf(b, sizeof b, "%s", tr("FINAL ROUND", "ROUND FINAL"));
                else snprintf(b, sizeof b, "ROUND %d", roundNo);
                if (runKind == RK_STORY && roundNo == 1) {
                  snprintf(b, sizeof b, "%s %d - %s %d%s", tr("ACT", "ATO"), storyAct + 1, tr("FIGHT", "LUTA"), runIdx + 1, eclipse ? " (ECLIPSE)" : "");
                  texts(200, 56, 0.6f, C(255, 220, 140, 255), b);
                  snprintf(b, sizeof b, "ROUND %d", roundNo);
                } else if (infinite_kind() || runKind == RK_TOURN || runKind == RK_BOSSRUSH || runKind == RK_BODY) {
                  snprintf(b, sizeof b, "%s %d", tr("FIGHT", "LUTA"), runIdx + 1);
                  texts(200, 56, 0.6f, C(255, 220, 140, 255), b);
                  snprintf(b, sizeof b, "ROUND %d", roundNo);
                }
                texts(200, 80, 1.3f, C(255, 255, 255, 255), b);
                texts(200, 128, 0.6f, C(255, 200, 160, 255), opp_title(curOpp));
              } else texts(200, 80, 1.5f, C(255, 70, 80, 255), tr("FIGHT!", "LUTE!"));
            } else if (fs == FS_KO) {
              if (koWinner < 0) texts(200, 80, 1.4f, C(255, 255, 255, 255), tr("DRAW", "EMPATE"));
              else if (timerF == 0 && mode != M_TRAINING && F[0].hp > 0 && F[1].hp > 0) texts(200, 80, 1.4f, C(255, 255, 255, 255), tr("TIME UP", "TEMPO ESGOTADO"));
              else texts(200, 80, 1.8f, C(255, 50, 60, 255), "K.O.");
            }
            if (paused) {
              rect(0, 0, 400, 240, C(0, 0, 0, 150));
              texts(200, 90, 1.3f, C(255, 255, 255, 255), tr("PAUSED", "PAUSADO"));
            }
          }

