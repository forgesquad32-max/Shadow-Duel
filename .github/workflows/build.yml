          static void open_list(int k) { scene = SC_LIST; listKind = k; listSel = 0; if (k == LK_DUEL) style_opp(&F[1], 0); }

          static void list_action(int k, int i) {
            sfx(SFX_SEL);
            if (i >= list_count(k) - 1) { menu_enter(); return; }
            if (k == LK_MODES) {
              switch (i) {
                case 0: open_list(LK_DUEL); break;
                case 1: start_run(RK_ENDLESS, 0); break;
                case 2: start_run(RK_BOSSRUSH, 0); break;
                case 3: open_list(LK_BODY); break;
                case 4: open_list(LK_CHALL); break;
                default: start_run(RK_ASC, 0); break;
              }
            } else if (k == LK_TOURN) start_run(RK_TOURN, i);
            else if (k == LK_BODY) start_run(RK_BODY, i);
            else if (k == LK_CHALL) start_run(RK_CHALL, i);
            else start_run(RK_DUEL, i);
          }

          static void menu_action(int i) {
            sfx(SFX_SEL);
            switch (i) {
              case 0:
                eclipse = 0;
                if (sv.curFight > 2) { scene = SC_ACTS; actsSel = NACT - 1; }
                else if (sv.curFight == 0) open_storytxt(sv.curAct);
                else start_run_at(RK_STORY, sv.curAct, sv.curFight);
                break;
              case 1:
                if (!newArm) { newArm = 1; toast(tr("Press again to erase ALL progress", "Aperte de novo para APAGAR tudo")); }
                else { newArm = 0; sv_defaults(); save_game(); eclipse = 0; open_storytxt(0); }
                break;
              case 2: scene = SC_ACTS; actsSel = clampi(sv.curAct, 0, NACT - 1); break;
              case 3: open_list(LK_TOURN); break;
              case 4: start_run(RK_SURV, 0); break;
              case 5: start_run(RK_TRAIN, 0); break;
              case 6: shop_enter(1); break;
              case 7: shop_enter(0); break;
              case 8: scene = SC_ACH; achSel = 0; achTop = 0; break;
              case 9: open_list(LK_MODES); break;
              case 10: scene = SC_SET; setSel = 0; setTop = 0; eraseArm = 0; break;
              default: save_game(); running = 0; break;
            }
            if (i != 1) newArm = 0;
          }


          /* ------------------------------------------------------- scenes: update */
          static int ctrlTop = 0;

          static void update_demo(void) {
            Inp none;
            memset(&none, 0, sizeof none);
            update_fighter(&F[0], &F[1], none, 0);
            update_fighter(&F[1], &F[0], none, 0);
            update_parts();
          }

          static const char *action_label(void) {
            int tab = shopTab, i;
            if (shopN <= 0) return "-";
            i = shopIdx[shopSel];
            if (tab == 6) return i < 7 ? tr("Upgrade", "Evoluir") : tr("Reset", "Redefinir");
            if (tab == 5) {
              if (sv.enchLv[i] == 0) return tr("Buy", "Comprar");
              if (sv.eEq != i) return tr("Equip", "Equipar");
              return sv.enchLv[i] >= 3 ? "MAX" : tr("Upgrade", "Evoluir");
            }
            if (item_equipped(tab, i)) return tr("Equipped", "Equipado");
            if (item_owned(tab, i)) return tr("Equip", "Equipar");
            return tr("Buy", "Comprar");
          }

          static void update(u32 kD, u32 kH, circlePosition cp, touchPosition tp) {
            int hit = -1, touch = (kD & KEY_TOUCH) != 0, i, n;
            if (toastT > 0) toastT--;
            if (scene == SC_MENU) {
              update_demo();
              menuSel = gnav(menuSel, 12, 2, kD);
              if (touch) { hit = grid_hit(tp, 14, 28, 142, 26, 8, 4, 2, 12); if (hit >= 0) menuSel = hit; }
              if ((kD & KEY_A) || hit >= 0) menu_action(menuSel);
            } else if (scene == SC_LIST) {
              update_demo();
              n = list_count(listKind);
              listSel = nav(listSel, n, kD);
              if (touch) { hit = list_hit(tp, 30, 26, 260, 24, 3, n); if (hit >= 0) listSel = hit; }
              if (listKind == LK_DUEL && listSel < NOPP) style_opp(&F[1], listSel);
              if (kD & KEY_B) menu_enter();
              else if ((kD & KEY_A) || hit >= 0) list_action(listKind, listSel);
            } else if (scene == SC_ACTS) {
              update_demo();
              n = acts_count();
              actsSel = nav(actsSel, n, kD);
              if (touch) { hit = list_hit(tp, 20, 30, 280, 28, 4, n); if (hit >= 0) actsSel = hit; }
              if (kD & KEY_B) menu_enter();
              else if ((kD & KEY_A) || hit >= 0) {
                if (actsSel == NACT) { eclipse = !eclipse; sfx(SFX_SEL); }
                else if (actsSel < sv.actsUnlocked) { sfx(SFX_SEL); open_storytxt(actsSel); }
                else { sfx(SFX_ERR); toast(tr("Finish the previous act first", "Termine o ato anterior primeiro")); }
              }
            } else if (scene == SC_STORYTXT) {
              update_demo();
              if (kD & KEY_B) menu_enter();
              else if ((kD & KEY_A) || touch) {
                sfx(SFX_SEL);
                if (txtKind == 0) start_run(RK_STORY, txtAct); else menu_enter();
              }
            } else if (scene == SC_SET) {
              update_demo();
              setSel = nav(setSel, 12, kD);
              if (setSel != 10) eraseArm = 0;
              scroll_fix(setSel, &setTop, 7);
              if (kD & KEY_DLEFT) { change_setting(setSel, -1); sfx(SFX_MOVE); }
              if (kD & KEY_DRIGHT) { change_setting(setSel, 1); sfx(SFX_MOVE); }
              if (touch) { hit = slist_hit(tp, 20, 28, 270, 24, 3, setTop, 7, 12); if (hit >= 0) setSel = hit; }
              if ((kD & KEY_A) || hit >= 0) {
                sfx(SFX_SEL);
                if (setSel == 11) menu_enter();
                else if (setSel == 1) { scene = SC_CTRL; ctrlSel = 0; ctrlTop = 0; }
                else if (setSel == 9) {
                  char b[72];
                  int c = export_template();
                  if (c < 0) snprintf(b, sizeof b, "%s", tr("Could not write the file", "Não foi possível gravar"));
                  else snprintf(b, sizeof b, "%s (%d)", tr("Template saved to /3ds/ShadowDuel/lang", "Modelo salvo em /3ds/ShadowDuel/lang"), c);
                  toast(b);
                } else if (setSel == 10) {
                  if (!eraseArm) eraseArm = 1;
                  else { sv_defaults(); save_game(); eraseArm = 0; eclipse = 0; toast(tr("Save data erased", "Progresso apagado")); }
                } else change_setting(setSel, 1);
              }
              if (kD & KEY_B) menu_enter();
            } else if (scene == SC_CTRL) {
              update_demo();
              ctrlSel = nav(ctrlSel, 10, kD);
              scroll_fix(ctrlSel, &ctrlTop, 7);
              if ((kD & KEY_DLEFT) && ctrlSel < NAC) { sv.keymap[ctrlSel] = (sv.keymap[ctrlSel] + 6) % 7; sfx(SFX_MOVE); }
              if ((kD & KEY_DRIGHT) && ctrlSel < NAC) { sv.keymap[ctrlSel] = (sv.keymap[ctrlSel] + 1) % 7; sfx(SFX_MOVE); }
              if (touch) { hit = slist_hit(tp, 20, 28, 270, 24, 3, ctrlTop, 7, 10); if (hit >= 0) ctrlSel = hit; }
              if ((kD & KEY_A) || hit >= 0) {
                sfx(SFX_SEL);
                if (ctrlSel == 9) { scene = SC_SET; }
                else if (ctrlSel == 8) { ctrl_defaults(); toast(tr("Controls restored", "Controles restaurados")); }
                else sv.keymap[ctrlSel] = (sv.keymap[ctrlSel] + 1) % 7;
              }
              if (kD & KEY_B) scene = SC_SET;
            } else if (scene == SC_HOW) {
              update_demo();
              if (kD & (KEY_DRIGHT | KEY_DLEFT | KEY_DDOWN | KEY_DUP)) { howPage = (howPage + 1) % 4; sfx(SFX_MOVE); }
              if (touch && tp.py < 196) { howPage = (howPage + 1) % 4; sfx(SFX_MOVE); }
              if ((kD & (KEY_A | KEY_B)) || (touch && tp.py >= 196)) menu_enter();
            } else if (scene == SC_ACH) {
              update_demo();
              achSel = nav(achSel, NACH, kD);
              scroll_fix(achSel, &achTop, 7);
              if (touch) { hit = slist_hit(tp, 20, 28, 270, 24, 3, achTop, 7, NACH); if (hit >= 0) achSel = hit; }
              if (kD & (KEY_B | KEY_A)) menu_enter();
            } else if (scene == SC_SHOP) {
              int pv[5], tt = tab_total();
              update_demo();
              if (kD & (KEY_DRIGHT | KEY_R)) { shopTab = (shopTab + 1) % tt; shopSel = 0; shopTop = 0; sfx(SFX_MOVE); }
              if (kD & (KEY_DLEFT | KEY_L)) { shopTab = (shopTab + tt - 1) % tt; shopSel = 0; shopTop = 0; sfx(SFX_MOVE); }
              shop_build();
              shopSel = nav(shopSel, shopN > 0 ? shopN : 1, kD);
              scroll_fix(shopSel, &shopTop, 6);
              if (touch) {
                float tw = 304.0f / tt;
                for (i = 0; i < tt; i++)
                  if (tp.px >= 8 + i * tw && tp.px <= 8 + (i + 1) * tw - 2 && tp.py >= 26 && tp.py <= 46) { shopTab = i; shopSel = 0; shopTop = 0; shop_build(); sfx(SFX_MOVE); }
                hit = slist_hit(tp, 8, 52, 284, 22, 3, shopTop, 6, shopN);
                if (hit >= 0) { if (hit != shopSel) sfx(SFX_MOVE); shopSel = hit; }
                if (tp.px >= 200 && tp.px <= 312 && tp.py >= 208 && tp.py <= 234) { item_action(); shop_build(); }
              }
              if (kD & KEY_A) { item_action(); shop_build(); }
              if (kD & KEY_B) menu_enter();
              pv[0] = sv.wEq; pv[1] = sv.rEq; pv[2] = sv.aEq; pv[3] = sv.hEq; pv[4] = sv.mEq;
              if (shopTab < 5 && shopN > 0) pv[shopTab] = shopIdx[shopSel];
              apply_loadout_ex(&F[0], pv[0], pv[1], pv[2], pv[3], pv[4]);
            } else if (scene == SC_FIGHT) {
              if (paused) {
                int pn = (mode == M_TRAINING) ? 5 : 3;
                pauseSel = nav(pauseSel, pn, kD);
                if (touch) { hit = list_hit(tp, 30, 52, 260, 28, 6, pn); if (hit >= 0) pauseSel = hit; }
                if ((kD & (KEY_B | KEY_START))) paused = 0;
                else if ((kD & KEY_A) || hit >= 0) {
                  sfx(SFX_SEL);
                  if (pauseSel == 0) paused = 0;
                  else if (pauseSel == 1) { if (infinite_kind()) start_run(runKind, runArg); else start_step(); }
                  else if (pauseSel == 2) menu_enter();
                  else if (pauseSel == 3) trainDummy = (trainDummy + 1) % 3;
                  else trainInf = !trainInf;
                }
                return;
              }
              if ((kD & KEY_START) || (touch && tp.px >= 236 && tp.py >= 196)) { paused = 1; pauseSel = 0; return; }
              update_fight(kD, kH, cp);
            } else if (scene == SC_RESULT) {
              update_demo();
              resSel = nav(resSel, resN, kD);
              if (touch) { hit = list_hit(tp, 30, 124, 260, 30, 6, resN); if (hit >= 0) resSel = hit; }
              if ((kD & KEY_A) || hit >= 0) {
                sfx(SFX_SEL);
                switch (resAct[resSel]) {
                  case RA_NEXT: runIdx++; start_step(); break;
                  case RA_NEXTACT: storyAct++; open_storytxt(storyAct); break;
                  case RA_ENDING: txtKind = 1; scene = SC_STORYTXT; demo_init(); music_play(0, 0); break;
                  case RA_RETRY: start_step(); break;
                  case RA_AGAIN: start_run(runKind, runArg); break;
                  case RA_SHOP: shop_enter(0); break;
                  default: menu_enter(); break;
                }
              }
            }
          }

          /* --------------------------------------------------------- scenes: draw */
          static void run_info(char *b, int n) {
            static const char *TN_EN[3] = {"Bronze cup", "Silver cup", "Gold cup"};
            static const char *TN_PT[3] = {"Copa de Bronze", "Copa de Prata", "Copa de Ouro"};
            switch (runKind) {
              case RK_STORY: snprintf(b, n, "%s %d: %s - %s %d/3%s", tr("Act", "Ato"), storyAct + 1, act_name(storyAct), tr("Fight", "Luta"), runIdx + 1, eclipse ? " [Eclipse]" : ""); break;
              case RK_TOURN: snprintf(b, n, "%s - %s %d/6", tr(TN_EN[runArg], TN_PT[runArg]), tr("Fight", "Luta"), runIdx + 1); break;
              case RK_BOSSRUSH: snprintf(b, n, "%s %d/7", tr("Boss rush", "Corrida de chefes"), runIdx + 1); break;
              case RK_BODY: snprintf(b, n, "%s %d/4", tr("Bodyguards", "Guarda-costas"), runIdx + 1); break;
              case RK_CHALL: snprintf(b, n, "%s", tr(CHALLS[runArg].en, CHALLS[runArg].pt)); break;
              case RK_ASC: snprintf(b, n, "%s %d", tr("Ascension - floor", "Ascensão - andar"), runIdx + 1); break;
              case RK_SURV: snprintf(b, n, "%s: %d", tr("Fights won", "Lutas vencidas"), runWins); break;
              case RK_ENDLESS: snprintf(b, n, "%s %d", tr("Endless - fight", "Sem fim - luta"), runIdx + 1); break;
              case RK_DUEL: snprintf(b, n, "%s", tr("Duel", "Duelo")); break;
              default: snprintf(b, n, "%s", tr("Dojo", "Dojo")); break;
            }
          }

          static void draw_xpbar(float x, float y, float w) {
            char b[40];
            float frac = sv.level >= MAXLVL ? 1.0f : (float)sv.xp / (float)xp_need(sv.level);
            draw_bar(x, y, w, 6, frac, C(120, 200, 255, 255), 0);
            snprintf(b, sizeof b, "Lv %d", sv.level);
            text(x, y - 16, 0.45f, C(255, 255, 255, 255), b);
          }

