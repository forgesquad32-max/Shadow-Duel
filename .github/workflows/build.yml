# ============================================================
# SHADOW DUEL v2 - 3DS (Old 3DS / New 3DS)
# Arquivo unico: o jogo inteiro (codigo, icone, banner) esta aqui dentro.
#
# Como usar:
#   1. No GitHub, crie um repositorio novo.
#   2. Salve este arquivo como  .github/workflows/build.yml
#   3. Abra a aba Actions, escolha "Build Shadow Duel (3DS)" e clique em Run workflow
#      (ou faca qualquer commit/push).
#   4. Quando terminar, baixe o artefato "ShadowDuel-3DS":
#        shadowduel.cia   -> instale com o FBI
#        shadowduel.3dsx  -> coloque em sdmc:/3ds/ e abra pelo Homebrew Launcher
#
# Novidades da v2: musica e efeitos sonoros, save no cartao SD
# (sdmc:/3ds/ShadowDuel/save.bin), moedas e gemas, loja (espadas, armaduras,
# equipamentos, habilidades) e historia em 5 atos.
# AUDIO: o 3DS so toca som se existir o arquivo sdmc:/3ds/dspfirm.cdc
# (dump do firmware DSP, feito com o app DSP1). Sem ele o jogo roda mudo.
# ============================================================
name: Build Shadow Duel (3DS)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Install tools
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          export DEVKITARM=${DEVKITARM:-$DEVKITPRO/devkitARM}
          export PATH=$PATH:$DEVKITPRO/tools/bin:$DEVKITARM/bin:/usr/local/bin
          apt-get update
          apt-get install -y wget unzip
          if [ ! -f "$DEVKITPRO/libctru/include/citro2d.h" ]; then dkp-pacman -Syu --noconfirm 3ds-dev; fi
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18/makerom-v0.18-ubuntu_x86_64.zip
          unzip -o makerom-v0.18-ubuntu_x86_64.zip makerom -d /usr/local/bin
          wget -q https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -o -j bannertool.zip "linux-x86_64/bannertool" -d /usr/local/bin
          chmod +x /usr/local/bin/makerom /usr/local/bin/bannertool

      - name: Write project files
        run: |
          mkdir -p source build
          cat > source/main.c <<'SDEOF'
          #include <3ds.h>
          #include <citro2d.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <math.h>
          #include <time.h>
          #include <sys/stat.h>

          #ifndef SD_ROOT
          #define SD_ROOT "sdmc:"
          #endif

          #define PI_F 3.14159265f
          #define TAU_F 6.2831853f
          #define GROUND 188.0f
          #define ARENA_L 22.0f
          #define ARENA_R 378.0f
          #define PUNCH_TOTAL 16
          #define PUNCH_A0 4
          #define PUNCH_A1 8
          #define KICK_TOTAL 25
          #define KICK_A0 7
          #define KICK_A1 13
          #define SPEC_TOTAL 40
          #define SPEC_FIRE 14
          #define SR 22050
          #define ABUF 2048
          #define NOPP 7
          #define NACT 5
          #define NSW 6
          #define NAR 6
          #define NGE 6
          #define NSP 4
          #define NPASS 5
          #define SAVE_MAGIC 0x53445532u
          #define SAVE_VER 2

          enum { ST_IDLE, ST_WALK, ST_JUMP, ST_PUNCH, ST_KICK, ST_SPECIAL, ST_BLOCK, ST_HURT, ST_KO, ST_WIN };
          enum { SC_MENU, SC_PICK, SC_SET, SC_HOW, SC_FIGHT, SC_RESULT, SC_ACTS, SC_STORYTXT, SC_SHOP };
          enum { M_STORY, M_SURVIVAL, M_FREE, M_TRAINING };
          enum { FS_INTRO, FS_FIGHT, FS_KO };
          enum { RA_NEXT, RA_NEXTACT, RA_ENDING, RA_RETRY, RA_AGAIN, RA_SHOP, RA_MENU };
          enum { SFX_PUNCH, SFX_KICK, SFX_HIT, SFX_BLOCK, SFX_BOLT, SFX_KO, SFX_COIN, SFX_SEL, SFX_MOVE, SFX_ERR,
                 SFX_WIN, SFX_LOSE, SFX_JUMP, SFX_HEAL, SFX_QUAKE, NSND };

          typedef struct { int left, right, jump, punch, kick, block, special, dash; } Inp;

          typedef struct {
            float x, y, vx, vy, rot, energy, scale;
            float dmgMul, defMul, reachAdd, spdMul, enMul, crit, regen, spPow, hpAcc;
            int dir, hp, maxhp, st, t, hitDone, onGround, dashCd, dashT, dashDir, hurtT, comboN, comboT, acc;
            int aiAct, aiActT, aiCool, aiBlockT, rushT, spKind, spCost;
            int ar, ag, ab, bladeLen, blr, blg, blb, armorOn, amr, amg, amb;
          } Fighter;

          typedef struct { int active, owner; float x, y, vx; } Proj;
          typedef struct { float x, y, vx, vy, r; int life, cr, cg, cb; } Part;
          typedef struct { const char *name, *ten, *tpt; int hp; float aggr, block, scale; int acc, r, g, b; } Opp;
          typedef struct { int opp, hp, aggr, coins, gems; } Fight;
          typedef struct { const char *en, *pt; int coins, gems, dmg, reach, len, r, g, b; } SwordDef;
          typedef struct { const char *en, *pt; int coins, gems, hp, def, r, g, b; } ArmorDef;
          typedef struct { const char *en, *pt; int coins, gems, kind, val; } GearDef;
          typedef struct { const char *en, *pt, *den, *dpt; int coins, gems, cost; } SpecDef;
          typedef struct { const char *en, *pt, *den, *dpt; int base; } PassDef;
          typedef struct { s16 *d; int n; } Snd;

          typedef struct {
            u32 magic;
            int version;
            int coins, gems, actsUnlocked, curAct, curFight, clearedMask;
            int swordOwn, armorOwn, gearOwn, specOwn;
            int swordEq, armorEq, gearEq, specEq;
            int passLv[NPASS];
            int wins, losses, bestSurv, bestCombo;
            int diff, rounds, timeIdx, shake, box, lang, music, sfx;
            int chk;
          } Save;

          static const Opp OPP[NOPP] = {
            {"Wisp", "Shadow apprentice", "Aprendiz das sombras", 80, 0.30f, 0.05f, 0.92f, 16, 90, 200, 255},
            {"Ronin", "Wandering blade", "Lâmina errante", 92, 0.38f, 0.08f, 1.00f, 5, 255, 170, 60},
            {"Monk", "Silent guardian", "Guardião silencioso", 100, 0.34f, 0.20f, 1.00f, 16, 120, 255, 150},
            {"Reaper", "Soul collector", "Coletor de almas", 105, 0.46f, 0.12f, 1.04f, 2, 190, 100, 255},
            {"Warlord", "Iron tyrant", "Tirano de ferro", 125, 0.50f, 0.16f, 1.12f, 6, 255, 100, 60},
            {"Phantom", "Faster than light", "Mais rápido que a luz", 110, 0.62f, 0.22f, 1.00f, 17, 240, 240, 255},
            {"Shadow Lord", "The final duel", "O duelo final", 150, 0.70f, 0.26f, 1.15f, 10, 255, 50, 80}
          };

          static const Fight FIGHTS[NACT][3] = {
            {{0, 90, 0, 40, 0}, {1, 95, 0, 50, 0}, {2, 105, 0, 80, 1}},
            {{3, 95, 4, 60, 0}, {1, 115, 6, 70, 0}, {4, 100, 0, 110, 2}},
            {{2, 120, 6, 80, 0}, {5, 95, 4, 90, 0}, {4, 125, 6, 140, 2}},
            {{5, 115, 6, 100, 0}, {3, 130, 6, 110, 0}, {5, 135, 8, 170, 3}},
            {{4, 140, 8, 130, 0}, {5, 140, 10, 150, 0}, {6, 100, 0, 300, 5}}
          };

          static const char *ACT_EN[NACT] = {"Rebirth of the Hero", "Echoes of the Fallen", "The Iron Road", "Night of Phantoms", "The Shadow Throne"};
          static const char *ACT_PT[NACT] = {"Renascimento do Herói", "Ecos dos Caídos", "A Estrada de Ferro", "Noite dos Fantasmas", "O Trono das Sombras"};
          static const char *ACT_TXT_EN[NACT][3] = {
            {"The hero wakes in the ashes of a burned shrine.", "His memory is gone. Only a faint shadow answers.", "Defeat the wanderers to remember who you were."},
            {"Whispers rise from the old battlefield.", "Every fallen warrior wants to test your blade.", "Prove your strength before the dusk."},
            {"A road paved with armor and broken swords.", "The warlords guard the pass to the mountain.", "Break their line and keep moving."},
            {"The moon vanishes and the shadows grow fast.", "Phantoms strike from every direction.", "Stay calm, block and counter."},
            {"At the summit waits the one who stole your past.", "The Shadow Lord rules with an iron will.", "End this duel and take back your name."}
          };
          static const char *ACT_TXT_PT[NACT][3] = {
            {"O herói desperta nas cinzas de um santuário queimado.", "Sua memória sumiu. Só uma sombra fraca responde.", "Derrote os errantes para lembrar quem você foi."},
            {"Sussurros sobem do velho campo de batalha.", "Cada guerreiro caído quer testar sua lâmina.", "Prove sua força antes do anoitecer."},
            {"Uma estrada de armaduras e espadas quebradas.", "Os senhores da guerra guardam a passagem.", "Quebre a linha deles e siga em frente."},
            {"A lua desaparece e as sombras crescem rápido.", "Fantasmas atacam de todos os lados.", "Mantenha a calma, bloqueie e contra-ataque."},
            {"No topo espera quem roubou o seu passado.", "O Senhor das Sombras governa com vontade de ferro.", "Termine este duelo e recupere seu nome."}
          };
          static const char *END_EN[3] = {"The Shadow Lord falls and the memories return.", "The hero remembers his name and his purpose.", "The shadows are quiet. For now."};
          static const char *END_PT[3] = {"O Senhor das Sombras cai e as memórias voltam.", "O herói lembra do seu nome e do seu propósito.", "As sombras estão quietas. Por enquanto."};

          static const SwordDef SWORDS[NSW] = {
            {"Bare hands", "Mãos nuas", 0, 0, 0, 0, 0, 0, 0, 0},
            {"Iron blade", "Lâmina de ferro", 150, 0, 8, 4, 26, 190, 195, 210},
            {"Steel katana", "Katana de aço", 400, 0, 16, 7, 32, 210, 230, 255},
            {"Crimson fang", "Presa carmesim", 900, 0, 25, 9, 34, 255, 80, 90},
            {"Moonlit saber", "Sabre lunar", 0, 12, 35, 11, 36, 150, 200, 255},
            {"Void reaper", "Ceifador do vazio", 0, 28, 50, 14, 40, 190, 90, 255}
          };
          static const ArmorDef ARMORS[NAR] = {
            {"Cloth rags", "Trapos", 0, 0, 0, 0, 0, 0, 0},
            {"Leather vest", "Colete de couro", 120, 0, 15, 5, 140, 95, 60},
            {"Chainmail", "Cota de malha", 320, 0, 30, 10, 170, 175, 190},
            {"Shadow plate", "Placa sombria", 750, 0, 45, 16, 110, 70, 170},
            {"Dragon scale", "Escama de dragão", 0, 14, 65, 22, 60, 190, 120},
            {"Eclipse armor", "Armadura do eclipse", 0, 30, 90, 30, 255, 190, 60}
          };
          static const GearDef GEARS[NGE] = {
            {"None", "Nenhum", 0, 0, 0, 0},
            {"Swift boots", "Botas velozes", 160, 0, 1, 12},
            {"Spirit charm", "Amuleto espiritual", 220, 0, 2, 25},
            {"Lucky coin", "Moeda da sorte", 260, 0, 3, 30},
            {"War gloves", "Luvas de guerra", 380, 0, 4, 12},
            {"Phoenix feather", "Pena de fênix", 0, 10, 5, 2}
          };
          static const SpecDef SPECS[NSP] = {
            {"Shadow bolt", "Raio sombrio", "Fires a bolt of shadow.", "Dispara um raio de sombra.", 0, 0, 50},
            {"Quake", "Terremoto", "Shockwave hits grounded foes.", "Onda de choque no chão.", 260, 0, 60},
            {"Shadow rush", "Investida sombria", "Dash through the enemy.", "Atravessa o inimigo.", 420, 0, 40},
            {"Soul mend", "Cura da alma", "Heals you for 22 HP.", "Cura 22 de vida.", 0, 8, 60}
          };
          static const PassDef PASS[NPASS] = {
            {"Vitality", "Vitalidade", "+6 max HP per level", "+6 de vida máx. por nível", 80},
            {"Fury", "Fúria", "+4% damage per level", "+4% de dano por nível", 100},
            {"Focus", "Foco", "+8% energy gain per level", "+8% de energia por nível", 90},
            {"Resilience", "Resistência", "-4% damage taken per level", "-4% de dano recebido", 110},
            {"Mastery", "Maestria", "+10% special power per level", "+10% de poder especial", 120}
          };

          static Save sv;
          static C2D_TextBuf gBuf;
          static float zc = 0, OX = 0, OY = 0;
          static Fighter F[2];
          static Proj projs[4];
          static Part parts[120];
          static int scene = SC_MENU, mode = M_STORY, curOpp = 0, fs = FS_INTRO, fst = 0, roundNo = 1;
          static int wins[2], needWins = 2, timerF = 0, survWins = 0, carryHp = 0, paused = 0, koWinner = -1;
          static int menuSel = 0, pickSel = 0, setSel = 0, setTop = 0, resSel = 0, pauseSel = 0, howPage = 0, actsSel = 0;
          static int shopTab = 0, shopSel = 0, shopTop = 0, eraseArm = 0;
          static int shakeT = 0, hitStop = 0, maxCombo = 0, running = 1, matchWon = 0, gframe = 0;
          static int bufP = 0, bufK = 0, bufS = 0, bufJ = 0, bufD = 0;
          static int resN = 2, resAct[3];
          static const char *resLabels[3];
          static int storyAct = 0, storyFight = 0, curHpPct = 100, curAggrAdd = 0, txtAct = 0, txtKind = 0;
          static int rewCoins = 0, rewGems = 0, actDone = 0, toastT = 0, audioOk = 0, firstFight = 0;
          static char toastBuf[64];
          static float shakeA = 0;
          static const int timeVals[3] = {30, 60, 99};

          #define setDiff (sv.diff)
          #define setRounds (sv.rounds)
          #define setTimeIdx (sv.timeIdx)
          #define setShake (sv.shake)
          #define setBox (sv.box)

          static const char *tr(const char *en, const char *pt) { return sv.lang ? pt : en; }
          static float nz(void) { zc += 0.00004f; return zc; }
          static u32 C(int r, int g, int b, int a) { return C2D_Color32(r, g, b, a); }
          static float frand(void) { return (rand() & 0x7fff) / 32767.0f; }
          static float clampf(float v, float a, float b) { return v < a ? a : (v > b ? b : v); }
          static int clampi(int v, int a, int b) { return v < a ? a : (v > b ? b : v); }

          static void rect(float x, float y, float w, float h, u32 c) { C2D_DrawRectSolid(x + OX, y + OY, nz(), w, h, c); }
          static void circ(float x, float y, float r, u32 c) { C2D_DrawCircleSolid(x + OX, y + OY, nz(), r, c); }
          static void line(float x0, float y0, float x1, float y1, float th, u32 c) {
            C2D_DrawLine(x0 + OX, y0 + OY, c, x1 + OX, y1 + OY, c, th, nz());
          }
          static void tri(float x0, float y0, float x1, float y1, float x2, float y2, u32 c) {
            C2D_DrawTriangle(x0 + OX, y0 + OY, c, x1 + OX, y1 + OY, c, x2 + OX, y2 + OY, c, nz());
          }
          static void text(float x, float y, float sc, u32 col, const char *s) {
            C2D_Text t;
            C2D_TextParse(&t, gBuf, s);
            C2D_TextOptimize(&t);
            C2D_DrawText(&t, C2D_WithColor, x + OX, y + OY, nz(), sc, sc, col);
          }
          static float textw(const char *s, float sc) {
            C2D_Text t;
            float w = 0, h = 0;
            C2D_TextParse(&t, gBuf, s);
            C2D_TextGetDimensions(&t, sc, sc, &w, &h);
            return w;
          }
          static void textc(float cx, float y, float sc, u32 col, const char *s) {
            text(cx - textw(s, sc) * 0.5f, y, sc, col, s);
          }
          static void texts(float cx, float y, float sc, u32 col, const char *s) {
            textc(cx + 1.5f, y + 1.5f, sc, C(0, 0, 0, 200), s);
            textc(cx, y, sc, col, s);
          }
          static void coin_icon(float x, float y, float r) {
            circ(x, y, r, C(255, 200, 60, 255));
            circ(x, y, r * 0.62f, C(200, 140, 20, 255));
            circ(x, y, r * 0.38f, C(255, 225, 120, 255));
          }
          static void gem_icon(float x, float y, float r) {
            tri(x - r, y - r * 0.2f, x + r, y - r * 0.2f, x, y - r, C(150, 240, 255, 255));
            tri(x - r, y - r * 0.2f, x + r, y - r * 0.2f, x, y + r, C(60, 170, 235, 255));
            tri(x - r * 0.4f, y - r * 0.2f, x + r * 0.4f, y - r * 0.2f, x, y + r * 0.7f, C(200, 250, 255, 255));
          }

          /* ---------------------------------------------------------------- audio */
          static const int SC_HIRA[5] = {0, 2, 3, 7, 8};
          static const int SC_MINP[5] = {0, 3, 5, 7, 10};
          static const int SC_INSEN[5] = {0, 1, 5, 7, 10};
          static const int SC_PHRY[7] = {0, 1, 3, 5, 7, 8, 10};
          static const int *SC_TAB[4] = {SC_HIRA, SC_MINP, SC_INSEN, SC_PHRY};
          static const int SC_NUM[4] = {5, 5, 5, 7};
          static const float T_BPM[7] = {84, 108, 116, 124, 132, 142, 78};
          static const int T_ROOT[7] = {50, 45, 47, 43, 48, 41, 53};
          static const int T_SCALE[7] = {0, 1, 0, 2, 3, 3, 1};

          static int mTrack = -1, mInten = 0, mStep = 0, mNs = 5, mRoot = 45, mDrums = 0, mArp = 0, mProg[4];
          static const int *mScale = SC_HIRA;
          static float mSub = 0, mBpm = 100;
          static int bassP[64], leadP[64];
          static float bPh, lPh, aPh, kPh, bF = 110, lF = 440, aF = 440, bE, lE, aE, kE, kF, sE, hE, lp1, hpPrev;
          static unsigned nsd = 12345u, gsd = 1u;
          static ndspWaveBuf mwb[3], swb[4];
          static s16 *mbuf[3];
          static Snd snd[NSND];

          static float nrand(void) { nsd = nsd * 1664525u + 1013904223u; return ((nsd >> 8) & 0xffff) / 32768.0f - 1.0f; }
          static unsigned lcg(unsigned *s) { *s = *s * 1664525u + 1013904223u; return *s >> 16; }
          static float mfreq(int m) { return 440.0f * powf(2.0f, (m - 69) / 12.0f); }
          static int dmidi(int base, int deg) { return base + mScale[deg % mNs] + 12 * (deg / mNs); }
          static s16 f2s(float v) { if (v > 1.0f) v = 1.0f; if (v < -1.0f) v = -1.0f; return (s16)(v * 30000.0f); }

          static void gen_track(int t, int inten) {
            unsigned s = 1234u + (unsigned)t * 977u;
            int sc = T_SCALE[t], b, st, i, calm = (t == 0 || t == 6);
            int A[16], B[16], d;
            mScale = SC_TAB[sc]; mNs = SC_NUM[sc]; mRoot = T_ROOT[t]; mBpm = T_BPM[t] + (inten ? 10.0f : 0.0f);
            mProg[0] = 0; mProg[1] = 1 + (int)(lcg(&s) % (unsigned)(mNs - 1)); mProg[2] = (int)(lcg(&s) % (unsigned)mNs);
            mProg[3] = 1 + (int)(lcg(&s) % (unsigned)(mNs - 1));
            d = mNs + (int)(lcg(&s) % (unsigned)mNs);
            for (i = 0; i < 16; i++) {
              int delta[5] = {-2, -1, 0, 1, 2};
              if (i != 0 && (int)(lcg(&s) % 100u) < (calm ? 55 : 35)) { A[i] = -1; continue; }
              d = clampi(d + delta[lcg(&s) % 5u], mNs - 1, mNs * 2 + 1);
              A[i] = d;
            }
            for (i = 0; i < 16; i++) {
              int delta[5] = {-2, -1, 0, 1, 2};
              if (i != 0 && (int)(lcg(&s) % 100u) < (calm ? 55 : 35)) { B[i] = -1; continue; }
              d = clampi(d + delta[lcg(&s) % 5u], mNs - 1, mNs * 2 + 1);
              B[i] = d;
            }
            for (b = 0; b < 4; b++) {
              for (st = 0; st < 16; st++) {
                int hit = calm ? (st == 0 || st == 8) : (st == 0 || st == 3 || st == 6 || st == 8 || st == 11 || st == 14);
                bassP[b * 16 + st] = hit ? mProg[b] : -1;
                leadP[b * 16 + st] = (b == 2) ? B[st] : ((b == 3 && st >= 12) ? B[st] : A[st]);
              }
            }
            mDrums = !calm; mArp = (t >= 2 && t != 6) || inten;
          }

          static void music_play(int t, int inten) {
            if (t == mTrack && inten == mInten) return;
            mTrack = t; mInten = inten;
            mStep = 63; mSub = 0; bE = lE = aE = kE = sE = hE = 0; bPh = lPh = aPh = kPh = 0; lp1 = 0;
            if (t >= 0) gen_track(t, inten);
          }

          static void music_fill(s16 *out, int n) {
            int i;
            float stepLen;
            if (mTrack < 0 || !sv.music) { memset(out, 0, (size_t)n * 2); return; }
            stepLen = SR * 60.0f / mBpm / 4.0f;
            for (i = 0; i < n; i++) {
              float bs, ls, as = 0, ks = 0, rn, m;
              if (mSub <= 0.0f) {
                int st;
                mStep = (mStep + 1) & 63; mSub += stepLen; st = mStep & 15;
                if (bassP[mStep] >= 0) { bF = mfreq(dmidi(mRoot - 12, bassP[mStep])); bE = 1.0f; }
                if (leadP[mStep] >= 0) { lF = mfreq(dmidi(mRoot + 12, leadP[mStep])); lE = 1.0f; }
                if (mArp) {
                  static const int ao[4] = {0, 2, 4, 2};
                  aF = mfreq(dmidi(mRoot + 24, mProg[mStep >> 4] + ao[st & 3])); aE = 1.0f;
                }
                if (mDrums) {
                  if (st == 0 || st == 8 || (mBpm > 120.0f && (st == 6 || st == 14))) kE = 1.0f;
                  if (st == 4 || st == 12) sE = 1.0f;
                  if ((st & 1) == 0 || mInten) hE = 1.0f;
                }
              }
              mSub -= 1.0f;
              bs = (4.0f * fabsf(bPh - 0.5f) - 1.0f) * bE * 0.30f;
              ls = (lPh < 0.32f) ? 1.0f : -1.0f;
              lp1 += 0.28f * (ls - lp1);
              ls = lp1 * lE * 0.16f;
              if (mArp && aE > 0.003f) as = sinf(TAU_F * aPh) * aE * 0.07f;
              if (kE > 0.003f) { kF = 42.0f + 110.0f * kE * kE; ks = sinf(TAU_F * kPh) * kE * 0.55f; kPh += kF / SR; if (kPh >= 1.0f) kPh -= 1.0f; }
              rn = nrand();
              m = (bs + ls + as + ks + rn * sE * 0.20f + (rn - hpPrev) * hE * 0.10f) * 0.8f;
              hpPrev = rn;
              out[i] = f2s(m);
              bPh += bF / SR; if (bPh >= 1.0f) bPh -= 1.0f;
              lPh += lF / SR; if (lPh >= 1.0f) lPh -= 1.0f;
              aPh += aF / SR; if (aPh >= 1.0f) aPh -= 1.0f;
              bE *= 0.99975f; lE *= 0.99985f; aE *= 0.9996f; kE *= 0.9994f; sE *= 0.9993f; hE *= 0.9985f;
            }
          }

          static s16 *alloc_snd(int id, int n) {
            snd[id].d = (s16 *)linearAlloc((size_t)n * 2);
            snd[id].n = snd[id].d ? n : 0;
            return snd[id].d;
          }

          #define GEN(id, dur, expr) { int n_ = (int)(SR * (dur)); s16 *d_ = alloc_snd(id, n_); int i_; if (d_) for (i_ = 0; i_ < n_; i_++) { float t = (float)i_ / SR; d_[i_] = f2s(expr); } }

          static float jingle(float t, const float *nf, float len) {
            int k = (int)(t / len);
            float lt;
            if (k > 3) k = 3;
            lt = t - k * len;
            return 0.35f * sinf(TAU_F * nf[k] * t) * expf(-lt * 3.0f) * (t < 1.0f ? 1.0f : 0.0f);
          }

          static void gen_all(void) {
            static const float wn[4] = {392.0f, 494.0f, 587.0f, 784.0f};
            static const float ln[4] = {392.0f, 349.0f, 330.0f, 262.0f};
            static const float hn[4] = {523.0f, 659.0f, 784.0f, 1047.0f};
            GEN(SFX_PUNCH, 0.12, 0.6f * nrand() * expf(-t * 35.0f) + 0.6f * sinf(TAU_F * 130.0f * t) * expf(-t * 28.0f));
            GEN(SFX_KICK, 0.16, 0.5f * nrand() * expf(-t * 22.0f) + 0.8f * sinf(TAU_F * (60.0f + 40.0f * expf(-t * 20.0f)) * t) * expf(-t * 16.0f));
            GEN(SFX_HIT, 0.18, 0.8f * nrand() * expf(-t * 18.0f) + 0.7f * sinf(TAU_F * (80.0f + 120.0f * expf(-t * 25.0f)) * t) * expf(-t * 12.0f));
            GEN(SFX_BLOCK, 0.15, 0.45f * (sinf(TAU_F * 900.0f * t) + 0.6f * sinf(TAU_F * 1350.0f * t)) * expf(-t * 24.0f));
            GEN(SFX_BOLT, 0.35, 0.5f * sinf(TAU_F * (300.0f + 600.0f * t / 0.35f) * t) * (1.0f - t / 0.35f) * (0.7f + 0.3f * sinf(TAU_F * 30.0f * t)));
            GEN(SFX_KO, 0.7, 0.7f * sinf(TAU_F * (220.0f - 170.0f * t / 0.7f) * t) * (1.0f - t / 0.7f) + 0.5f * nrand() * expf(-t * 14.0f));
            GEN(SFX_COIN, 0.25, 0.3f * ((sinf(TAU_F * (t < 0.08f ? 988.0f : 1319.0f) * t) > 0.0f) ? 1.0f : -1.0f) * expf(-(t < 0.08f ? t : t - 0.08f) * 10.0f));
            GEN(SFX_SEL, 0.1, 0.4f * sinf(TAU_F * (660.0f + 220.0f * t / 0.1f) * t) * (1.0f - t / 0.1f));
            GEN(SFX_MOVE, 0.04, 0.3f * sinf(TAU_F * 440.0f * t) * (1.0f - t / 0.04f));
            GEN(SFX_ERR, 0.2, 0.3f * ((sinf(TAU_F * 110.0f * t) > 0.0f) ? 1.0f : -1.0f) * (1.0f - t / 0.2f));
            GEN(SFX_WIN, 1.0, jingle(t, wn, 0.2f));
            GEN(SFX_LOSE, 1.0, jingle(t, ln, 0.25f));
            GEN(SFX_JUMP, 0.12, 0.35f * sinf(TAU_F * (300.0f + 300.0f * t / 0.12f) * t) * (1.0f - t / 0.12f));
            GEN(SFX_HEAL, 0.5, jingle(t * 2.0f, hn, 0.18f) * 1.1f);
            GEN(SFX_QUAKE, 0.5, 0.9f * sinf(TAU_F * 50.0f * t) * expf(-t * 7.0f) + 0.6f * nrand() * expf(-t * 9.0f));
          }

          static void sfx(int id) {
            int c;
            if (!audioOk || !sv.sfx || !snd[id].d) return;
            for (c = 0; c < 4; c++) {
              if (swb[c].status == NDSP_WBUF_DONE || swb[c].status == NDSP_WBUF_FREE) {
                swb[c].data_pcm16 = snd[id].d; swb[c].nsamples = (u32)snd[id].n; swb[c].looping = false;
                ndspChnWaveBufAdd(1 + c, &swb[c]);
                return;
              }
            }
          }

          static void audio_init(void) {
            int i;
            float mix[12];
            audioOk = 0;
            if (R_FAILED(ndspInit())) return;
            ndspSetOutputMode(NDSP_OUTPUT_STEREO);
            memset(mix, 0, sizeof mix); mix[0] = 0.8f; mix[1] = 0.8f;
            for (i = 0; i < 5; i++) {
              ndspChnReset(i);
              ndspChnSetInterp(i, NDSP_INTERP_LINEAR);
              ndspChnSetRate(i, (float)SR);
              ndspChnSetFormat(i, NDSP_FORMAT_MONO_PCM16);
              ndspChnSetMix(i, mix);
            }
            gen_all();
            memset(mwb, 0, sizeof mwb); memset(swb, 0, sizeof swb);
            for (i = 0; i < 3; i++) {
              mbuf[i] = (s16 *)linearAlloc(ABUF * 2);
              if (!mbuf[i]) return;
              music_fill(mbuf[i], ABUF);
              DSP_FlushDataCache(mbuf[i], ABUF * 2);
              mwb[i].data_pcm16 = mbuf[i]; mwb[i].nsamples = ABUF; mwb[i].looping = false;
              ndspChnWaveBufAdd(0, &mwb[i]);
            }
            for (i = 0; i < NSND; i++) if (snd[i].d) DSP_FlushDataCache(snd[i].d, (u32)snd[i].n * 2);
            audioOk = 1;
          }

          static void audio_update(void) {
            int i;
            if (!audioOk) return;
            for (i = 0; i < 3; i++) {
              if (mwb[i].status == NDSP_WBUF_DONE) {
                music_fill(mbuf[i], ABUF);
                DSP_FlushDataCache(mbuf[i], ABUF * 2);
                ndspChnWaveBufAdd(0, &mwb[i]);
              }
            }
          }

          /* ----------------------------------------------------------------- save */
          static int sv_chk(const Save *s) {
            const unsigned char *p = (const unsigned char *)s;
            unsigned h = 2166136261u;
            size_t i, n = sizeof(Save) - sizeof(int);
            for (i = 0; i < n; i++) h = (h ^ p[i]) * 16777619u;
            return (int)h;
          }

          static void sv_defaults(void) {
            int lang = sv.lang;
            memset(&sv, 0, sizeof sv);
            sv.magic = SAVE_MAGIC; sv.version = SAVE_VER;
            sv.actsUnlocked = 1; sv.swordOwn = 1; sv.armorOwn = 1; sv.gearOwn = 1; sv.specOwn = 1;
            sv.diff = 1; sv.rounds = 2; sv.timeIdx = 1; sv.shake = 1; sv.music = 1; sv.sfx = 1; sv.lang = lang;
          }

          static int save_game(void) {
            FILE *f;
            size_t w;
            mkdir(SD_ROOT "/3ds", 0777);
            mkdir(SD_ROOT "/3ds/ShadowDuel", 0777);
            sv.magic = SAVE_MAGIC; sv.version = SAVE_VER; sv.chk = sv_chk(&sv);
            f = fopen(SD_ROOT "/3ds/ShadowDuel/save.bin", "wb");
            if (!f) return 0;
            w = fwrite(&sv, sizeof sv, 1, f);
            fclose(f);
            return w == 1;
          }

          static int load_game(void) {
            FILE *f = fopen(SD_ROOT "/3ds/ShadowDuel/save.bin", "rb");
            Save t;
            size_t r;
            int i;
            if (!f) return 0;
            r = fread(&t, sizeof t, 1, f);
            fclose(f);
            if (r != 1 || t.magic != SAVE_MAGIC || t.version != SAVE_VER || t.chk != sv_chk(&t)) return 0;
            sv = t;
            sv.coins = clampi(sv.coins, 0, 999999); sv.gems = clampi(sv.gems, 0, 99999);
            sv.actsUnlocked = clampi(sv.actsUnlocked, 1, NACT); sv.curAct = clampi(sv.curAct, 0, NACT - 1);
            sv.curFight = clampi(sv.curFight, 0, 3);
            sv.swordOwn |= 1; sv.armorOwn |= 1; sv.gearOwn |= 1; sv.specOwn |= 1;
            sv.swordEq = clampi(sv.swordEq, 0, NSW - 1); sv.armorEq = clampi(sv.armorEq, 0, NAR - 1);
            sv.gearEq = clampi(sv.gearEq, 0, NGE - 1); sv.specEq = clampi(sv.specEq, 0, NSP - 1);
            if (!((sv.swordOwn >> sv.swordEq) & 1)) sv.swordEq = 0;
            if (!((sv.armorOwn >> sv.armorEq) & 1)) sv.armorEq = 0;
            if (!((sv.gearOwn >> sv.gearEq) & 1)) sv.gearEq = 0;
            if (!((sv.specOwn >> sv.specEq) & 1)) sv.specEq = 0;
            for (i = 0; i < NPASS; i++) sv.passLv[i] = clampi(sv.passLv[i], 0, 5);
            sv.diff = clampi(sv.diff, 0, 2); sv.rounds = clampi(sv.rounds, 1, 3); sv.timeIdx = clampi(sv.timeIdx, 0, 2);
            sv.shake = !!sv.shake; sv.box = !!sv.box; sv.lang = !!sv.lang; sv.music = !!sv.music; sv.sfx = !!sv.sfx;
            return 1;
          }

          static void toast(const char *s) { snprintf(toastBuf, sizeof toastBuf, "%s", s); toastT = 150; }

          /* ---------------------------------------------------------- fight logic */
          static void set_st(Fighter *f, int s) { f->st = s; f->t = 0; f->hitDone = 0; f->dashT = 0; }

          static void init_fighter(Fighter *f, float x, int dir, int maxhp) {
            memset(f, 0, sizeof(Fighter));
            f->x = x; f->y = GROUND; f->dir = dir; f->maxhp = maxhp; f->hp = maxhp;
            f->onGround = 1; f->scale = 1.0f;
            f->dmgMul = 1.0f; f->defMul = 1.0f; f->spdMul = 1.0f; f->enMul = 1.0f; f->spPow = 1.0f; f->spCost = 50;
          }

          static void apply_loadout_ex(Fighter *f, int sw, int ar, int ge, int sp) {
            const SwordDef *s = &SWORDS[sw];
            const ArmorDef *a = &ARMORS[ar];
            const GearDef *g = &GEARS[ge];
            float defm;
            f->maxhp = 100 + a->hp + sv.passLv[0] * 6; f->hp = f->maxhp;
            f->dmgMul = 1.0f + s->dmg / 100.0f + sv.passLv[1] * 0.04f;
            f->reachAdd = (float)s->reach;
            defm = (1.0f - a->def / 100.0f) * (1.0f - sv.passLv[3] * 0.04f);
            f->defMul = defm < 0.4f ? 0.4f : defm;
            f->enMul = 1.0f + sv.passLv[2] * 0.08f + (g->kind == 2 ? g->val / 100.0f : 0.0f);
            f->spdMul = 1.0f + (g->kind == 1 ? g->val / 100.0f : 0.0f);
            f->crit = (g->kind == 4) ? g->val / 100.0f : 0.0f;
            f->regen = (g->kind == 5) ? g->val * 0.01f : 0.0f;
            f->spPow = 1.0f + sv.passLv[4] * 0.10f;
            f->spKind = sp; f->spCost = SPECS[sp].cost - sv.passLv[4] * 3;
            if (f->spCost < 30) f->spCost = 30;
            f->bladeLen = s->len; f->blr = s->r; f->blg = s->g; f->blb = s->b;
            f->armorOn = ar > 0; f->amr = a->r; f->amg = a->g; f->amb = a->b;
          }
          static void apply_loadout(Fighter *f) { apply_loadout_ex(f, sv.swordEq, sv.armorEq, sv.gearEq, sv.specEq); }

          static void style_player(Fighter *f) { f->ar = 70; f->ag = 210; f->ab = 255; f->acc = 16; f->scale = 1.0f; apply_loadout(f); }
          static void style_opp(Fighter *f, int i) {
            f->ar = OPP[i].r; f->ag = OPP[i].g; f->ab = OPP[i].b; f->acc = OPP[i].acc; f->scale = OPP[i].scale;
            f->bladeLen = (OPP[i].acc & 4) ? 28 : 0; f->blr = 205; f->blg = 210; f->blb = 225;
          }

          static void spawn(float x, float y, int n, int r, int g, int b, float sp) {
            int k, i;
            for (k = 0; k < n; k++) {
              for (i = 0; i < 120; i++) {
                if (parts[i].life <= 0) {
                  float a = frand() * 2.0f * PI_F, s = sp * (0.35f + frand() * 0.65f);
                  parts[i].x = x; parts[i].y = y; parts[i].vx = cosf(a) * s; parts[i].vy = sinf(a) * s - 1.0f;
                  parts[i].life = 16 + rand() % 14; parts[i].r = 1.5f + frand() * 2.5f;
                  parts[i].cr = r; parts[i].cg = g; parts[i].cb = b;
                  break;
                }
              }
            }
          }
          static void update_parts(void) {
            int i;
            for (i = 0; i < 120; i++) {
              if (parts[i].life > 0) {
                parts[i].x += parts[i].vx; parts[i].y += parts[i].vy; parts[i].vy += 0.15f; parts[i].life--;
              }
            }
          }

          static int atk_params(const Fighter *f, float *reach, float *y0, float *y1, int *a0, int *a1, int *dmg, float *kb, int *stun) {
            if (f->st == ST_PUNCH) {
              *reach = 40.0f + f->reachAdd; *y0 = 38; *y1 = 66; *a0 = PUNCH_A0; *a1 = PUNCH_A1; *dmg = 5; *kb = 3.0f; *stun = 11; return 1;
            }
            if (f->st == ST_KICK) {
              *reach = 54; *y0 = 4; *y1 = 46; *a0 = KICK_A0; *a1 = KICK_A1; *dmg = 9; *kb = 5.0f; *stun = 19; return 1;
            }
            return 0;
          }

          static int overlap(const Fighter *a, const Fighter *d, float reach, float y0, float y1) {
            float s = a->scale;
            float ax0 = a->x + a->dir * 6.0f, ax1 = a->x + a->dir * reach * s;
            float lo = fminf(ax0, ax1), hi = fmaxf(ax0, ax1);
            float dx0 = d->x - 11.0f * d->scale, dx1 = d->x + 11.0f * d->scale;
            float ay0 = a->y - y1 * s, ay1 = a->y - y0 * s;
            float dy0 = d->y - 72.0f * d->scale, dy1 = d->y;
            if (hi < dx0 || lo > dx1) return 0;
            if (ay1 < dy0 || ay0 > dy1) return 0;
            return 1;
          }

          static void do_hit(Fighter *a, Fighter *d, int dir, int dmg, float kb, int stun, int spec) {
            int blocked = (d->st == ST_BLOCK && d->dir == -dir);
            int crit = (!spec && a->crit > 0.0f && frand() < a->crit);
            float sx = d->x - dir * 6.0f, sy = d->y - (spec ? 44.0f : 48.0f) * d->scale;
            float dm = dmg * a->dmgMul * (spec ? a->spPow : 1.0f) * (crit ? 1.6f : 1.0f) * d->defMul;
            dmg = (int)(dm + 0.5f);
            if (dmg < 1) dmg = 1;
            if (blocked) {
              int bd = spec ? dmg / 3 : dmg / 5;
              if (bd < 1) bd = 1;
              d->hp -= bd; d->vx = dir * kb * 0.6f;
              d->energy += 2.0f; a->energy += 1.0f;
              spawn(sx, sy, 6, 140, 190, 255, 3.0f);
              hitStop = 2;
              sfx(SFX_BLOCK);
            } else {
              d->hp -= dmg;
              set_st(d, ST_HURT);
              d->hurtT = stun; d->vx = dir * kb;
              if (!d->onGround) d->vy = -3.5f;
              a->energy += dmg * 1.4f * a->enMul; d->energy += dmg * 0.7f * d->enMul;
              a->comboN++; a->comboT = 100;
              if (a->comboN > maxCombo && a == &F[0]) maxCombo = a->comboN;
              if (crit) spawn(sx, sy, 16, 255, 120, 60, 5.0f);
              else spawn(sx, sy, spec ? 22 : 12, 255, 230, 120, spec ? 6.0f : 4.0f);
              hitStop = spec ? 7 : 4;
              shakeT = spec ? 14 : 8; shakeA = spec ? 5.0f : 3.0f;
              sfx(SFX_HIT);
            }
            if (a->energy > 100.0f) a->energy = 100.0f;
            if (d->energy > 100.0f) d->energy = 100.0f;
            if (d->hp <= 0) {
              if (mode == M_TRAINING && d == &F[1]) {
                d->hp = d->maxhp;
                spawn(d->x, d->y - 40, 26, 255, 255, 255, 5.0f);
              } else {
                d->hp = 0;
                set_st(d, ST_KO);
                d->vy = -5.5f; d->onGround = 0; d->vx = dir * 5.0f;
                hitStop = 10; shakeT = 22; shakeA = 6.0f;
                sfx(SFX_KO);
              }
            }
          }

          static int try_hit(Fighter *a, Fighter *d) {
            float reach, y0, y1, kb;
            int a0, a1, dmg, stun;
            if (fs != FS_FIGHT || a->hitDone || d->st == ST_KO) return 0;
            if (!atk_params(a, &reach, &y0, &y1, &a0, &a1, &dmg, &kb, &stun)) return 0;
            if (a->t < a0 || a->t > a1) return 0;
            if (!overlap(a, d, reach, y0, y1)) return 0;
            a->hitDone = 1;
            do_hit(a, d, a->dir, dmg, kb, stun, 0);
            return 1;
          }

          static void fire(Fighter *f) {
            int i, owner = (f == &F[0]) ? 0 : 1;
            for (i = 0; i < 4; i++) {
              if (!projs[i].active) {
                projs[i].active = 1; projs[i].owner = owner;
                projs[i].x = f->x + f->dir * 26.0f * f->scale; projs[i].y = f->y - 46.0f * f->scale;
                projs[i].vx = f->dir * 5.8f;
                spawn(projs[i].x, projs[i].y, 8, f->ar, f->ag, f->ab, 3.0f);
                sfx(SFX_BOLT);
                return;
              }
            }
          }

          static void do_special(Fighter *f, Fighter *o) {
            int k = f->spKind;
            if (fs != FS_FIGHT) return;
            if (k == 0) fire(f);
            else if (k == 1) {
              sfx(SFX_QUAKE); shakeT = 16; shakeA = 4.0f;
              spawn(f->x, f->y - 4.0f, 20, 255, 210, 100, 5.0f);
              if (o->st != ST_KO && o->onGround && fabsf(o->x - f->x) < 115.0f)
                do_hit(f, o, (o->x >= f->x) ? 1 : -1, 18, 8.0f, 24, 1);
            } else if (k == 2) { f->rushT = 10; sfx(SFX_BOLT); }
            else {
              f->hp += (int)(22.0f * f->spPow);
              if (f->hp > f->maxhp) f->hp = f->maxhp;
              spawn(f->x, f->y - 40.0f, 20, 90, 255, 140, 3.0f);
              sfx(SFX_HEAL);
            }
            f->energy -= (float)f->spCost;
            if (f->energy < 0) f->energy = 0;
          }

          static void update_projs(void) {
            int i;
            for (i = 0; i < 4; i++) {
              Proj *p = &projs[i];
              Fighter *t;
              if (!p->active) continue;
              p->x += p->vx;
              if (p->x < -30 || p->x > 430) { p->active = 0; continue; }
              spawn(p->x, p->y, 1, F[p->owner].ar, F[p->owner].ag, F[p->owner].ab, 1.0f);
              t = &F[1 - p->owner];
              if (t->st != ST_KO && fabsf(p->x - t->x) < 16.0f * t->scale && p->y > t->y - 72.0f * t->scale && p->y < t->y) {
                p->active = 0;
                do_hit(&F[p->owner], t, p->vx > 0 ? 1 : -1, 16, 7.0f, 24, 1);
              }
            }
          }

          static void update_fighter(Fighter *f, Fighter *o, Inp in, int canAct) {
            int mv;
            f->t++;
            if (f->dashCd > 0) f->dashCd--;
            if (f->comboT > 0) { f->comboT--; if (f->comboT == 0) f->comboN = 0; }
            if (f->regen > 0.0f && f->st != ST_KO && f->hp > 0 && fs == FS_FIGHT) {
              f->hpAcc += f->regen;
              if (f->hpAcc >= 1.0f) { f->hpAcc -= 1.0f; if (f->hp < f->maxhp) f->hp++; }
            }
            if (f->onGround && (f->st == ST_IDLE || f->st == ST_WALK || f->st == ST_BLOCK || f->st == ST_WIN))
              f->dir = (o->x >= f->x) ? 1 : -1;
            if (canAct && (f->st == ST_IDLE || f->st == ST_WALK || f->st == ST_JUMP || f->st == ST_BLOCK)) {
              if (f->onGround && in.block) {
                if (f->st != ST_BLOCK) set_st(f, ST_BLOCK);
                f->vx = 0;
              } else {
                if (f->st == ST_BLOCK) set_st(f, ST_IDLE);
                if (in.special && f->energy >= (float)f->spCost) { set_st(f, ST_SPECIAL); f->vx = 0; }
                else if (in.punch) { set_st(f, ST_PUNCH); sfx(SFX_PUNCH); }
                else if (in.kick) { set_st(f, ST_KICK); sfx(SFX_KICK); }
                else if (f->onGround) {
                  mv = in.right - in.left;
                  if (in.jump) {
                    f->vy = -9.8f; f->onGround = 0; set_st(f, ST_JUMP); f->vx = mv * 2.6f * f->spdMul; sfx(SFX_JUMP);
                  } else {
                    if (in.dash && f->dashCd == 0) { f->dashT = 8; f->dashCd = 45; f->dashDir = mv != 0 ? mv : f->dir; }
                    if (f->dashT > 0) { f->dashT--; f->vx = f->dashDir * 7.0f * f->spdMul; }
                    else if (mv != 0) { f->vx = mv * 2.3f * f->spdMul; if (f->st != ST_WALK) set_st(f, ST_WALK); }
                    else if (f->st == ST_WALK) set_st(f, ST_IDLE);
                  }
                }
              }
            }
            if (f->st == ST_PUNCH) {
              try_hit(f, o);
              if (f->t >= PUNCH_TOTAL) set_st(f, f->onGround ? ST_IDLE : ST_JUMP);
            } else if (f->st == ST_KICK) {
              try_hit(f, o);
              if (f->t >= KICK_TOTAL) set_st(f, f->onGround ? ST_IDLE : ST_JUMP);
            } else if (f->st == ST_SPECIAL) {
              if (f->t == SPEC_FIRE) do_special(f, o);
              if (f->t >= SPEC_TOTAL) set_st(f, ST_IDLE);
            } else if (f->st == ST_HURT) {
              if (f->t >= f->hurtT) set_st(f, f->onGround ? ST_IDLE : ST_JUMP);
            }
            if (f->rushT > 0) {
              f->rushT--; f->vx = f->dir * 11.0f;
              if (!f->hitDone && fs == FS_FIGHT && o->st != ST_KO && fabsf(o->x - f->x) < 28.0f * o->scale + 6.0f && fabsf(o->y - f->y) < 50.0f) {
                f->hitDone = 1;
                do_hit(f, o, f->dir, 13, 7.0f, 22, 1);
              }
            }
            f->x += f->vx;
            if (!f->onGround) {
              f->vy += 0.55f; f->y += f->vy;
              if (f->y >= GROUND) {
                f->y = GROUND; f->vy = 0; f->onGround = 1;
                if (f->st == ST_JUMP) set_st(f, ST_IDLE);
              }
            }
            if (f->onGround && f->st != ST_WALK && f->dashT == 0 && f->rushT == 0) f->vx *= 0.82f;
            if (f->st == ST_KO) f->rot = fminf(PI_F * 0.5f, f->t * 0.10f); else f->rot = 0;
            f->x = clampf(f->x, ARENA_L, ARENA_R);
          }

          static void separate(void) {
            float dx = F[1].x - F[0].x, m = 20.0f, p, sg;
            if (fabsf(dx) < m && F[0].onGround && F[1].onGround && F[0].st != ST_KO && F[1].st != ST_KO) {
              p = (m - fabsf(dx)) * 0.5f; sg = dx >= 0 ? 1.0f : -1.0f;
              F[0].x = clampf(F[0].x - sg * p, ARENA_L, ARENA_R);
              F[1].x = clampf(F[1].x + sg * p, ARENA_L, ARENA_R);
            }
          }

          static Inp ai_think(Fighter *f, Fighter *o) {
            Inp in;
            const Opp *op = &OPP[curOpp];
            float dm = setDiff == 0 ? 0.55f : (setDiff == 2 ? 1.35f : 1.0f);
            float aggr = op->aggr + curAggrAdd / 100.0f;
            float d = fabsf(o->x - f->x), r;
            int toward = (o->x > f->x) ? 1 : -1, bolt = 0, threat, i;
            memset(&in, 0, sizeof in);
            if (mode == M_TRAINING || f->st == ST_KO || f->st == ST_HURT || f->st == ST_WIN) return in;
            if (f->aiCool > 0) f->aiCool--;
            if (f->aiBlockT > 0) { f->aiBlockT--; in.block = 1; return in; }
            for (i = 0; i < 4; i++)
              if (projs[i].active && projs[i].owner == 0 && fabsf(projs[i].x - f->x) < 80.0f) bolt = 1;
            threat = (o->st == ST_PUNCH || o->st == ST_KICK) && d < (70.0f + o->reachAdd) * f->scale;
            if ((threat || bolt) && f->onGround && frand() < op->block * dm * 0.9f) {
              f->aiBlockT = 12 + rand() % 14; in.block = 1; return in;
            }
            if (f->t < 4 && f->st == ST_IDLE && d < 46.0f * f->scale && f->aiCool == 0 && frand() < aggr * dm) {
              f->aiAct = frand() < 0.4f ? 4 : 3; f->aiActT = 2; f->aiCool = 20 + rand() % 20;
            } else if (f->aiActT > 0) f->aiActT--;
            else {
              r = frand();
              f->aiAct = 0; f->aiActT = 8 + rand() % 14;
              if (f->energy >= (float)f->spCost && d > 70.0f && frand() < 0.30f * dm) { f->aiAct = 5; f->aiActT = 2; }
              else if (d > 64.0f) {
                f->aiAct = (r < 0.35f + aggr) ? 1 : 0;
                if (frand() < 0.06f * dm) f->aiAct = 6;
              } else if (d > 34.0f) {
                if (f->aiCool == 0 && r < aggr * dm) {
                  f->aiAct = (frand() < 0.55f) ? 4 : 3; f->aiActT = 2;
                  f->aiCool = (int)((55.0f - 30.0f * aggr) / dm) + rand() % 20;
                } else f->aiAct = (r < 0.5f) ? 1 : ((r < 0.75f) ? 2 : 0);
              } else {
                if (f->aiCool == 0 && r < aggr * dm * 1.2f) {
                  f->aiAct = 3; f->aiActT = 2;
                  f->aiCool = (int)((45.0f - 25.0f * aggr) / dm) + rand() % 15;
                } else f->aiAct = (r < 0.6f) ? 2 : 0;
              }
            }
            switch (f->aiAct) {
              case 1: if (toward > 0) in.right = 1; else in.left = 1; break;
              case 2: if (toward > 0) in.left = 1; else in.right = 1; break;
              case 3: in.punch = 1; break;
              case 4: in.kick = 1; break;
              case 5: in.special = 1; break;
              case 6: in.jump = 1; if (toward > 0) in.right = 1; else in.left = 1; break;
              default: break;
            }
            return in;
          }

          static int fight_track(void) {
            if (mode == M_STORY) return 1 + storyAct;
            if (mode == M_SURVIVAL) return 1 + (survWins % 5);
            if (mode == M_FREE) return 1 + (curOpp % 5);
            return 1;
          }
          static int fight_inten(void) {
            if (mode == M_STORY) return storyFight == 2;
            if (mode == M_FREE) return curOpp == NOPP - 1;
            if (mode == M_SURVIVAL) return survWins >= 7;
            return 0;
          }

          static void start_round(void) {
            const Opp *op = &OPP[curOpp];
            float mul = setDiff == 0 ? 0.85f : (setDiff == 2 ? 1.2f : 1.0f);
            int ehp = (int)(op->hp * mul * curHpPct / 100.0f) + (mode == M_SURVIVAL ? (survWins / NOPP) * 25 : 0);
            init_fighter(&F[0], 130.0f, 1, 100);
            init_fighter(&F[1], 270.0f, -1, ehp);
            style_player(&F[0]);
            style_opp(&F[1], curOpp);
            F[1].dmgMul = 1.0f + (mode == M_STORY ? storyAct * 0.06f : (mode == M_SURVIVAL ? survWins * 0.03f : 0.0f));
            if (mode == M_SURVIVAL && carryHp > 0) F[0].hp = clampi(carryHp, 1, F[0].maxhp);
            timerF = (mode == M_TRAINING) ? 0 : timeVals[setTimeIdx] * 60;
            fs = FS_INTRO; fst = 0; hitStop = 0; shakeT = 0;
            memset(projs, 0, sizeof projs);
            memset(parts, 0, sizeof parts);
            music_play(fight_track(), fight_inten());
          }

          static void start_match_ex(int m, int opp, int hpPct, int aggrAdd) {
            mode = m; curOpp = opp; wins[0] = wins[1] = 0; roundNo = 1; maxCombo = 0;
            curHpPct = hpPct; curAggrAdd = aggrAdd; rewCoins = rewGems = 0; actDone = 0; firstFight = 0;
            needWins = (m == M_SURVIVAL) ? 1 : (m == M_TRAINING ? 99 : setRounds);
            if (m == M_SURVIVAL) { survWins = 0; carryHp = 0; }
            scene = SC_FIGHT; paused = 0; pauseSel = 0;
            bufP = bufK = bufS = bufJ = bufD = 0;
            start_round();
          }
          static void start_match(int m, int opp) { start_match_ex(m, opp, 100, 0); }

          static void start_story_fight(int a, int f) {
            const Fight *fg = &FIGHTS[a][f];
            storyAct = a; storyFight = f;
            start_match_ex(M_STORY, fg->opp, fg->hp, fg->aggr);
          }

          static void demo_init(void) {
            init_fighter(&F[0], 150.0f, 1, 100);
            init_fighter(&F[1], 250.0f, -1, 100);
            style_player(&F[0]);
            style_opp(&F[1], rand() % NOPP);
            memset(projs, 0, sizeof projs);
            memset(parts, 0, sizeof parts);
            shakeT = 0;
          }
          static void menu_enter(void) {
            if (scene == SC_SET || scene == SC_SHOP || scene == SC_RESULT || scene == SC_FIGHT) save_game();
            scene = SC_MENU; eraseArm = 0;
            demo_init();
            music_play(0, 0);
          }
          static void open_storytxt(int a) {
            txtAct = a; txtKind = 0; scene = SC_STORYTXT;
            demo_init();
            music_play(0, 0);
          }
          static void shop_enter(void) {
            demo_init();
            scene = SC_SHOP; shopTab = 0; shopSel = 0; shopTop = 0;
            F[1].x = 380.0f;
            music_play(6, 0);
          }

          static void res_add(int a, const char *l) { resAct[resN] = a; resLabels[resN] = l; resN++; }

          static void show_result(void) {
            scene = SC_RESULT; resSel = 0; resN = 0;
            music_play(-1, 0);
            if (mode == M_STORY) {
              if (matchWon) {
                if (storyFight < 2) res_add(RA_NEXT, tr("Next fight", "Próxima luta"));
                else if (storyAct < NACT - 1) res_add(RA_NEXTACT, tr("Next act", "Próximo ato"));
                else res_add(RA_ENDING, tr("Ending", "Final"));
              } else res_add(RA_RETRY, tr("Retry", "Tentar de novo"));
              res_add(RA_SHOP, tr("Shop", "Loja"));
              res_add(RA_MENU, tr("Main menu", "Menu principal"));
            } else if (mode == M_SURVIVAL) {
              res_add(RA_AGAIN, tr("Play again", "Jogar de novo"));
              res_add(RA_SHOP, tr("Shop", "Loja"));
              res_add(RA_MENU, tr("Main menu", "Menu principal"));
            } else {
              res_add(RA_AGAIN, tr("Rematch", "Revanche"));
              res_add(RA_MENU, tr("Main menu", "Menu principal"));
            }
            sfx(matchWon ? SFX_WIN : SFX_LOSE);
            if (rewCoins > 0 || rewGems > 0) sfx(SFX_COIN);
            save_game();
          }

          static void give(int coins, int gems) {
            const GearDef *g = &GEARS[sv.gearEq];
            if (g->kind == 3) coins = coins * (100 + g->val) / 100;
            sv.coins = clampi(sv.coins + coins, 0, 999999);
            sv.gems = clampi(sv.gems + gems, 0, 99999);
            rewCoins = coins; rewGems = gems;
          }

          static void finish_match(void) {
            matchWon = wins[0] > wins[1];
            if (matchWon) sv.wins++; else sv.losses++;
            if (maxCombo > sv.bestCombo) sv.bestCombo = maxCombo;
            if (mode == M_SURVIVAL && matchWon) {
              survWins++;
              carryHp = F[0].hp + 35;
              if (carryHp > F[0].maxhp) carryHp = F[0].maxhp;
              curOpp = survWins % NOPP;
              wins[0] = wins[1] = 0; roundNo = 1;
              start_round();
              return;
            }
            if (mode == M_STORY && matchWon) {
              int idx = storyAct * 3 + storyFight;
              const Fight *fg = &FIGHTS[storyAct][storyFight];
              int first = !((sv.clearedMask >> idx) & 1);
              give(first ? fg->coins : fg->coins / 2, first ? fg->gems : 0);
              firstFight = first;
              sv.clearedMask |= 1 << idx;
              if (storyAct == sv.curAct && storyFight == sv.curFight) {
                if (storyFight < 2) sv.curFight = storyFight + 1;
                else if (storyAct < NACT - 1) {
                  sv.curAct = storyAct + 1; sv.curFight = 0;
                  if (sv.actsUnlocked < storyAct + 2) sv.actsUnlocked = storyAct + 2;
                } else sv.curFight = 3;
              }
              actDone = (storyFight == 2);
            } else if (mode == M_SURVIVAL) {
              if (survWins > sv.bestSurv) sv.bestSurv = survWins;
              give(survWins * 30, survWins / 5);
            } else if (mode == M_FREE && matchWon) {
              give(20 + curOpp * 5, 0);
            }
            show_result();
          }

          static void end_round(int winner) {
            if (winner >= 0) wins[winner]++;
            koWinner = winner;
            fs = FS_KO; fst = 0;
            memset(projs, 0, sizeof projs);
          }

          static void update_fight(u32 kD, u32 kH, circlePosition cp) {
            Inp pi, ai, none;
            memset(&none, 0, sizeof none);
            fst++;
            if (shakeT > 0) shakeT--;
            update_parts();
            if (fs == FS_INTRO) {
              update_fighter(&F[0], &F[1], none, 0);
              update_fighter(&F[1], &F[0], none, 0);
              if (fst >= 130) { fs = FS_FIGHT; fst = 0; }
              return;
            }
            if (fs == FS_KO) {
              update_fighter(&F[0], &F[1], none, 0);
              update_fighter(&F[1], &F[0], none, 0);
              if (fst == 40) {
                if (F[0].hp > 0 && F[0].onGround && F[0].st != ST_KO) set_st(&F[0], ST_WIN);
                if (F[1].hp > 0 && F[1].onGround && F[1].st != ST_KO) set_st(&F[1], ST_WIN);
              }
              if (fst >= 170) {
                if (wins[0] >= needWins || wins[1] >= needWins) finish_match();
                else { roundNo++; start_round(); }
              }
              return;
            }
            if (hitStop > 0) { hitStop--; return; }
            if (kD & KEY_A) bufP = 7;
            if (kD & KEY_B) bufK = 7;
            if (kD & KEY_R) bufS = 7;
            if (kD & (KEY_X | KEY_DUP)) bufJ = 7;
            if (kD & KEY_L) bufD = 4;
            memset(&pi, 0, sizeof pi);
            if ((kH & KEY_DLEFT) || cp.dx < -45) pi.left = 1;
            if ((kH & KEY_DRIGHT) || cp.dx > 45) pi.right = 1;
            pi.block = (kH & KEY_Y) != 0;
            pi.punch = bufP > 0; pi.kick = bufK > 0; pi.special = bufS > 0; pi.jump = bufJ > 0; pi.dash = bufD > 0;
            ai = ai_think(&F[1], &F[0]);
            if (mode == M_TRAINING) F[0].energy = 100.0f;
            update_fighter(&F[0], &F[1], pi, 1);
            update_fighter(&F[1], &F[0], ai, 1);
            if (F[0].st == ST_PUNCH) bufP = 0;
            if (F[0].st == ST_KICK) bufK = 0;
            if (F[0].st == ST_SPECIAL) bufS = 0;
            if (F[0].st == ST_JUMP) bufJ = 0;
            if (bufP > 0) bufP--;
            if (bufK > 0) bufK--;
            if (bufS > 0) bufS--;
            if (bufJ > 0) bufJ--;
            if (bufD > 0) bufD--;
            separate();
            update_projs();
            if (timerF > 0) {
              timerF--;
              if (timerF == 0) {
                float p = (float)F[0].hp / F[0].maxhp, e = (float)F[1].hp / F[1].maxhp;
                end_round(p > e ? 0 : (e > p ? 1 : -1));
                return;
              }
            }
            if (F[0].hp <= 0 || F[1].hp <= 0) {
              if (F[0].hp <= 0 && F[1].hp <= 0) end_round(-1);
              else end_round(F[0].hp <= 0 ? 1 : 0);
            }
          }

          /* -------------------------------------------------------------- drawing */
          static float prof(float p) {
            if (p < 0.3f) return p / 0.3f;
            if (p < 0.55f) return 1.0f;
            p = 1.0f - (p - 0.55f) / 0.45f;
            return p < 0 ? 0 : p;
          }

          static void T(const Fighter *f, float lx, float ly, float *sx, float *sy) {
            float c = cosf(f->rot), s = sinf(f->rot);
            float x = lx * c - ly * s, y = lx * s + ly * c;
            *sx = f->x + f->dir * x * f->scale;
            *sy = f->y - y * f->scale - (f->rot > 0.1f ? 4.0f : 0.0f);
          }

          static void lbend(float *L, int a, int b, int m, float bend) {
            float ax = L[a * 2], ay = L[a * 2 + 1], bx = L[b * 2], by = L[b * 2 + 1];
            float dx = bx - ax, dy = by - ay, len = sqrtf(dx * dx + dy * dy) + 0.001f;
            L[m * 2] = (ax + bx) * 0.5f - dy / len * bend;
            L[m * 2 + 1] = (ay + by) * 0.5f + dx / len * bend;
          }

          static void pose_local(const Fighter *f, float *L) {
            float bob = sinf(f->t * 0.12f), ph = f->t * 0.30f, e, c, s1;
            float hx = 0, hy = 71, nx = 0, ny = 60, px = 0, py = 34;
            float h1x = 16, h1y = 52, h2x = 7, h2y = 48;
            float f1x = 10, f1y = 0, f2x = -10, f2y = 0;
            switch (f->st) {
              case ST_IDLE: ny += bob * 0.8f; hy += bob * 0.8f; h1y += bob; h2y += bob; break;
              case ST_WALK:
                s1 = sinf(ph);
                f1x = s1 * 14; f2x = -s1 * 14; f1y = fmaxf(0, cosf(ph)) * 7; f2y = fmaxf(0, -cosf(ph)) * 7;
                h1x = 14 - s1 * 6; h2x = 6 + s1 * 6; break;
              case ST_JUMP: f1x = 12; f1y = 16; f2x = -6; f2y = 10; h1x = 14; h1y = 58; h2x = 4; h2y = 56; break;
              case ST_PUNCH:
                e = prof((float)f->t / PUNCH_TOTAL);
                h1x = 16 + e * 32; h1y = 54; h2x = 6; h2y = 48; nx = e * 5; hx = e * 6; f1x = 14; f2x = -12; break;
              case ST_KICK:
                e = prof((float)f->t / KICK_TOTAL);
                f1x = 10 + e * 44; f1y = 8 + e * 24; f2x = -8; nx = -e * 7; hx = -e * 9;
                h1x = 6; h1y = 56; h2x = -6; h2y = 60; break;
              case ST_SPECIAL:
                if (f->t < SPEC_FIRE) {
                  c = (float)f->t / SPEC_FIRE; h1x = 10 - c * 10; h1y = 50; h2x = 6 - c * 10; h2y = 46; nx = -c * 3;
                } else {
                  c = fminf(1.0f, (f->t - SPEC_FIRE) / 6.0f); h1x = 14 + c * 18; h1y = 52; h2x = 10 + c * 20; h2y = 48; nx = c * 4;
                }
                f1x = 14; f2x = -12; break;
              case ST_BLOCK:
                py = 28; ny = 54; hy = 65; nx = 2; hx = 3; h1x = 17; h1y = 60; h2x = 14; h2y = 48; f1x = 14; f2x = -12; break;
              case ST_HURT:
                nx = -8; hx = -11; ny = 59; hy = 69; h1x = -10; h1y = 54; h2x = -16; h2y = 44; f1x = 6; f2x = -14; break;
              case ST_KO: h1x = 14; h1y = 48; h2x = -12; h2y = 40; f1x = 16; f2x = -14; break;
              case ST_WIN:
                ny += bob; hy += bob; h1x = 8; h1y = 88 + bob * 2; h2x = -6; h2y = 86 - bob * 2; break;
              default: break;
            }
            L[0] = hx; L[1] = hy; L[2] = nx; L[3] = ny; L[4] = px; L[5] = py;
            L[8] = h1x; L[9] = h1y; L[12] = h2x; L[13] = h2y;
            L[16] = f1x; L[17] = f1y; L[20] = f2x; L[21] = f2y;
            lbend(L, 1, 4, 3, -6.0f); lbend(L, 1, 6, 5, -6.0f);
            lbend(L, 2, 8, 7, 5.0f); lbend(L, 2, 10, 9, 5.0f);
          }

          static void draw_fighter(const Fighter *f) {
            float L[22], S[22], s = f->scale, w, ex, ey, ax, ay, bx, by, cx, cy;
            int i, pass;
            u32 body = C(14, 12, 22, 255), glow = C(f->ar, f->ag, f->ab, 110), eye = C(f->ar, f->ag, f->ab, 255);
            pose_local(f, L);
            for (i = 0; i < 11; i++) T(f, L[i * 2], L[i * 2 + 1], &S[i * 2], &S[i * 2 + 1]);
            w = 46.0f * s * (1.0f - (GROUND - f->y) / 260.0f);
            C2D_DrawEllipseSolid(f->x - w * 0.5f + OX, GROUND - 4.0f + OY, nz(), w, 8.0f, C(0, 0, 0, 110));
            for (pass = 0; pass < 2; pass++) {
              u32 c = pass ? body : glow;
              float a = pass ? 0.0f : 4.0f, tk = 5.0f * s + a, tt = 7.0f * s + a;
              line(S[2], S[3], S[4], S[5], tt, c);
              line(S[2], S[3], S[6], S[7], tk, c); line(S[6], S[7], S[8], S[9], tk, c);
              line(S[2], S[3], S[10], S[11], tk, c); line(S[10], S[11], S[12], S[13], tk, c);
              line(S[4], S[5], S[14], S[15], tk, c); line(S[14], S[15], S[16], S[17], tk, c);
              line(S[4], S[5], S[18], S[19], tk, c); line(S[18], S[19], S[20], S[21], tk, c);
              for (i = 1; i < 11; i++) circ(S[i * 2], S[i * 2 + 1], tk * 0.5f, c);
              circ(S[0], S[1], 9.0f * s + (pass ? 0.0f : 2.0f), c);
            }
            if (f->armorOn) {
              u32 ac = C(f->amr, f->amg, f->amb, 255);
              line(S[2], S[3] + 2.0f * s, S[4], S[5] - 2.0f * s, 5.0f * s, ac);
              circ(S[2], S[3] + 1.0f * s, 5.5f * s, ac);
              line(S[4] - 5.0f * s, S[5], S[4] + 5.0f * s, S[5], 3.0f * s, ac);
            }
            if (f->st != ST_KO) {
              T(f, L[0] + 4.5f, L[1] + 1.5f, &ex, &ey);
              circ(ex, ey, 2.3f * s, eye);
            }
            if (f->acc & 1) {
              T(f, L[0] - 13, L[1] + 5, &ax, &ay); T(f, L[0] + 13, L[1] + 5, &bx, &by); T(f, L[0], L[1] + 23, &cx, &cy);
              tri(ax, ay, bx, by, cx, cy, body);
              line(ax - 2, ay, bx + 2, by, 3.0f * s, body);
            }
            if (f->acc & 2) {
              T(f, L[0] - 7, L[1] + 6, &ax, &ay); T(f, L[0] - 12, L[1] + 21, &bx, &by); T(f, L[0] - 2, L[1] + 8, &cx, &cy);
              tri(ax, ay, bx, by, cx, cy, eye);
              T(f, L[0] + 7, L[1] + 6, &ax, &ay); T(f, L[0] + 12, L[1] + 21, &bx, &by); T(f, L[0] + 2, L[1] + 8, &cx, &cy);
              tri(ax, ay, bx, by, cx, cy, eye);
            }
            if (f->acc & 8) {
              for (i = -1; i <= 1; i++) {
                T(f, L[0] + i * 6 - 3, L[1] + 8, &ax, &ay); T(f, L[0] + i * 6 + 3, L[1] + 8, &bx, &by); T(f, L[0] + i * 6, L[1] + 18, &cx, &cy);
                tri(ax, ay, bx, by, cx, cy, C(255, 200, 60, 255));
              }
            }
            if (f->acc & 16) {
              float wv = f->t * 0.3f;
              T(f, L[0] - 7, L[1] - 2, &ax, &ay);
              T(f, L[0] - 16, L[1] - 4 + sinf(wv) * 3, &bx, &by);
              T(f, L[0] - 25, L[1] - 8 + sinf(wv + 1.0f) * 4, &cx, &cy);
              line(ax, ay, bx, by, 3.0f * s, eye); line(bx, by, cx, cy, 3.0f * s, eye);
            }
            if (f->bladeLen > 0) {
              float bl = (float)f->bladeLen;
              T(f, L[8], L[9], &ax, &ay);
              if (f->st == ST_PUNCH) T(f, L[8] + bl + 4.0f, L[9] + 3, &bx, &by); else T(f, L[8] + 7, L[9] + bl, &bx, &by);
              line(ax, ay, bx, by, 4.0f * s, C(f->blr, f->blg, f->blb, 110));
              line(ax, ay, bx, by, 2.5f * s, C(f->blr, f->blg, f->blb, 255));
            }
            if (f->st == ST_SPECIAL && f->t < SPEC_FIRE) {
              static const int aur[4][3] = {{-1, 0, 0}, {255, 210, 100}, {-1, 0, 0}, {90, 255, 140}};
              int ar = aur[f->spKind][0] < 0 ? f->ar : aur[f->spKind][0];
              int ag = aur[f->spKind][0] < 0 ? f->ag : aur[f->spKind][1];
              int ab = aur[f->spKind][0] < 0 ? f->ab : aur[f->spKind][2];
              T(f, L[8], L[9], &ax, &ay);
              circ(ax, ay, 5.0f + f->t * 0.9f, C(ar, ag, ab, 90));
              circ(ax, ay, 3.0f + f->t * 0.3f, C(255, 255, 255, 220));
            }
          }

