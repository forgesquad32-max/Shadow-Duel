      - name: Compile (3dsx)
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          export DEVKITARM=${DEVKITARM:-$DEVKITPRO/devkitARM}
          export PATH=$PATH:$DEVKITPRO/tools/bin:$DEVKITARM/bin:/usr/local/bin
          ARCH="-march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft"
          arm-none-eabi-gcc -g -Wall -O2 -mword-relocations -ffunction-sections $ARCH -D__3DS__ \
            -I$DEVKITPRO/libctru/include source/main.c \
            -specs=3dsx.specs $ARCH -L$DEVKITPRO/libctru/lib \
            -lcitro2d -lcitro3d -lctru -lm -o build/shadowduel.elf
          bannertool makesmdh -s "Shadow Duel" -l "Original shadow fighting game" -p "CART3R.JAILBREAK" -i build/icon.png -o build/icon.smdh
          3dsxtool build/shadowduel.elf build/shadowduel.3dsx --smdh=build/icon.smdh
          ls -l build

      - name: Make CIA
        continue-on-error: true
        run: |
          export PATH=$PATH:/usr/local/bin
          bannertool makebanner -i build/banner.png -a build/audio.wav -o build/banner.bnr
          makerom -f cia -o build/shadowduel.cia -target t -exefslogo -elf build/shadowduel.elf -rsf build/app.rsf -banner build/banner.bnr -icon build/icon.smdh
          ls -l build

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShadowDuel-3DS
          path: |
            build/shadowduel.cia
            build/shadowduel.3dsx
          if-no-files-found: warn
