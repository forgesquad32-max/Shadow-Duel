            shop_price(tab, i, &coins, &gems);
            if (tab == 3 && i >= NSP) {
              if (coins < 0) snprintf(b, sizeof b, "MAX");
              else snprintf(b, sizeof b, "Lv%d  %d", sv.passLv[i - NSP], coins);
              text(x + w - 8 - textw(b, 0.42f) - 14, y + 3, 0.42f, C(255, 230, 150, 255), b);
              if (coins >= 0) coin_icon(x + w - 14, y + 11, 5);
            } else if (shop_equipped(tab, i)) {
              snprintf(b, sizeof b, "%s", tr("EQUIPPED", "EQUIPADO"));
              text(x + w - 8 - textw(b, 0.42f), y + 3, 0.42f, C(120, 255, 160, 255), b);
            } else if (shop_owned(tab, i)) {
              snprintf(b, sizeof b, "%s", tr("OWNED", "COMPRADO"));
              text(x + w - 8 - textw(b, 0.42f), y + 3, 0.42f, C(200, 200, 210, 255), b);
            } else if (gems > 0) {
              snprintf(b, sizeof b, "%d", gems);
              text(x + w - 8 - textw(b, 0.42f) - 14, y + 3, 0.42f, C(180, 240, 255, 255), b);
              gem_icon(x + w - 14, y + 11, 6);
            } else {
              snprintf(b, sizeof b, "%d", coins);
              text(x + w - 8 - textw(b, 0.42f) - 14, y + 3, 0.42f, C(255, 230, 150, 255), b);
              coin_icon(x + w - 14, y + 11, 5);
            }
          }

