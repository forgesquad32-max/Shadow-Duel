          static int nav(int sel, int n, u32 kD) {
            int old = sel;
            if (kD & KEY_DDOWN) sel = (sel + 1) % n;
            if (kD & KEY_DUP) sel = (sel + n - 1) % n;
            if (sel != old) sfx(SFX_MOVE);
            return sel;
          }

          static int gnav(int sel, int n, int cols, u32 kD) {
            int old = sel;
            if ((kD & KEY_DRIGHT) && sel % cols < cols - 1 && sel + 1 < n) sel++;
            if ((kD & KEY_DLEFT) && sel % cols > 0) sel--;
            if (kD & KEY_DDOWN) { if (sel + cols < n) sel += cols; else sel = sel % cols; }
            if (kD & KEY_DUP) {
              if (sel - cols >= 0) sel -= cols;
              else { int last = ((n - 1) / cols) * cols + sel % cols; if (last >= n) last -= cols; sel = last; }
            }
            if (sel != old) sfx(SFX_MOVE);
            return sel;
          }

          static int list_hit(touchPosition tp, float x0, float y0, float w, float h, float gap, int n) {
            int i;
            for (i = 0; i < n; i++) {
              float y = y0 + i * (h + gap);
              if (tp.px >= x0 && tp.px <= x0 + w && tp.py >= y && tp.py <= y + h) return i;
            }
            return -1;
          }

          static int grid_hit(touchPosition tp, float x0, float y0, float w, float h, float gx, float gy, int cols, int n) {
            int i;
            for (i = 0; i < n; i++) {
              float x = x0 + (i % cols) * (w + gx), y = y0 + (i / cols) * (h + gy);
              if (tp.px >= x && tp.px <= x + w && tp.py >= y && tp.py <= y + h) return i;
            }
            return -1;
          }

          static void scroll_fix(int sel, int *top, int vis) {
            if (sel < *top) *top = sel;
            if (sel >= *top + vis) *top = sel - vis + 1;
            if (*top < 0) *top = 0;
          }

          static int slist_hit(touchPosition tp, float x0, float y0, float w, float h, float gap, int top, int vis, int n) {
            int i;
            for (i = 0; i < vis && top + i < n; i++) {
              float y = y0 + i * (h + gap);
              if (tp.px >= x0 && tp.px <= x0 + w && tp.py >= y && tp.py <= y + h) return top + i;
            }
            return -1;
          }

          static void draw_slist(const char **lab, int n, int sel, int top, float x0, float y0, float w, float h, float gap, int vis) {
            int i;
            for (i = 0; i < vis && top + i < n; i++) button(x0, y0 + i * (h + gap), w, h, lab[top + i], top + i == sel);
            if (top > 0) tri(305, y0 + 8, 299, y0 + 16, 311, y0 + 16, C(255, 90, 100, 255));
            if (top + vis < n) { float yb = y0 + vis * (h + gap) - gap - 8; tri(305, yb + 8, 299, yb, 311, yb, C(255, 90, 100, 255)); }
          }



          /* ----------------------------------------------------- shop / armory */
          static int tab_count(int tab) {
            switch (tab) {
              case 0: return NW;
              case 1: return NR;
              case 2: return NA;
              case 3: return NH;
              case 4: return NM;
              case 5: return NENCH;
              default: return 8;
            }
          }
          static int tab_total(void) { return shopMode ? 7 : 6; }

          static const char *item_name(int tab, int i) {
            switch (tab) {
              case 0: return tr(WEAPS[i].en, WEAPS[i].pt);
              case 1: return tr(RNGS[i].en, RNGS[i].pt);
              case 2: return tr(ARMS[i].en, ARMS[i].pt);
              case 3: return tr(HELMS[i].en, HELMS[i].pt);
              case 4: return tr(MAGS[i].en, MAGS[i].pt);
              case 5: return tr(ENCH[i].en, ENCH[i].pt);
              default: return i < 7 ? tr(SKILLS[i].en, SKILLS[i].pt) : tr("Reset skills", "Redefinir habilidades");
            }
          }
          static int item_owned(int tab, int i) {
            switch (tab) {
              case 0: return (sv.wOwn >> i) & 1;
              case 1: return (sv.rOwn >> i) & 1;
              case 2: return (sv.aOwn >> i) & 1;
              case 3: return (sv.hOwn >> i) & 1;
              case 4: return (sv.mOwn >> i) & 1;
              case 5: return sv.enchLv[i] > 0;
              default: return 1;
            }
          }
          static int item_equipped(int tab, int i) {
            switch (tab) {
              case 0: return sv.wEq == i;
              case 1: return sv.rEq == i;
              case 2: return sv.aEq == i;
              case 3: return sv.hEq == i;
              case 4: return sv.mEq == i;
              case 5: return sv.eEq == i;
              default: return 0;
            }
          }
          static int item_lvl(int tab, int i) {
            switch (tab) {
              case 0: return WEAPS[i].lvl;
              case 1: return RNGS[i].lvl;
              case 2: return ARMS[i].lvl;
              case 3: return HELMS[i].lvl;
              case 4: return MAGS[i].lvl;
              case 5: return ENCH[i].lvl;
              default: return 1;
            }
          }
          static void item_price(int tab, int i, int *coins, int *gems) {
            *coins = 0; *gems = 0;
            switch (tab) {
              case 0: *coins = WEAPS[i].coins; *gems = WEAPS[i].gems; break;
              case 1: *coins = RNGS[i].coins; *gems = RNGS[i].gems; break;
              case 2: *coins = ARMS[i].coins; *gems = ARMS[i].gems; break;
              case 3: *coins = HELMS[i].coins; *gems = HELMS[i].gems; break;
              case 4: *coins = MAGS[i].coins; *gems = MAGS[i].gems; break;
              case 5: {
                int lv = sv.enchLv[i];
                if (lv >= 3) { *coins = -1; }
                else { *coins = ENCH[i].coins * (lv + 1); *gems = ENCH[i].gems * (lv + 1); }
                break;
              }
              default: break;
            }
          }

          static void shop_build(void) {
            int i, n = tab_count(shopTab);
            shopN = 0;
            for (i = 0; i < n; i++)
              if (!shopMode || shopTab == 6 || item_owned(shopTab, i)) shopIdx[shopN++] = i;
            if (shopSel >= shopN) shopSel = shopN - 1;
            if (shopSel < 0) shopSel = 0;
            if (shopTop > shopSel) shopTop = shopSel;
            if (shopTop < 0) shopTop = 0;
          }

          static void item_action(void) {
            int tab = shopTab, i, coins, gems, lv;
            char b[72];
            if (shopN <= 0) return;
            i = shopIdx[shopSel];
            if (tab == 6) {
              if (i == 7) {
                int k;
                for (k = 0; k < 7; k++) sv.skill[k] = 0;
                toast(tr("Skills reset!", "Habilidades redefinidas!")); sfx(SFX_SEL); save_game();
                return;
              }
              if (sv.skill[i] >= 5) { toast(tr("Already at max rank", "Já está no nível máximo")); sfx(SFX_ERR); return; }
              if (skill_free() <= 0) { toast(tr("No skill points left", "Sem pontos de habilidade")); sfx(SFX_ERR); return; }
              sv.skill[i]++;
              snprintf(b, sizeof b, "%s %d", tr("Rank", "Nível"), sv.skill[i]);
              toast(b); sfx(SFX_COIN); save_game();
              return;
            }
            item_price(tab, i, &coins, &gems);
            if (tab == 5) {
              lv = sv.enchLv[i];
              if (lv > 0 && sv.eEq != i) { sv.eEq = i; toast(tr("Equipped!", "Equipado!")); sfx(SFX_SEL); save_game(); return; }
              if (lv >= 3) { toast(tr("Already at max level", "Já está no nível máximo")); sfx(SFX_ERR); return; }
              if (sv.level < item_lvl(tab, i)) { snprintf(b, sizeof b, "%s %d", tr("Requires level", "Requer nível"), item_lvl(tab, i)); toast(b); sfx(SFX_ERR); return; }
              if (sv.coins < coins) { toast(tr("Not enough coins!", "Moedas insuficientes!")); sfx(SFX_ERR); return; }
              if (sv.gems < gems) { toast(tr("Not enough gems!", "Gemas insuficientes!")); sfx(SFX_ERR); return; }
              sv.coins -= coins; sv.gems -= gems; sv.enchLv[i]++; sv.eEq = i; sv.buys++;
              toast(lv == 0 ? tr("Purchased and equipped!", "Comprado e equipado!") : tr("Enchantment upgraded!", "Encantamento evoluído!"));
              sfx(SFX_COIN); save_game(); check_ach();
              return;
            }
            if (!item_owned(tab, i)) {
              if (sv.level < item_lvl(tab, i)) { snprintf(b, sizeof b, "%s %d", tr("Requires level", "Requer nível"), item_lvl(tab, i)); toast(b); sfx(SFX_ERR); return; }
              if (sv.coins < coins) { toast(tr("Not enough coins!", "Moedas insuficientes!")); sfx(SFX_ERR); return; }
              if (sv.gems < gems) { toast(tr("Not enough gems!", "Gemas insuficientes!")); sfx(SFX_ERR); return; }
              sv.coins -= coins; sv.gems -= gems; sv.buys++;
              if (tab == 0) sv.wOwn |= 1 << i;
              else if (tab == 1) sv.rOwn |= 1 << i;
              else if (tab == 2) sv.aOwn |= 1 << i;
              else if (tab == 3) sv.hOwn |= 1 << i;
              else sv.mOwn |= 1 << i;
              sfx(SFX_COIN);
              toast(tr("Purchased and equipped!", "Comprado e equipado!"));
            } else {
              sfx(SFX_SEL);
              toast(tr("Equipped!", "Equipado!"));
            }
            if (tab == 0) sv.wEq = i;
            else if (tab == 1) sv.rEq = i;
            else if (tab == 2) sv.aEq = i;
            else if (tab == 3) sv.hEq = i;
            else sv.mEq = i;
            save_game();
            check_ach();
          }

          static void item_detail(char d[5][64]) {
            int tab = shopTab, i, coins, gems;
            memset(d, 0, 5 * 64);
            if (shopN <= 0) return;
            i = shopIdx[shopSel];
            snprintf(d[0], 64, "%s", item_name(tab, i));
            switch (tab) {
              case 0:
                snprintf(d[1], 64, "%s  %s %d", tr(WCN_EN[WEAPS[i].cls], WCN_PT[WEAPS[i].cls]), tr("Damage", "Dano"), WEAPS[i].dmg);
                snprintf(d[2], 64, "%s %d  %s %d%%", tr("Reach", "Alcance"), WEAPS[i].reach, tr("Speed", "Velocidade"), WEAPS[i].spd);
                break;
              case 1:
                snprintf(d[1], 64, "%s %d  %s %d", tr("Damage", "Dano"), RNGS[i].dmg, tr("Speed", "Velocidade"), RNGS[i].spd10 / 10);
                snprintf(d[2], 64, "%s %d", tr("Cooldown", "Recarga"), RNGS[i].cd);
                break;
              case 2: snprintf(d[1], 64, "%s +%d", tr("Health", "Vida"), ARMS[i].hp); snprintf(d[2], 64, "%s +%d%%", tr("Defense", "Defesa"), ARMS[i].def); break;
              case 3: snprintf(d[1], 64, "%s +%d", tr("Health", "Vida"), HELMS[i].hp); snprintf(d[2], 64, "%s +%d%%", tr("Defense", "Defesa"), HELMS[i].def); break;
              case 4: snprintf(d[1], 64, "%s", tr(MAGS[i].den, MAGS[i].dpt)); snprintf(d[2], 64, "%s %d", tr("Energy cost", "Custo de energia"), MAGS[i].cost); break;
              case 5: snprintf(d[1], 64, "%s", tr(ENCH[i].den, ENCH[i].dpt)); snprintf(d[2], 64, "%s %d/3", tr("Level", "Nível"), sv.enchLv[i]); break;
              default:
                if (i < 7) {
                  snprintf(d[1], 64, "%s", tr(SKILLS[i].den, SKILLS[i].dpt));
                  snprintf(d[2], 64, "%s %d/5   %s: %d", tr("Rank", "Nível"), sv.skill[i], tr("Points", "Pontos"), skill_free());
                } else snprintf(d[1], 64, "%s", tr("Refund all skill points.", "Devolve todos os pontos."));
                break;
            }
            item_price(tab, i, &coins, &gems);
            if (tab == 6) snprintf(d[3], 64, "%s", i < 7 ? tr("Cost: 1 point", "Custo: 1 ponto") : tr("Free", "Grátis"));
            else if (tab == 5) {
              if (coins < 0) snprintf(d[3], 64, "%s", tr("MAX LEVEL", "NÍVEL MÁXIMO"));
              else if (gems > 0) snprintf(d[3], 64, "%s: %d %s", sv.enchLv[i] ? tr("Upgrade", "Evoluir") : tr("Price", "Preço"), gems, tr("gems", "gemas"));
              else snprintf(d[3], 64, "%s: %d %s", sv.enchLv[i] ? tr("Upgrade", "Evoluir") : tr("Price", "Preço"), coins, tr("coins", "moedas"));
            } else if (item_equipped(tab, i)) snprintf(d[3], 64, "%s", tr("Equipped", "Equipado"));
            else if (item_owned(tab, i)) snprintf(d[3], 64, "%s", tr("Owned", "Comprado"));
            else if (gems > 0) snprintf(d[3], 64, "%s: %d %s", tr("Price", "Preço"), gems, tr("gems", "gemas"));
            else snprintf(d[3], 64, "%s: %d %s", tr("Price", "Preço"), coins, tr("coins", "moedas"));
            if (tab < 6 && sv.level < item_lvl(tab, i) && !item_owned(tab, i)) snprintf(d[4], 64, "%s %d", tr("Requires level", "Requer nível"), item_lvl(tab, i));
          }

          static void shop_row(float y, int tab, int li, int sel) {
            char b[40];
            int i = shopIdx[li], coins, gems;
            float x = 8, w = 284, h = 22;
            rect(x, y, w, h, sel ? C(255, 60, 80, 255) : C(100, 24, 40, 255));
            rect(x + 2, y + 2, w - 4, h - 4, sel ? C(70, 14, 30, 255) : C(26, 8, 18, 255));
            text(x + 8, y + 2, 0.45f, sel ? C(255, 230, 230, 255) : C(215, 175, 180, 255), item_name(tab, i));
            item_price(tab, i, &coins, &gems);
            if (tab == 6) {
              if (i < 7) snprintf(b, sizeof b, "%s %d/5", tr("Rank", "Nível"), sv.skill[i]); else b[0] = 0;
              text(x + w - 8 - textw(b, 0.42f), y + 3, 0.42f, C(255, 230, 150, 255), b);
            } else if (tab == 5) {
              if (sv.enchLv[i] == 0) {
                if (gems > 0) { snprintf(b, sizeof b, "%d", gems); text(x + w - 22 - textw(b, 0.42f), y + 3, 0.42f, C(180, 240, 255, 255), b); gem_icon(x + w - 14, y + 11, 6); }
                else { snprintf(b, sizeof b, "%d", coins); text(x + w - 22 - textw(b, 0.42f), y + 3, 0.42f, C(255, 230, 150, 255), b); coin_icon(x + w - 14, y + 11, 5); }
              } else {
                snprintf(b, sizeof b, "%s%d/3", sv.eEq == i ? "* " : "", sv.enchLv[i]);
                text(x + w - 8 - textw(b, 0.42f), y + 3, 0.42f, C(120, 255, 160, 255), b);
              }
            } else if (item_equipped(tab, i)) {
              snprintf(b, sizeof b, "%s", tr("EQUIPPED", "EQUIPADO"));
              text(x + w - 8 - textw(b, 0.42f), y + 3, 0.42f, C(120, 255, 160, 255), b);
            } else if (item_owned(tab, i)) {
              snprintf(b, sizeof b, "%s", tr("OWNED", "COMPRADO"));
              text(x + w - 8 - textw(b, 0.42f), y + 3, 0.42f, C(200, 200, 210, 255), b);
            } else if (gems > 0) {
              snprintf(b, sizeof b, "%d", gems);
              text(x + w - 22 - textw(b, 0.42f), y + 3, 0.42f, C(180, 240, 255, 255), b);
              gem_icon(x + w - 14, y + 11, 6);
            } else {
              snprintf(b, sizeof b, "%d", coins);
              text(x + w - 22 - textw(b, 0.42f), y + 3, 0.42f, C(255, 230, 150, 255), b);
              coin_icon(x + w - 14, y + 11, 5);
            }
          }

